<svg xmlns="http://www.w3.org/2000/svg" width="560" height="178" viewBox="0 0 560 178" role="img" aria-labelledby="title">
  <title id="title">Delete 85 at index 1</title>
  <style>
    text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .slot { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
    .value { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
    .highlight { fill: #a7f3d0; stroke: #16835e; }
    .remove { opacity: 0; animation: remove 5s infinite; }
    .shift { animation: shift 5s infinite; }
    @keyframes remove { 0%, 14% { opacity: 1; } 37%, 100% { opacity: 0; transform: translateY(25px); } }
    @keyframes shift { 0%, 37% { transform: translateX(96px); } 60%, 100% { transform: translateX(0); } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .slot { stroke: #a8b9cf; }
    }
    @media (prefers-reduced-motion: reduce) { .moving { animation: none; } }
  </style>
  <text class="label" x="280" y="26">Delete 85 at index 1</text>
  <text class="label" x="280" y="53">Remove the value, then shift left</text>
  <text class="label" x="136" y="94">0</text>
  <rect class="slot" x="93" y="104" width="86" height="42" rx="6"/>
  <text class="label" x="232" y="94">1</text>
  <rect class="slot" x="189" y="104" width="86" height="42" rx="6"/>
  <text class="label" x="328" y="94">2</text>
  <rect class="slot" x="285" y="104" width="86" height="42" rx="6"/>
  <text class="label" x="424" y="94">3</text>
  <rect class="slot" x="381" y="104" width="86" height="42" rx="6"/>
  <g class="">
    <rect class="value" x="93" y="104" width="86" height="42" rx="6"/>
    <text x="136" y="131">72</text>
  </g>
  <g class="moving remove">
    <rect class="value highlight" x="189" y="104" width="86" height="42" rx="6"/>
    <text x="232" y="131">85</text>
  </g>
  <g class="moving shift">
    <rect class="value" x="189" y="104" width="86" height="42" rx="6"/>
    <text x="232" y="131">91</text>
  </g>
</svg>
