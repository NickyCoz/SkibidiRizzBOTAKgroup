<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Traversing parent references on the linked nodes</title><desc id="desc">A reader pointer moves from r3 to r2 to r1 and appends those IDs to the visited output. Each node retains its parent link. The static diagram numbers the traversal.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}

.reader{animation:walk 12s linear infinite}.visit1{animation:v1 12s steps(1) infinite}.visit2{animation:v2 12s steps(1) infinite}.visit3{animation:v3 12s steps(1) infinite}
@keyframes walk{0%,23%{transform:translateX(0)}34%,56%{transform:translateX(255px)}67%,100%{transform:translateX(510px)}}
@keyframes v1{0%,100%{opacity:1}}@keyframes v2{0%,33%{opacity:0}34%,100%{opacity:1}}@keyframes v3{0%,66%{opacity:0}67%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.reader{animation:none;transform:translateX(510px)}.visit1,.visit2,.visit3{animation:none;opacity:1}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Follow each revision&#x27;s parent reference.</text><text x="24" y="56" class="muted small" text-anchor="start">Each stored node links to its predecessor; None ends the traversal.</text><rect x="35" y="132" width="180" height="96" rx="6" class="blue"/><text x="53" y="164" class="strong" text-anchor="start">r3</text><path class="rule" d="M35 180 L215 180"/><text x="53" y="209" class="mono" text-anchor="start">parent: r2</text><path class="edge" d="M220 199 H277" marker-end="url(#arrow)"/><rect x="290" y="132" width="180" height="96" rx="6" class="blue"/><text x="308" y="164" class="strong" text-anchor="start">r2</text><path class="rule" d="M290 180 L470 180"/><text x="308" y="209" class="mono" text-anchor="start">parent: r1</text><path class="edge" d="M475 199 H532" marker-end="url(#arrow)"/><rect x="545" y="132" width="180" height="96" rx="6" class="blue"/><text x="563" y="164" class="strong" text-anchor="start">r1</text><path class="rule" d="M545 180 L725 180"/><text x="563" y="209" class="mono" text-anchor="start">parent: None</text><text x="35" y="304" class="strong" text-anchor="start">Visited order:</text><text x="35" y="383" class="muted small" text-anchor="start">The reader visits the nodes; the nodes and parent links remain in place.</text><g class="reader"><path d="M115 115 L125 130 L135 115 Z" class="cursor"/><text x="125" y="101" class="greenText strong" text-anchor="middle">read</text></g><g class="visit1"><text x="35" y="341" class="mono" text-anchor="start">r3</text></g><g class="visit2"><text x="140" y="341" class="mono" text-anchor="start">r2</text></g><g class="visit3"><text x="245" y="341" class="mono" text-anchor="start">r1; stop</text></g></svg>