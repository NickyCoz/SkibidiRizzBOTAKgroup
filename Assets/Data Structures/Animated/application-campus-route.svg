<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img" aria-labelledby="title desc">
  <title id="title">Neil finds a shorter route across campus</title>
  <desc id="desc">The green route uses two corridors. The other uses three.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#16835e"/></marker></defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .active { fill: none; stroke: #16835e; stroke-width: 3px; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } .edge { stroke: #b8c7db; } .active { stroke: #4ade80; } }
  .route { stroke-dasharray: 390; animation: trace-route 6s infinite; }
@keyframes trace-route { 0%, 15% { stroke-dashoffset: 390; } 40%, 49% { stroke-dashoffset: 195; } 73%, 100% { stroke-dashoffset: 0; } }
@keyframes reveal { 0%, 35% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes trace-short { 0%, 15% { stroke-dashoffset: 80; opacity: 0; } 18% { opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="280" y="26" class="label">Neil finds a shorter route across campus</text>
  <path class="active route" d="M85 78H280H475"/>
  <path class="edge" d="M85 78L190 144H370L475 78"/>
  <rect x="46" y="58" width="78" height="40" rx="4" fill="#a7f3d0" stroke="#16835e" stroke-width="2"/>
  <text x="85" y="83" class="value">Room A</text>
  <rect x="241" y="58" width="78" height="40" rx="4" fill="#a7f3d0" stroke="#16835e" stroke-width="2"/>
  <text x="280" y="83" class="value">Room B</text>
  <rect x="436" y="58" width="78" height="40" rx="4" fill="#a7f3d0" stroke="#16835e" stroke-width="2"/>
  <text x="475" y="83" class="value">Room C</text>
  <rect x="151" y="124" width="78" height="40" rx="4" fill="#dbeafe" stroke="#4169a9" stroke-width="2"/>
  <text x="190" y="149" class="value">Room D</text>
  <rect x="331" y="124" width="78" height="40" rx="4" fill="#dbeafe" stroke="#4169a9" stroke-width="2"/>
  <text x="370" y="149" class="value">Room E</text>
  <text x="280" y="200" class="label">The green route uses two corridors. The other uses three.</text>
</svg>
