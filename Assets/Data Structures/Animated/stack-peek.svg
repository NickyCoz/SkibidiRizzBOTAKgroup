<svg xmlns="http://www.w3.org/2000/svg" width="480" height="207" viewBox="0 0 480 207" role="img" aria-labelledby="title desc">
  <title id="title">Peek at the top of the stack</title>
  <desc id="desc">Peek reads B. Both items stay in place.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-weight: 700; font-size: 19px; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .focus { fill: #a7f3d0; stroke: #16835e; }
    .readout { fill: #fef3c7; stroke: #92630e; stroke-width: 2px; }
    .connector { fill: none; stroke: #16835e; stroke-width: 2.5px; stroke-dasharray: 4 4; }
    .focus { animation: read-item 5s infinite; }
    .result { animation: show-result 5s infinite; }
    @keyframes read-item {
      0%, 16% { fill: #dbeafe; stroke: #4169a9; }
      33%, 100% { fill: #a7f3d0; stroke: #16835e; }
    }
    @keyframes show-result {
      0%, 35% { opacity: 0; }
      52%, 100% { opacity: 1; }
    }
    .lens { animation: inspect 5s ease-in-out infinite; }
    @keyframes inspect {
      0%, 12% { opacity: 0; transform: translate(18px, -12px); }
      33%, 100% { opacity: 1; transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .focus, .result, .lens { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .connector { stroke: #4ade80; }
    }
  </style>
  <text class="label heading" x="240" y="26">Peek at the top of the stack</text>
  <text class="label" x="124" y="60">Top</text>
  <rect class="tile focus" x="75" y="71" width="98" height="40" rx="6"/>
  <text x="124" y="97">B</text>
  <rect class="tile" x="75" y="117" width="98" height="40" rx="6"/>
  <text x="124" y="143">A</text>
  <g transform="translate(166 75)" aria-hidden="true">
    <g class="lens">
      <path d="M7 7 L16 16" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
      <path d="M7 7 L16 16" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <circle r="10" fill="#ecfdf5" stroke="#f8fafc" stroke-width="5"/>
      <circle r="10" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    </g>
  </g>
  <rect class="readout" x="287" y="71" width="151" height="44" rx="6"/>
  <g class="result">
    <path class="connector" d="M176 91 H285"/>
    <text x="362" y="99">Peek returns B</text>
  </g>
  <text class="label" x="240" y="188">Both items stay in place.</text>
</svg>
