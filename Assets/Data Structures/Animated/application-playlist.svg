<svg xmlns="http://www.w3.org/2000/svg" width="560" height="213" viewBox="0 0 560 213" role="img" aria-labelledby="title desc">
  <title id="title">Add a song between two tracks</title>
  <desc id="desc">The new song points to Track 2 first. Track 1 then points to the new song.</desc>
  <defs>
    <linearGradient id="cover" x2="1" y2="1"><stop stop-color="#314986"/><stop offset="1" stop-color="#8665bc"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16835e"/></marker>
    <g id="note" fill="#f8fafc"><path d="M-1 8V-11l13-3v17h-3V-8L2-6V8Z"/><ellipse cx="-3" cy="8" rx="5" ry="3.5"/><ellipse cx="8" cy="3" rx="4.5" ry="3"/></g>
  </defs>
  <style>
    text { font: 15px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } }
  .first-link, .second-link { stroke-dasharray: 80; animation: trace-short 6s infinite backwards; }
.second-link { animation-delay: 1.3s; }
@keyframes reveal { 0%, 35% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes trace-short { 0%, 15% { stroke-dashoffset: 80; opacity: 0; } 18% { opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text class="label heading" x="280" y="28">Insert a song into a playlist</text>
  <path class="first-link" d="M344 105H403" fill="none" stroke="#16835e" stroke-width="3" marker-end="url(#arrow)"/>
  <path class="second-link" d="M155 105H214" fill="none" stroke="#16835e" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="184" y="90">2</text>
  <text class="label" x="373" y="90">1</text>
  <rect x="28" y="65" width="124" height="82" rx="12" fill="#dbeafe" stroke="#4169a9" stroke-width="2"/>
  <rect x="67" y="75" width="46" height="38" rx="6" fill="url(#cover)"/>
  <use href="#note" x="90" y="96"/>
  <text x="90" y="134">Track 1</text>
  <rect x="218" y="65" width="124" height="82" rx="12" fill="#a7f3d0" stroke="#16835e" stroke-width="2"/>
  <rect x="257" y="75" width="46" height="38" rx="6" fill="url(#cover)"/>
  <use href="#note" x="280" y="96"/>
  <text x="280" y="134">New song</text>
  <rect x="408" y="65" width="124" height="82" rx="12" fill="#dbeafe" stroke="#4169a9" stroke-width="2"/>
  <rect x="447" y="75" width="46" height="38" rx="6" fill="url(#cover)"/>
  <use href="#note" x="470" y="96"/>
  <text x="470" y="134">Track 2</text>
  <text class="label" x="280" y="184">Link the new song first, then update Track 1.</text>
</svg>
