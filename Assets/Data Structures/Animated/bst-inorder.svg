<svg xmlns="http://www.w3.org/2000/svg" width="420" height="254" viewBox="0 0 420 254" role="img" aria-labelledby="title desc">
  <title id="title">Inorder traversal on the binary search tree</title>
  <desc id="desc">The numbered badges show the visit order. First visit 1, then 3, then the root 8, and finally 10.</desc>
  <style>
    text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5px; }
    .key { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5px; }
    .badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
    }
    .key { animation: visit 6s var(--delay) infinite; }
    @keyframes visit {
      0%, 18% { fill: #a7f3d0; stroke: #16835e; }
      20%, 100% { fill: #dbeafe; stroke: #4169a9; }
    }
    @media (prefers-reduced-motion: reduce) { .key { animation: none; } }
  </style>
  <text class="label" x="210" y="25">Inorder traversal</text>
  <path class="edge" d="M210 66 L140 132 L80 198 M210 66 L280 132"/>
  <circle class="key" style="--delay:2.5s" cx="210" cy="66" r="22"/>
  <text x="210" y="72">8</text>
  <circle class="badge" cx="232" cy="49" r="11"/>
  <text class="badge-text" x="232" y="53">3</text>
  <circle class="key" style="--delay:1.25s" cx="140" cy="132" r="22"/>
  <text x="140" y="138">3</text>
  <circle class="badge" cx="162" cy="115" r="11"/>
  <text class="badge-text" x="162" y="119">2</text>
  <circle class="key" style="--delay:3.75s" cx="280" cy="132" r="22"/>
  <text x="280" y="138">10</text>
  <circle class="badge" cx="302" cy="115" r="11"/>
  <text class="badge-text" x="302" y="119">4</text>
  <circle class="key" style="--delay:0s" cx="80" cy="198" r="22"/>
  <text x="80" y="204">1</text>
  <circle class="badge" cx="102" cy="181" r="11"/>
  <text class="badge-text" x="102" y="185">1</text>
  <text class="label" x="210" y="242">Badges show when each key is visited</text>
</svg>
