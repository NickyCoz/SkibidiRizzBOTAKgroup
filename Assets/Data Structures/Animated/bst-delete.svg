<svg xmlns="http://www.w3.org/2000/svg" width="560" height="305" viewBox="0 0 560 305" role="img" aria-labelledby="title desc">
  <title id="title">Delete a BST node with two children</title>
  <desc id="desc">Find node 3, choose 6 as its successor, then replace 3 with 6 and reconnect 7 where 6 used to be.</desc>
  <style>
    text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5px; }
    .node { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .highlight { fill: #a7f3d0; stroke: #16835e; }
    .find { visibility: hidden; animation: find 9s infinite; }
    .choose { visibility: hidden; animation: choose 9s infinite; }
    .replace { animation: replace 9s infinite; }
    @keyframes find { 0%, 29.99% { visibility: visible; } 30%, 100% { visibility: hidden; } }
    @keyframes choose { 0%, 29.99% { visibility: hidden; } 30%, 59.99% { visibility: visible; } 60%, 100% { visibility: hidden; } }
    @keyframes replace { 0%, 59.99% { visibility: hidden; } 60%, 100% { visibility: visible; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
    }
  </style>
  <g class="frame find">
    <text class="label" x="280" y="39">1. Find 3. It has two children.</text>
    <path class="edge" d="M280 80 L195 142"/>
    <path class="edge" d="M280 80 L365 142"/>
    <path class="edge" d="M195 142 L130 204"/>
    <path class="edge" d="M195 142 L260 204"/>
    <path class="edge" d="M260 204 L318 266"/>
    <circle class="node" cx="280" cy="80" r="22"/>
    <text x="280" y="86">8</text>
    <circle class="node highlight" cx="195" cy="142" r="22"/>
    <text x="195" y="148">3</text>
    <circle class="node" cx="365" cy="142" r="22"/>
    <text x="365" y="148">10</text>
    <circle class="node" cx="130" cy="204" r="22"/>
    <text x="130" y="210">1</text>
    <circle class="node" cx="260" cy="204" r="22"/>
    <text x="260" y="210">6</text>
    <circle class="node" cx="318" cy="266" r="22"/>
    <text x="318" y="272">7</text>
  </g>
  <g class="frame choose">
    <text class="label" x="280" y="39">2. Pick 6, the smallest key in the right subtree.</text>
    <path class="edge" d="M280 80 L195 142"/>
    <path class="edge" d="M280 80 L365 142"/>
    <path class="edge" d="M195 142 L130 204"/>
    <path class="edge" d="M195 142 L260 204"/>
    <path class="edge" d="M260 204 L318 266"/>
    <circle class="node" cx="280" cy="80" r="22"/>
    <text x="280" y="86">8</text>
    <circle class="node" cx="195" cy="142" r="22"/>
    <text x="195" y="148">3</text>
    <circle class="node" cx="365" cy="142" r="22"/>
    <text x="365" y="148">10</text>
    <circle class="node" cx="130" cy="204" r="22"/>
    <text x="130" y="210">1</text>
    <circle class="node highlight" cx="260" cy="204" r="22"/>
    <text x="260" y="210">6</text>
    <circle class="node" cx="318" cy="266" r="22"/>
    <text x="318" y="272">7</text>
  </g>
  <g class="frame replace">
    <text class="label" x="280" y="39">3. Replace 3 with 6 and reconnect 7.</text>
    <path class="edge" d="M280 80 L195 142"/>
    <path class="edge" d="M280 80 L365 142"/>
    <path class="edge" d="M195 142 L130 204"/>
    <path class="edge" d="M195 142 L260 204"/>
    <circle class="node" cx="280" cy="80" r="22"/>
    <text x="280" y="86">8</text>
    <circle class="node highlight" cx="195" cy="142" r="22"/>
    <text x="195" y="148">6</text>
    <circle class="node" cx="365" cy="142" r="22"/>
    <text x="365" y="148">10</text>
    <circle class="node" cx="130" cy="204" r="22"/>
    <text x="130" y="210">1</text>
    <circle class="node highlight" cx="260" cy="204" r="22"/>
    <text x="260" y="210">7</text>
  </g>
</svg>
