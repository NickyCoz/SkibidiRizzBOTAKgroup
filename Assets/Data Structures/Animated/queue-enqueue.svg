<svg xmlns="http://www.w3.org/2000/svg" width="480" height="155" viewBox="0 0 480 155" role="img" aria-labelledby="title">
  <title id="title">Enqueue Darren behind Nicky</title>
  <style>
    .moving { animation: operation 4s infinite; }
    @keyframes operation { 0%, 15% { transform: translateX(125px); opacity: 0; } 45%, 100% { transform: translateX(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .moving { animation: none; } }
  </style>
  <style>
    text { paint-order: stroke; stroke: #f8fafc; stroke-width: 2.5px; stroke-linejoin: round; }
  </style>
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
    <text x="240" y="28">Enqueue Darren at the rear</text>
      <rect x="123" y="61" width="112" height="42" rx="6" fill="#dbeafe" stroke="#1e40af"/>
      <text x="179" y="88">Nicky</text>
    <g class="moving">
      <rect x="245" y="61" width="112" height="42" rx="6" fill="#a7f3d0" stroke="#1e40af"/>
      <text x="301" y="88">Darren</text>
    </g>
    <text x="179" y="132">Front side</text>
    <text x="301" y="132">Rear side</text>
  </g>
</svg>
