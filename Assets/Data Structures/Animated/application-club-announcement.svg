<svg xmlns="http://www.w3.org/2000/svg" width="560" height="259" viewBox="0 0 560 259" role="img" aria-labelledby="title desc">
  <title id="title">A club announcement spreads in rounds</title>
  <desc id="desc">Nicky starts with the announcement. Darren and Neil hear in round 1. Glen hears in round 2 through Darren.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; }
    .person { fill: #a7f3d0; stroke: #16835e; stroke-width: 2px; }
    .round { fill: #334155; stroke: #f8fafc; stroke-width: 1.5px; }
    .round-label { fill: #fff; font-size: 12px; font-weight: 700; }
    .first-right { animation: first-right 7s ease-in-out infinite; }
    .first-down { animation: first-down 7s ease-in-out infinite; }
    .second-down { animation: second-down 7s ease-in-out infinite; }
    .one { animation: round-one 7s infinite; }
    .two { animation: round-two 7s infinite; }
    @keyframes first-right {
      0%, 12% { opacity: 0; transform: translateX(-100px); }
      16% { opacity: 1; } 36% { opacity: 1; transform: translateX(100px); }
      40%, 100% { opacity: 0; transform: translateX(100px); }
    }
    @keyframes first-down {
      0%, 12% { opacity: 0; transform: translateY(-20px); }
      16% { opacity: 1; } 36% { opacity: 1; transform: translateY(20px); }
      40%, 100% { opacity: 0; transform: translateY(20px); }
    }
    @keyframes second-down {
      0%, 47% { opacity: 0; transform: translateY(-20px); }
      51% { opacity: 1; } 69% { opacity: 1; transform: translateY(20px); }
      74%, 100% { opacity: 0; transform: translateY(20px); }
    }
    @keyframes round-one { 0%, 32% { fill: #dbeafe; stroke: #4169a9; } 42%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @keyframes round-two { 0%, 67% { fill: #dbeafe; stroke: #4169a9; } 77%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
    }
  </style>
  <text class="label heading" x="280" y="28">Who hears the club announcement?</text>
  <path class="edge" d="M136 86 H420 V184 H136 Z"/>
  <g transform="translate(278 86)" aria-hidden="true">
    <g class="first-right">
      <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#fef3c7" stroke="#92630e" stroke-width="1.5"/>
      <path d="M-10-6L0 1 10-6" fill="none" stroke="#92630e" stroke-width="1.5"/>
    </g>
  </g>
  <g transform="translate(136 135)" aria-hidden="true">
    <g class="first-down">
      <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#fef3c7" stroke="#92630e" stroke-width="1.5"/>
      <path d="M-10-6L0 1 10-6" fill="none" stroke="#92630e" stroke-width="1.5"/>
    </g>
  </g>
  <g transform="translate(420 135)" aria-hidden="true">
    <g class="second-down">
      <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#fef3c7" stroke="#92630e" stroke-width="1.5"/>
      <path d="M-10-6L0 1 10-6" fill="none" stroke="#92630e" stroke-width="1.5"/>
    </g>
  </g>
  <rect class="person" x="82" y="66" width="108" height="40" rx="9"/>
  <text x="136" y="92">Nicky</text>
  <rect class="round" x="167" y="54" width="61" height="22" rx="11"/>
  <text class="round-label" x="197" y="69">Start</text>
  <rect class="person one" x="366" y="66" width="108" height="40" rx="9"/>
  <text x="420" y="92">Darren</text>
  <rect class="round" x="451" y="54" width="61" height="22" rx="11"/>
  <text class="round-label" x="481" y="69">Round 1</text>
  <rect class="person one" x="82" y="164" width="108" height="40" rx="9"/>
  <text x="136" y="190">Neil</text>
  <rect class="round" x="167" y="152" width="61" height="22" rx="11"/>
  <text class="round-label" x="197" y="167">Round 1</text>
  <rect class="person two" x="366" y="164" width="108" height="40" rx="9"/>
  <text x="420" y="190">Glen</text>
  <rect class="round" x="451" y="152" width="61" height="22" rx="11"/>
  <text class="round-label" x="481" y="167">Round 2</text>
  <text class="label" x="280" y="237">One round for direct friends. Two rounds for Glen.</text>
</svg>
