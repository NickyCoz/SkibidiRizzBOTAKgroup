<svg xmlns="http://www.w3.org/2000/svg" width="560" height="255" viewBox="0 0 560 255" role="img" aria-labelledby="title desc">
  <title id="title">Find the successor of 3 after inserting 6</title>
  <desc id="desc">Go right from 3. The smallest key in that subtree is 6.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#16835e"/></marker></defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-weight: 700; font-size: 19px; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .mark { fill: #a7f3d0; stroke: #16835e; }
    .edge, .route { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .route { stroke: #16835e; stroke-width: 3px; }
    .mark { animation: mark 5s var(--delay) infinite backwards; }
    .trace { animation: reveal 5s var(--delay) infinite backwards; }
    .answer, .result { animation: reveal 5s infinite; }
    @keyframes mark { 0%, 12% { fill: #dbeafe; stroke: #4169a9; } 27%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @keyframes reveal { 0%, 34% { opacity: .12; } 53%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-color-scheme: dark) {
      .label, .result { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .route { stroke: #4ade80; }
      #arrow path { fill: #4ade80; }
    }
    .result { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; }
  </style>
  <text class="label heading" x="280" y="27">Find the successor of 3 after inserting 6</text>
  <path class="edge" d="M280 63 L166 127"/>
  <path class="edge" d="M280 63 L394 127"/>
  <path class="edge" d="M166 127 L100 187"/>
  <path class="edge" d="M166 127 L226 187"/>
<path class="route trace" style="--delay:0.5s" d="M180.14213562373095 141.14213562373095 L209.02943725152286 170.02943725152286" marker-end="url(#arrow)"/>
<circle class="tile"  cx="100" cy="187" r="19"/>
  <text class="ink" x="100" y="192">1</text>
<circle class="tile mark" style="--delay:0s" cx="166" cy="127" r="19"/>
  <text class="ink" x="166" y="132">3</text>
<circle class="tile mark" style="--delay:0.85s" cx="226" cy="187" r="19"/>
  <text class="ink" x="226" y="192">6</text>
<circle class="tile"  cx="280" cy="63" r="19"/>
  <text class="ink" x="280" y="68">8</text>
<circle class="tile"  cx="394" cy="127" r="19"/>
  <text class="ink" x="394" y="132">10</text>
  <text class="label answer" x="280" y="239">Go right from 3. The smallest key in that subtree is 6.</text>
</svg>
