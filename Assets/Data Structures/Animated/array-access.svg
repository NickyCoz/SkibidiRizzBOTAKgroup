<svg xmlns="http://www.w3.org/2000/svg" width="560" height="187" viewBox="0 0 560 187" role="img" aria-labelledby="title desc">
  <title id="title">Access index 1</title>
  <desc id="desc">Read 85 directly. The array stays the same.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 19px; font-weight: 700; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .target { fill: #a7f3d0; stroke: #16835e; }
    
    .target { animation: read 5s infinite; }
    .readout { animation: readout 5s infinite; }
    @keyframes read { 0%, 16% { fill: #dbeafe; stroke: #4169a9; } 36%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @keyframes readout { 0%, 33% { opacity: 0; } 55%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } }
  </style>
  <text class="label title" x="280" y="26">Access index 1</text>
  <g>
    <text class="label" x="188" y="62">0</text>
    <rect class="tile" x="150" y="73" width="76" height="45" rx="7"/>
    <text x="188" y="102">72</text>
  </g>
  <g>
    <text class="label" x="276" y="62">1</text>
    <rect class="tile target" x="238" y="73" width="76" height="45" rx="7"/>
    <text x="276" y="102">85</text>
  </g>
  <g>
    <text class="label" x="364" y="62">2</text>
    <rect class="tile" x="326" y="73" width="76" height="45" rx="7"/>
    <text x="364" y="102">91</text>
  </g>
  <text class="label readout" x="276" y="142">Returns 85</text>
  <text class="label" x="280" y="171">Read 85 directly. The array stays the same.</text>
</svg>
