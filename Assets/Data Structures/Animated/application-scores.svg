<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img" aria-labelledby="title desc">
  <title id="title">Nicky looks up his second quiz score</title>
  <desc id="desc">The quiz at index 1 has score 85.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#16835e"/></marker></defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .active { fill: none; stroke: #16835e; stroke-width: 3px; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } .edge { stroke: #b8c7db; } .active { stroke: #4ade80; } }
  .target-score { animation: score 5s infinite; }
@keyframes score { 0%, 20% { fill: #fff; stroke: #4169a9; } 45%, 100% { fill: #a7f3d0; stroke: #16835e; } }
.lookup { animation: reveal 5s infinite; }
@keyframes reveal { 0%, 35% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes trace-short { 0%, 15% { stroke-dashoffset: 80; opacity: 0; } 18% { opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="280" y="26" class="label">Nicky looks up his second quiz score</text>
  <rect x="69" y="46" width="422" height="121" rx="7" fill="#eff6ff" stroke="#4169a9" stroke-width="2"/>
  <text x="280" y="68" class="value">Nicky’s quiz scores</text>
  <rect x="126" y="84" width="88" height="41" rx="7" fill="#fff" stroke="#4169a9" stroke-width="2"/>
  <text x="170" y="110" class="value">72</text>
  <text x="170" y="150" class="value">Index 0</text>
  <rect class="target-score" x="236" y="84" width="88" height="41" rx="7" fill="#a7f3d0" stroke="#16835e" stroke-width="2"/>
  <text x="280" y="110" class="value">85</text>
  <text x="280" y="150" class="value">Index 1</text>
  <rect x="346" y="84" width="88" height="41" rx="7" fill="#fff" stroke="#4169a9" stroke-width="2"/>
  <text x="390" y="110" class="value">91</text>
  <text x="390" y="150" class="value">Index 2</text>
  <text x="280" y="200" class="label">The quiz at index 1 has score 85.</text>
</svg>
