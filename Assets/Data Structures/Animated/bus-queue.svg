<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-labelledby="title desc">
  <title id="title">Three people queue to board a bus</title>
  <desc id="desc">Nicky stands closest to the bus door and boards first. Darren is next, then Neil.</desc>
  <defs>
    <linearGradient id="body" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <g id="person" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cy="-38" r="11" fill="#f8fafc"/>
      <path d="M0-26V6 M-14-13L0-22L13-11 M0 6L-11 27 M0 6L12 27"/>
    </g>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#16835e"/></marker>
  </defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .bus-label { stroke: none; font-size: 13px; font-weight: 700; }
    .ground { stroke: #64748b; stroke-width: 2; opacity: .65; }
    @media (prefers-color-scheme: dark) { text { fill: #f8fafc; stroke: #111827; } .bus-label { fill: #0f172a; } }
  .boarding { animation: board 6s ease-in-out infinite; }
@keyframes board { 0%, 20% { transform: translateX(0); opacity: 1; } 56% { transform: translateX(-72px); opacity: 1; } 69%, 100% { transform: translateX(-79px); opacity: 0; } }
@keyframes reveal { 0%, 35% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes trace-short { 0%, 15% { stroke-dashoffset: 80; opacity: 0; } 18% { opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path class="ground" d="M25 165H535"/>
  <rect x="29" y="62" width="169" height="86" rx="13" fill="url(#body)" stroke="#92400e" stroke-width="2"/>
  <path d="M37 116H193" stroke="#b45309" stroke-width="3"/>
  <rect x="42" y="73" width="31" height="32" rx="4" fill="#dbeafe" stroke="#4169a9"/>
  <rect x="80" y="73" width="31" height="32" rx="4" fill="#dbeafe" stroke="#4169a9"/>
  <rect x="118" y="73" width="26" height="32" rx="4" fill="#dbeafe" stroke="#4169a9"/>
  <rect x="151" y="73" width="34" height="67" rx="3" fill="#334155"/>
  <path d="M168 77V137" stroke="#cbd5e1"/>
  <path d="M155 102H181" stroke="#cbd5e1"/>
  <text class="bus-label" x="99" y="135">BUS</text>
  <circle cx="64" cy="149" r="13" fill="#334155"/><circle cx="64" cy="149" r="5" fill="#cbd5e1"/>
  <circle cx="141" cy="149" r="13" fill="#334155"/><circle cx="141" cy="149" r="5" fill="#cbd5e1"/>
  <path d="M229 115H203" fill="none" stroke="#16835e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <use class="boarding" href="#person" x="256" y="131" color="#16835e"/>
  <use href="#person" x="364" y="131" color="#54739a"/>
  <use href="#person" x="472" y="131" color="#54739a"/>
  <text x="256" y="65">Front</text><text x="472" y="65">Rear</text>
  <text x="256" y="185">Nicky</text><text x="364" y="185">Darren</text><text x="472" y="185">Neil</text>
  <text x="280" y="217">Nicky boards first because he arrived first.</text>
</svg>
