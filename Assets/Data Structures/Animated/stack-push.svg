<svg xmlns="http://www.w3.org/2000/svg" width="480" height="233" viewBox="0 0 480 233" role="img" aria-labelledby="title">
  <title id="title">Push B onto the stack above A</title>
  <style>
    .moving { animation: operation 5.5s ease-in-out infinite; }
    @keyframes operation {
      0%, 14% { transform: translate(145px, 46px); }
      30% { transform: translate(145px, -38px); }
      52% { transform: translate(0, -38px); }
      68%, 100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .moving { animation: none; } }
  </style>
  <style>
    text { paint-order: stroke; stroke: #f8fafc; stroke-width: 2.5px; stroke-linejoin: round; }
  </style>
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
    <text x="240" y="28">Push B onto the top</text>
    <path d="M172 191 H308 M320 191 H450" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="240" y="216">Stack</text>
    <text x="385" y="216">Off the stack</text>
      <rect x="186" y="144" width="108" height="42" rx="6" fill="#dbeafe" stroke="#1e40af"/>
      <text x="240" y="171">A</text>
    <g class="moving">
      <rect x="186" y="98" width="108" height="42" rx="6" fill="#a7f3d0" stroke="#1e40af"/>
      <text x="240" y="125">B</text>
    </g>
  </g>
</svg>
