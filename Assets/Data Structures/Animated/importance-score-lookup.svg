<svg xmlns="http://www.w3.org/2000/svg" width="560" height="235" viewBox="0 0 560 235" role="img" aria-labelledby="title desc">
  <title id="title">Find a score by its position</title>
  <desc id="desc">A program asks for the second score. It uses index 1 to read 85 directly from an array holding 72, 85, and 91.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16835e"/></marker></defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .selected { fill: #a7f3d0; stroke: #16835e; }
    .arrow { stroke: #16835e; stroke-width: 2.5px; fill: none; marker-end: url(#arrow); }
    .pointer { animation: point 5.5s ease-in-out infinite; }
    .selected { animation: select 5.5s infinite; }
    .answer { animation: answer 5.5s infinite; }
    @keyframes point { 0%, 14% { opacity: 0; transform: translateY(-7px); } 39%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes select { 0%, 34% { fill: #dbeafe; stroke: #4169a9; } 50%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @keyframes answer { 0%, 50% { opacity: 0; } 66%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pointer, .selected, .answer { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .arrow { stroke: #4ade80; }
      #arrow path { fill: #4ade80; }
    }
  </style>
  <text class="label heading" x="280" y="27">The program asks for the second score</text>
  <text class="label" x="280" y="58">Use index 1</text>
  <path class="arrow pointer" d="M280 66 V87"/>
  <text class="label" x="157" y="108">Index 0</text>
  <text class="label" x="280" y="108">Index 1</text>
  <text class="label" x="403" y="108">Index 2</text>
  <rect class="tile" x="104" y="120" width="106" height="45" rx="7"/>
  <rect class="tile selected" x="227" y="120" width="106" height="45" rx="7"/>
  <rect class="tile" x="350" y="120" width="106" height="45" rx="7"/>
  <text x="157" y="149">72</text>
  <text x="280" y="149">85</text>
  <text x="403" y="149">91</text>
  <g class="answer">
    <path class="arrow" d="M280 173 V188"/>
    <text class="label" x="280" y="214">The program reads 85 directly.</text>
  </g>
</svg>
