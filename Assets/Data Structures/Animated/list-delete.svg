<svg xmlns="http://www.w3.org/2000/svg" width="560" height="227" viewBox="0 0 560 227" role="img" aria-labelledby="title desc">
  <title id="title">Delete 85 from the list</title>
  <desc id="desc">The arrow from 72 bends past 85 to reach 91. The detached node 85 then moves away.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
    .changed { fill: #a7f3d0; stroke: #16835e; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .head-link, .middle-link { stroke: #16835e; marker-end: url(#active-arrow); }
    .middle { opacity: 0; animation: delete-node 8s infinite; }
    .head-link { animation: bypass 8s infinite; }
    .middle-link { opacity: 0; animation: old-next 8s infinite; }
    @keyframes delete-node {
      0%, 44% { opacity: 1; transform: translateY(0); }
      62% { opacity: 1; transform: translateY(63px); }
      78%, 100% { opacity: 0; transform: translateY(72px); }
    }
    @keyframes bypass {
      0%, 20% { d: path("M 132 103 C 170 103 133 103 171 103"); }
      43%, 59% { d: path("M 132 103 C 172 43 260 43 296 103"); }
      76%, 100% { d: path("M 132 103 C 170 103 258 103 296 103"); }
    }
    @keyframes old-next {
      0%, 44% { opacity: 1; d: path("M 257 103 C 295 103 258 103 296 103"); }
      63%, 100% { opacity: 0; d: path("M 257 166 C 295 166 258 103 296 103"); }
    }
    @media (prefers-reduced-motion: reduce) {
      .middle, .head-link, .middle-link { animation: none; }
    }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .head-link, .middle-link { stroke: #4ade80; }
      #arrow path { fill: #b8c7db; }
      #active-arrow path { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <marker id="active-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16835e"/></marker>
  </defs>
  <text class="label heading" x="280" y="27">Delete 85 from the list</text>
  <path class="edge head-link" d="M 132 103 C 170 103 258 103 296 103"/>
  <path class="edge middle-link" d="M 257 103 C 295 103 258 103 296 103"/>
  <path class="edge" d="M382 103 H425"/>
  <g>
    <rect class="tile" x="48" y="83" width="84" height="40" rx="6"/>
    <text x="90" y="109">72</text>
  </g>
  <g class="middle">
    <rect class="tile changed" x="173" y="83" width="84" height="40" rx="6"/>
    <text x="215" y="109">85</text>
  </g>
  <g>
    <rect class="tile" x="298" y="83" width="84" height="40" rx="6"/>
    <text x="340" y="109">91</text>
  </g>
  <g>
    <rect class="tile" x="427" y="83" width="84" height="40" rx="6"/>
    <text x="469" y="109">None</text>
  </g>
  <text class="label" x="280" y="215">Redirect 72 to 91, then remove the detached node.</text>
</svg>
