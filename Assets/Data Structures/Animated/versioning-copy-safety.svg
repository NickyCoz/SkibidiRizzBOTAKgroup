<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc"><title id="title">Aliasing and copying in dictionary memory</title><desc id="desc">On the left marks and saved reference one dictionary. On the right saved references an independent dictionary. Edit tokens move into working dictionaries, which change to 85; the independent saved copy remains 80.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}

.editToken{animation:edit 10s linear infinite}.beforeEdit{animation:before 10s steps(1) infinite}.afterEdit{animation:after 10s steps(1) infinite}
@keyframes edit{0%,15%{transform:translateX(100px);opacity:0}16%{transform:translateX(100px);opacity:1}38%,42%{transform:translateX(0);opacity:1}43%,100%{transform:translateX(0);opacity:0}}
@keyframes before{0%,37%{opacity:1}38%,100%{opacity:0}}@keyframes after{0%,37%{opacity:0}38%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.editToken,.beforeEdit{animation:none;opacity:0}.afterEdit{animation:none;opacity:1}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">A shared reference and a copied dictionary behave differently.</text><text x="24" y="56" class="muted small" text-anchor="start">Both start with S02 = 80. Then the working data are edited to S02 = 85.</text><text x="35" y="97" class="strong" text-anchor="start">Shared reference</text><text x="415" y="97" class="strong" text-anchor="start">Independent copy</text><text x="35" y="135" class="mono" text-anchor="start">marks</text><text x="35" y="191" class="mono" text-anchor="start">saved</text><rect x="155" y="117" width="190" height="106" rx="6" class="blue"/><text x="170" y="145" class="small" text-anchor="start">one dictionary</text><path class="edge" d="M98 130 H145" marker-end="url(#arrow)"/><path class="edge" d="M98 186 L145 168" marker-end="url(#arrow)"/><text x="415" y="135" class="mono" text-anchor="start">marks</text><rect x="515" y="117" width="205" height="106" rx="6" class="blue"/><text x="530" y="145" class="small" text-anchor="start">working dictionary</text><path class="edge" d="M475 130 H505" marker-end="url(#arrow)"/><text x="415" y="276" class="mono" text-anchor="start">saved</text><rect x="515" y="255" width="205" height="92" rx="6" class="green"/><text x="530" y="283" class="small" text-anchor="start">separate dictionary</text><text x="530" y="320" class="mono" text-anchor="start">S02: 80</text><path class="edge" d="M475 272 H505" marker-end="url(#arrow)"/><g class="beforeEdit"><text x="170" y="190" class="mono" text-anchor="start">S02:</text><text x="228" y="190" class="mono" text-anchor="start">80</text><text x="530" y="190" class="mono" text-anchor="start">S02:</text><text x="588" y="190" class="mono" text-anchor="start">80</text></g><g class="afterEdit"><text x="170" y="190" class="mono" text-anchor="start">S02:</text><text x="228" y="190" class="mono" text-anchor="start">85</text><text x="530" y="190" class="mono" text-anchor="start">S02:</text><text x="588" y="190" class="mono" text-anchor="start">85</text></g><g class="editToken"><rect x="218" y="163" width="42" height="35" rx="3" class="amber"/><text x="239" y="187" class="mono" text-anchor="middle">85</text><rect x="578" y="163" width="42" height="35" rx="3" class="amber"/><text x="599" y="187" class="mono" text-anchor="middle">85</text></g><g class="afterEdit"><text x="35" y="278" class="strong" text-anchor="start">saved also reads 85.</text><text x="415" y="391" class="strong" text-anchor="start">The saved copy stays at 80.</text></g><text x="24" y="436" class="muted small" text-anchor="start">The edit enters the working dictionaries. It never enters the independent saved copy.</text></svg>