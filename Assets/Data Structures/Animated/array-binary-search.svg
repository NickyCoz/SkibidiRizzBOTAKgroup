<svg xmlns="http://www.w3.org/2000/svg" width="560" height="187" viewBox="0 0 560 187" role="img" aria-labelledby="title desc">
  <title id="title">Binary search for 91</title>
  <desc id="desc">91 is larger than 85, so search only the right half.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 19px; font-weight: 700; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .target { fill: #a7f3d0; stroke: #16835e; }
    
    .discarded { animation: discard 6s infinite; }
    .middle { animation: middle 6s infinite; }
    .target { animation: found 6s infinite; }
    @keyframes discard { 0%, 35% { opacity: 1; } 47%, 100% { opacity: .48; } }
    @keyframes middle { 0%, 13%, 44%, 100% { fill: #dbeafe; } 21%, 35% { fill: #fde68a; } }
    @keyframes found { 0%, 49% { fill: #dbeafe; stroke: #4169a9; } 65%, 100% { fill: #a7f3d0; stroke: #16835e; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } }
  </style>
  <text class="label title" x="280" y="26">Binary search for 91</text>
  <g class="discarded">
    <text class="label" x="100" y="62">0</text>
    <rect class="tile" x="62" y="73" width="76" height="45" rx="7"/>
    <text x="100" y="102">72</text>
  </g>
  <g class="discarded">
    <text class="label" x="188" y="62">1</text>
    <rect class="tile" x="150" y="73" width="76" height="45" rx="7"/>
    <text x="188" y="102">79</text>
  </g>
  <g class="discarded">
    <text class="label" x="276" y="62">2</text>
    <rect class="tile middle" x="238" y="73" width="76" height="45" rx="7"/>
    <text x="276" y="102">85</text>
  </g>
  <g>
    <text class="label" x="364" y="62">3</text>
    <rect class="tile target" x="326" y="73" width="76" height="45" rx="7"/>
    <text x="364" y="102">91</text>
  </g>
  <g>
    <text class="label" x="452" y="62">4</text>
    <rect class="tile" x="414" y="73" width="76" height="45" rx="7"/>
    <text x="452" y="102">96</text>
  </g>
  <text class="label" x="276" y="142">Check middle</text>
  <text class="label" x="364" y="142">Match</text>
  <text class="label" x="280" y="171">91 is larger than 85, so search only the right half.</text>
</svg>
