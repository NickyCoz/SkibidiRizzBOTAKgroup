<svg xmlns="http://www.w3.org/2000/svg" width="560" height="265" viewBox="0 0 560 265" role="img" aria-labelledby="title desc">
  <title id="title">Nicky’s job prints before Darren’s</title>
  <desc id="desc">Nicky sent his job first. His sheet is coming out of the printer, and Darren’s job is next in the queue.</desc>
  <defs>
    <linearGradient id="case" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f1f5f9"/><stop offset="1" stop-color="#a6bdd4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#16835e"/>
    </marker>
  </defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 20px; font-weight: 700; }
    .name { font-weight: 700; }
    .detail { font-size: 13px; fill: #334155; }
    .direction { fill: none; stroke: #16835e; stroke-width: 2.5px; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .direction { stroke: #4ade80; }
      #arrow path { fill: #4ade80; }
    }
  .printing-sheet { animation: feed-paper 6s ease-in-out infinite; }
@keyframes feed-paper { 0%, 18% { opacity: 0; transform: translateY(-21px); } 28% { opacity: 1; } 65%, 100% { opacity: 1; transform: translateY(0); } }
@keyframes reveal { 0%, 35% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes trace-short { 0%, 15% { stroke-dashoffset: 80; opacity: 0; } 18% { opacity: 1; } 55%, 100% { stroke-dashoffset: 0; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text class="label heading" x="280" y="29">The shared printer</text>
  <text class="label" x="160" y="61">Printing now</text>
  <text class="label" x="414" y="61">Waiting next</text>

  <!-- Printer body, control panel, and output slot -->
  <ellipse cx="160" cy="218" rx="105" ry="9" fill="#64748b" opacity=".17"/>
  <path d="M76 116 L91 88 Q94 83 101 83 H219 Q226 83 229 88 L244 116Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="68" y="112" width="184" height="77" rx="12" fill="url(#case)" stroke="#334155" stroke-width="2"/>
  <path d="M79 135 H241" stroke="#708aa6" stroke-width="1.5"/>
  <rect x="185" y="120" width="35" height="8" rx="3" fill="#334155"/>
  <circle cx="231" cy="124" r="4" fill="#4ade80" stroke="#166534"/>
  <rect x="91" y="150" width="138" height="24" rx="6" fill="#334155"/>
  <path d="M101 174 H219 L228 215 H92Z" fill="#64748b" stroke="#334155" stroke-width="2"/>

  <!-- Nicky's sheet has already left the waiting queue -->
  <g class="printing-sheet">
  <path d="M113 158 H206 L213 209 H106Z" fill="#f0fdf4" stroke="#16835e" stroke-width="2"/>
  <path d="M122 169 H192 M122 175 H177" stroke="#72a994" stroke-width="2" stroke-linecap="round"/>
  <text class="name" x="160" y="196">Nicky</text>

  </g>
  <!-- Darren's job is still waiting -->
  <path class="direction" d="M337 147 H270"/>
  <rect x="351" y="84" width="126" height="107" rx="12" fill="#eff6ff" stroke="#4169a9" stroke-width="2"/>
  <path d="M389 100 H425 L439 114 V147 H389Z" fill="#fff" stroke="#4169a9" stroke-width="1.7"/>
  <path d="M425 100 V114 H439 M398 124 H430 M398 133 H424" fill="none" stroke="#6688ae" stroke-width="1.5"/>
  <text class="name" x="414" y="170">Darren</text>
  <text class="label" x="280" y="249">Nicky sent his job first, so his page prints first.</text>
</svg>
