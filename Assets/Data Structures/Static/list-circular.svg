<svg xmlns="http://www.w3.org/2000/svg" width="480" height="122" viewBox="0 0 480 122" role="img" aria-labelledby="title">
  <title id="title">circular linked list</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <rect x="96" y="34" width="59" height="38" rx="5"/><text class="value" x="125.5" y="58">72</text>
  <rect x="188" y="34" width="59" height="38" rx="5"/><text class="value" x="217.5" y="58">85</text>
  <rect x="280" y="34" width="59" height="38" rx="5"/><text class="value" x="309.5" y="58">91</text>
  <path class="edge" d="M159 53 H183" marker-end="url(#arrow)"/>
  <path class="edge" d="M251 53 H275" marker-end="url(#arrow)"/>
  <path class="edge" d="M309 77 V98 H126 V77" marker-end="url(#arrow)"/>
</svg>
