<svg xmlns="http://www.w3.org/2000/svg" width="560" height="224" viewBox="0 0 560 224" role="img" aria-labelledby="title desc">
  <title id="title">Find book 10 in a library catalog</title>
  <desc id="desc">Compare book 10 with book 8, then follow the right branch. The left branch contains book 3.</desc>
  <defs>
    <g id="book"><path d="M-27-20h47l7 6v39h-54z" fill="#fef9ee" stroke="#704c3a" stroke-width="1.5"/><rect x="-28" y="-24" width="48" height="45" rx="4" fill="currentColor" stroke="#334155" stroke-width="1.5"/><path d="M-20-19v33m42-24v32" stroke="#fff" opacity=".5" fill="none"/></g>
  </defs>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .label { fill: #f8fafc; stroke: #111827; } }
  </style>
  <text class="label heading" x="280" y="26">Find book 10 in the catalog</text>
  <path d="M270 98 L171 135" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <path d="M290 98 L389 135" stroke="#16835e" stroke-width="3" fill="none"/>
  <text class="label" x="398" y="103">10 is larger</text>
  <use href="#book" x="280" y="74" color="#506ba4"/>
  <text x="277" y="78" style="fill:#fff;font-weight:700">8</text>
  <use href="#book" x="164" y="157" color="#8876a6"/>
  <text x="161" y="161" style="fill:#fff;font-weight:700">3</text>
  <use href="#book" x="396" y="157" color="#16835e"/>
  <text x="393" y="161" style="fill:#fff;font-weight:700">10</text>
  <text class="label" x="280" y="208">Follow the right branch and skip the left branch.</text>
</svg>
