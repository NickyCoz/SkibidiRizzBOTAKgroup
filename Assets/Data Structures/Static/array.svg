<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130" role="img" aria-labelledby="title">
  <title id="title">Array of scores with indexes zero through two</title>
  <style>
    text { paint-order: stroke; stroke: #f8fafc; stroke-width: 2.5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
    <text x="65" y="35">Index</text>
    <text x="158" y="35">0</text>
    <rect x="120" y="48" width="76" height="44" rx="4" fill="#dbeafe" stroke="#1e40af" />
    <text x="158" y="76">72</text>
    <text x="240" y="35">1</text>
    <rect x="202" y="48" width="76" height="44" rx="4" fill="#dbeafe" stroke="#1e40af" />
    <text x="240" y="76">85</text>
    <text x="322" y="35">2</text>
    <rect x="284" y="48" width="76" height="44" rx="4" fill="#dbeafe" stroke="#1e40af" />
    <text x="322" y="76">91</text>
  </g>
</svg>
