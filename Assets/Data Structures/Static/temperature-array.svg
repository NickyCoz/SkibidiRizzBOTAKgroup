<svg xmlns="http://www.w3.org/2000/svg" width="560" height="141" viewBox="0 0 560 141" role="img" aria-labelledby="title">
  <title id="title">Seven daily temperatures stored in a one-dimensional array</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .focus { fill: #a7f3d0; stroke: #16835e; stroke-width: 2px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
    .active { stroke: #16835e; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .active { stroke: #4ade80; }
    }
  </style>
  <text class="label" x="85" y="30">Mon</text>
  <rect class="tile" x="56" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="85" y="64">21°</text>
  <text class="label" x="85" y="103">0</text>
  <text class="label" x="150" y="30">Tue</text>
  <rect class="tile" x="121" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="150" y="64">22°</text>
  <text class="label" x="150" y="103">1</text>
  <text class="label" x="215" y="30">Wed</text>
  <rect class="tile" x="186" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="215" y="64">20°</text>
  <text class="label" x="215" y="103">2</text>
  <text class="label" x="280" y="30">Thu</text>
  <rect class="tile" x="251" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="280" y="64">23°</text>
  <text class="label" x="280" y="103">3</text>
  <text class="label" x="345" y="30">Fri</text>
  <rect class="tile" x="316" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="345" y="64">24°</text>
  <text class="label" x="345" y="103">4</text>
  <text class="label" x="410" y="30">Sat</text>
  <rect class="tile" x="381" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="410" y="64">22°</text>
  <text class="label" x="410" y="103">5</text>
  <text class="label" x="475" y="30">Sun</text>
  <rect class="tile" x="446" y="40" width="58" height="38" rx="5"/>
  <text class="ink" x="475" y="64">21°</text>
  <text class="label" x="475" y="103">6</text>
  <text class="label" x="280" y="129">Each day has one index in the array.</text>
</svg>
