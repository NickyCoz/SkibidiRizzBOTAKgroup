<svg xmlns="http://www.w3.org/2000/svg" width="560" height="222" viewBox="0 0 560 222" role="img" aria-labelledby="title">
  <title id="title">Before and after inserting 6 as the right child of 3</title>
  <style>
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
    .changed { fill: #a7f3d0; stroke: #16835e; }
    text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #b8c7db; }
      .label { fill: #f8fafc; stroke: #111827; }
    }
  </style>
  <text class="label" x="140" y="26">Before insertion</text>
  <text class="label" x="420" y="26">After inserting 6</text>
  <path class="edge" d="M140 65 L80 124"/>
  <path class="edge" d="M140 65 L200 124"/>
  <path class="edge" d="M80 124 L37 183"/>
  <circle class="node" cx="140" cy="65" r="19"/>
  <text x="140" y="71">8</text>
  <circle class="node" cx="80" cy="124" r="19"/>
  <text x="80" y="130">3</text>
  <circle class="node" cx="200" cy="124" r="19"/>
  <text x="200" y="130">10</text>
  <circle class="node" cx="37" cy="183" r="19"/>
  <text x="37" y="189">1</text>
  <path class="edge" d="M420 65 L360 124"/>
  <path class="edge" d="M420 65 L480 124"/>
  <path class="edge" d="M360 124 L317 183"/>
  <path class="edge" d="M360 124 L403 183"/>
  <circle class="node" cx="420" cy="65" r="19"/>
  <text x="420" y="71">8</text>
  <circle class="node" cx="360" cy="124" r="19"/>
  <text x="360" y="130">3</text>
  <circle class="node" cx="480" cy="124" r="19"/>
  <text x="480" y="130">10</text>
  <circle class="node" cx="317" cy="183" r="19"/>
