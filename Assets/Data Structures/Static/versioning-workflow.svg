<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title desc"><title id="title">A dataset release checklist</title><desc id="desc">A paper checklist records saving revisions, checking a release, and identifying precise reuse information.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Before sharing a dataset: check the essentials.</text><path d="M50 78 H688 L710 100 V366 H50 Z" class="paper"/><path d="M688 78 V100 H710" class="rule"/><text x="62" y="105" class="strong" text-anchor="start">Release checklist</text><path class="rule" d="M62 117 L698 117"/><rect x="75" y="136" width="23" height="23" rx="2" class="green"/><path d="M80 146 L86 152 L95 139" class="edge"/><text x="113" y="155" class="strong" text-anchor="start">Save revisions</text><text x="113" y="182" class="muted small" text-anchor="start">Preserve states and record the changes.</text><rect x="75" y="212" width="23" height="23" rx="2" class="green"/><path d="M80 222 L86 228 L95 215" class="edge"/><text x="113" y="231" class="strong" text-anchor="start">Check the release</text><text x="113" y="258" class="muted small" text-anchor="start">Choose its ID and explain its significance.</text><rect x="75" y="288" width="23" height="23" rx="2" class="green"/><path d="M80 298 L86 304 L95 291" class="edge"/><text x="113" y="307" class="strong" text-anchor="start">Make reuse precise</text><text x="113" y="334" class="muted small" text-anchor="start">Record subsets, formats, sources, and access.</text></svg>