<svg xmlns="http://www.w3.org/2000/svg" width="560" height="245" viewBox="0 0 560 245" role="img" aria-labelledby="title desc">
  <title id="title">Breadth-first search visits nearby people first</title>
  <desc id="desc">The friendship graph stays in place. Numbered badges show the visit order: Nicky, Darren, Neil, Glen.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    .edge { stroke: #64748b; stroke-width: 2px; }
    .visit-link { stroke: #16835e; stroke-width: 4px; }
    .person { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5px; }
    .number { fill: #fff; font-size: 12px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .visit-link { stroke: #4ade80; }
    }
  </style>
  <text class="label heading" x="280" y="28">Breadth-first search visits nearby people first</text>
  <path class="edge" d="M143 77 L417 77"/>
  <path class="edge" d="M143 77 L143 173"/>
  <path class="edge" d="M417 77 L417 173"/>
  <path class="edge" d="M143 173 L417 173"/>
  <path class="visit-link" style="--delay:1.1s" d="M143 77 L417 77"/>
  <path class="visit-link" style="--delay:2.2s" d="M143 77 L143 173"/>
  <path class="visit-link" style="--delay:3.3000000000000003s" d="M417 77 L417 173"/>
  <rect class="person" style="--delay:0s" x="92" y="58" width="102" height="38" rx="8"/>
  <text x="143" y="83">Nicky</text>
  <circle class="badge" cx="190" cy="60" r="11"/>
  <text class="number" x="190" y="64">1</text>
  <rect class="person" style="--delay:1.1s" x="366" y="58" width="102" height="38" rx="8"/>
  <text x="417" y="83">Darren</text>
  <circle class="badge" cx="464" cy="60" r="11"/>
  <text class="number" x="464" y="64">2</text>
  <rect class="person" style="--delay:2.2s" x="92" y="154" width="102" height="38" rx="8"/>
  <text x="143" y="179">Neil</text>
  <circle class="badge" cx="190" cy="156" r="11"/>
  <text class="number" x="190" y="160">3</text>
  <rect class="person" style="--delay:3.3000000000000003s" x="366" y="154" width="102" height="38" rx="8"/>
  <text x="417" y="179">Glen</text>
  <circle class="badge" cx="464" cy="156" r="11"/>
  <text class="number" x="464" y="160">4</text>
  <text class="label" x="280" y="225">Badges show visit order. Green edges show how each person was reached.</text>
</svg>
