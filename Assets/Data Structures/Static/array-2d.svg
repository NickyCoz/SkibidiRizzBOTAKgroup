<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-labelledby="title">
  <title id="title">Two-dimensional array with two rows and three columns</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <rect x="175" y="45" width="42" height="42" rx="5"/><text class="value" x="196" y="71">1</text>
  <rect x="219" y="45" width="42" height="42" rx="5"/><text class="value" x="240" y="71">2</text>
  <rect x="263" y="45" width="42" height="42" rx="5"/><text class="value" x="284" y="71">3</text>
  <rect x="175" y="89" width="42" height="42" rx="5"/><text class="value" x="196" y="115">4</text>
  <rect x="219" y="89" width="42" height="42" rx="5"/><text class="value" x="240" y="115">5</text>
  <rect x="263" y="89" width="42" height="42" rx="5"/><text class="value" x="284" y="115">6</text>
  <text class="label" x="196" y="31">Col 0</text>
  <text class="label" x="240" y="31">Col 1</text>
  <text class="label" x="284" y="31">Col 2</text>
  <text class="label" x="136" y="72">Row 0</text>
  <text class="label" x="136" y="116">Row 1</text>
</svg>
