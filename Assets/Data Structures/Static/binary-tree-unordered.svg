<svg xmlns="http://www.w3.org/2000/svg" width="480" height="156" viewBox="0 0 480 156" role="img" aria-labelledby="title">
  <title id="title">A binary tree with a larger key on the left</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <path class="edge" d="M240 38 L166 105 M240 38 L314 105"/>
  <circle cx="240" cy="38" r="20"/><text class="value" x="240" y="44">8</text>
  <circle cx="166" cy="105" r="20"/><text class="value" x="166" y="111">10</text>
  <circle cx="314" cy="105" r="20"/><text class="value" x="314" y="111">3</text>
</svg>
