<svg xmlns="http://www.w3.org/2000/svg" width="480" height="155" viewBox="0 0 480 155" role="img" aria-labelledby="title">
  <title id="title">Three-dimensional array with two grid layers</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <text class="label" x="146" y="27">Layer 0</text>
  <text class="label" x="334" y="27">Layer 1</text>
  <rect x="103" y="42" width="42" height="42" rx="5"/><text class="value" x="124" y="68">1</text>
  <rect x="147" y="42" width="42" height="42" rx="5"/><text class="value" x="168" y="68">2</text>
  <rect x="103" y="86" width="42" height="42" rx="5"/><text class="value" x="124" y="112">3</text>
  <rect x="147" y="86" width="42" height="42" rx="5"/><text class="value" x="168" y="112">4</text>
  <rect x="291" y="42" width="42" height="42" rx="5"/><text class="value" x="312" y="68">5</text>
  <rect x="335" y="42" width="42" height="42" rx="5"/><text class="value" x="356" y="68">6</text>
  <rect x="291" y="86" width="42" height="42" rx="5"/><text class="value" x="312" y="112">7</text>
  <rect x="335" y="86" width="42" height="42" rx="5"/><text class="value" x="356" y="112">8</text>
</svg>
