<svg xmlns="http://www.w3.org/2000/svg" width="560" height="168" viewBox="0 0 560 168" role="img" aria-labelledby="title">
  <title id="title">The same scores stored in an array and a linked list</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3; stroke-linejoin: round; }
    .node { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
    }
  </style>
  <text class="label" x="94" y="59">Array</text>
  <text class="label" x="94" y="123">Linked list</text>
  <text class="label" x="224" y="26">0</text>
  <rect class="node" x="188" y="36" width="72" height="35" rx="5"/>
  <text x="224" y="59">72</text>
  <rect class="node" x="188" y="100" width="72" height="35" rx="5"/>
  <text x="224" y="123">72</text>
  <text class="label" x="324" y="26">1</text>
  <rect class="node" x="288" y="36" width="72" height="35" rx="5"/>
  <text x="324" y="59">85</text>
  <rect class="node" x="288" y="100" width="72" height="35" rx="5"/>
  <text x="324" y="123">85</text>
  <text class="label" x="424" y="26">2</text>
  <rect class="node" x="388" y="36" width="72" height="35" rx="5"/>
  <text x="424" y="59">91</text>
  <rect class="node" x="388" y="100" width="72" height="35" rx="5"/>
  <text x="424" y="123">91</text>
  <path class="edge" d="M265 117 h18 m-6 -5 6 5 -6 5"/>
  <path class="edge" d="M365 117 h18 m-6 -5 6 5 -6 5"/>
</svg>
