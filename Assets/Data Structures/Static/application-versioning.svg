<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">Reading r1 to reproduce a result</title><desc id="desc">A copy of r1 moves from its saved sheet into the analysis workspace while the original stays put. The report calculates 75. Current r3 is unaffected.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Read an earlier snapshot without removing it.</text><text x="24" y="56" class="muted small" text-anchor="start">Release 1.0 identifies r1, even while r3 is the current dataset.</text><path d="M35 101 H193 L215 123 V246 H35 Z" class="paper"/><path d="M193 101 V123 H215" class="rule"/><text x="47" y="128" class="strong" text-anchor="start">Saved r1</text><path class="rule" d="M47 140 L203 140"/><text x="47" y="166" class="mono" text-anchor="start">S01: 70</text><text x="47" y="191" class="mono" text-anchor="start">S02: 80</text><path d="M535 101 H693 L715 123 V246 H535 Z" class="paper"/><path d="M693 101 V123 H715" class="rule"/><text x="547" y="128" class="strong" text-anchor="start">Current r3</text><path class="rule" d="M547 140 L703 140"/><text x="547" y="166" class="mono" text-anchor="start">S01: 70</text><text x="547" y="191" class="mono" text-anchor="start">S02: 85</text><text x="547" y="216" class="mono" text-anchor="start">S03: 90</text><text x="35" y="282" class="muted small" text-anchor="start">Saved original stays here.</text><text x="325" y="94" class="strong" text-anchor="start">Analysis workspace</text><rect x="320" y="102" width="190" height="159" rx="6" class="rule"/><g class="readCopy"><path d="M330 112 H478 L500 134 V252 H330 Z" class="green"/><path d="M478 112 V134 H500" class="rule"/><text x="342" y="139" class="strong" text-anchor="start">Read copy: r1</text><path class="rule" d="M342 151 L488 151"/><text x="342" y="177" class="mono" text-anchor="start">S01: 70</text><text x="342" y="202" class="mono" text-anchor="start">S02: 80</text></g><text x="35" y="326" class="small" text-anchor="start">1. Select r1.</text><text x="35" y="356" class="small" text-anchor="start">2. Read a copy.</text><text x="35" y="386" class="small" text-anchor="start">3. Calculate 75.</text><path d="M285 322 H693 L715 344 V423 H285 Z" class="green"/><path d="M693 322 V344 H715" class="rule"/><text x="297" y="349" class="strong" text-anchor="start">Earlier report</text><path class="rule" d="M297 361 L703 361"/><text x="297" y="387" class="mono" text-anchor="start">Mean = (70 + 80) / 2 = 75</text></svg>