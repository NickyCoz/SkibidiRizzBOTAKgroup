<svg xmlns="http://www.w3.org/2000/svg" width="480" height="107" viewBox="0 0 480 107" role="img" aria-labelledby="title">
  <title id="title">A directed edge from Nicky to Darren</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <rect x="70" y="33" width="105" height="40" rx="5"/><text class="value" x="122.5" y="58">Nicky</text>
  <path class="edge" d="M180 53 H298" marker-end="url(#arrow)"/>
  <rect x="305" y="33" width="105" height="40" rx="5"/><text class="value" x="357.5" y="58">Darren</text>
</svg>
