<svg xmlns="http://www.w3.org/2000/svg" width="480" height="128" viewBox="0 0 480 128" role="img" aria-labelledby="title">
  <title id="title">The urgent job is served first even though it arrives second</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    rect, circle { fill: #dbeafe; stroke: #4169a9; stroke-width: 1.5px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .edge { stroke: #b8c7db; }
      .tip { fill: #b8c7db; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>
  <rect x="19" y="50" width="128" height="39" rx="5"/><text class="value" x="83" y="74.5">Normal first</text>
  <rect x="167" y="50" width="143" height="39" rx="5"/><text class="value" x="238.5" y="74.5">Urgent second</text>
  <path class="edge" d="M316 70 H340" marker-end="url(#arrow)"/>
  <rect x="346" y="50" width="117" height="39" rx="5"/><text class="value" x="404.5" y="74.5">Take urgent</text>
  <text class="label" x="164" y="33">Arrival order</text>
  <text class="label" x="403" y="33">Served first</text>
</svg>
