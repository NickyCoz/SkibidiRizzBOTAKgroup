<svg xmlns="http://www.w3.org/2000/svg" width="560" height="141" viewBox="0 0 560 141" role="img" aria-labelledby="title">
  <title id="title">Items in a linear sequence</title>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-size: 19px; font-weight: 700; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .selected { fill: #a7f3d0; stroke: #16835e; }
    .link { fill: none; stroke: #64748b; stroke-width: 2px; stroke-linecap: round; }
    .scan { animation: none; }
    @keyframes visit { 0%, 20% { fill: #a7f3d0; stroke: #16835e; } 22%, 100% { fill: #dbeafe; stroke: #4169a9; } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .link { stroke: #b8c7db; }
    }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; } }
  </style>
  <text class="label heading" x="280" y="26">Items in a linear sequence</text>
  <text class="label" x="280" y="64">Read from first to last</text>
  <rect class="tile" x="39" y="76" width="107" height="40" rx="7"/>
  <text x="92.5" y="102">First</text>
  <path class="link" d="M148 96 H161 m-5 -4 5 4 -5 4"/>
  <rect class="tile" x="164" y="76" width="107" height="40" rx="7"/>
  <text x="217.5" y="102">Second</text>
  <path class="link" d="M273 96 H286 m-5 -4 5 4 -5 4"/>
  <rect class="tile" x="289" y="76" width="107" height="40" rx="7"/>
  <text x="342.5" y="102">Third</text>
  <path class="link" d="M398 96 H411 m-5 -4 5 4 -5 4"/>
  <rect class="tile" x="414" y="76" width="107" height="40" rx="7"/>
  <text x="467.5" y="102">Last</text>
</svg>
