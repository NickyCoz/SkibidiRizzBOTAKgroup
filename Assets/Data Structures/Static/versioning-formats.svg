<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title desc"><title id="title">File formats and hosted copies</title><desc id="desc">Folded CSV and JSON sheets contain the same marks. Location labels identify two CSV copies and one JSON copy.</desc><style>
