<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">An open reference notebook of six principles</title><desc id="desc">The left page defines Revision, Release, and Granularity. The right page defines Manifestation, Provenance, and Citation.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Six principles for managing changing data</text><path class="paper" d="M25 90 Q190 65 380 90 Q560 65 735 90 V385 Q560 360 380 385 Q190 360 25 385 Z"/><path class="rule" d="M380 91 L380 383"/><text x="45" y="131" class="strong" text-anchor="start">Revision</text><text x="45" y="159" class="small muted" text-anchor="start">Identify each changed state.</text><path class="rule" d="M45 173 L350 173"/><text x="45" y="215" class="strong" text-anchor="start">Release</text><text x="45" y="243" class="small muted" text-anchor="start">Select a state for reuse.</text><path class="rule" d="M45 257 L350 257"/><text x="45" y="299" class="strong" text-anchor="start">Granularity</text><text x="45" y="327" class="small muted" text-anchor="start">Identify the whole or part.</text><path class="rule" d="M45 341 L350 341"/><text x="402" y="131" class="strong" text-anchor="start">Manifestation</text><text x="402" y="159" class="small muted" text-anchor="start">Describe the file format.</text><path class="rule" d="M402 173 L707 173"/><text x="402" y="215" class="strong" text-anchor="start">Provenance</text><text x="402" y="243" class="small muted" text-anchor="start">Record its source and history.</text><path class="rule" d="M402 257 L707 257"/><text x="402" y="299" class="strong" text-anchor="start">Citation</text><text x="402" y="327" class="small muted" text-anchor="start">Credit the exact data used.</text><path class="rule" d="M402 341 L707 341"/></svg>