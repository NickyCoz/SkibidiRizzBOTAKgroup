<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title desc"><title id="title">Saved dataset sheets and the report they support</title><desc id="desc">Three folded file sheets preserve r1, r2, and r3 on an archive shelf. A report slip identifies r1 and mean 75.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Keep the data that produced the result.</text><text x="24" y="56" class="muted small" text-anchor="start">A saved revision remains available after later edits.</text><path d="M40 83 H198 L220 105 V241 H40 Z" class="paper"/><path d="M198 83 V105 H220" class="rule"/><text x="52" y="110" class="strong" text-anchor="start"></text><path class="rule" d="M52 122 L208 122"/><path d="M35 78 H193 L215 100 V236 H35 Z" class="paper"/><path d="M193 78 V100 H215" class="rule"/><text x="47" y="105" class="strong" text-anchor="start">r1</text><path class="rule" d="M47 117 L203 117"/><text x="47" y="143" class="mono" text-anchor="start">S01: 70</text><text x="47" y="168" class="mono" text-anchor="start">S02: 80</text><text x="35" y="261" class="muted small" text-anchor="start">Original data</text><path d="M285 83 H443 L465 105 V241 H285 Z" class="paper"/><path d="M443 83 V105 H465" class="rule"/><text x="297" y="110" class="strong" text-anchor="start"></text><path class="rule" d="M297 122 L453 122"/><path d="M280 78 H438 L460 100 V236 H280 Z" class="paper"/><path d="M438 78 V100 H460" class="rule"/><text x="292" y="105" class="strong" text-anchor="start">r2</text><path class="rule" d="M292 117 L448 117"/><text x="292" y="143" class="mono" text-anchor="start">S01: 70</text><text x="292" y="168" class="mono" text-anchor="start">S02: 85</text><text x="280" y="261" class="muted small" text-anchor="start">Corrected mark</text><path d="M530 83 H688 L710 105 V241 H530 Z" class="paper"/><path d="M688 83 V105 H710" class="rule"/><text x="542" y="110" class="strong" text-anchor="start"></text><path class="rule" d="M542 122 L698 122"/><path d="M525 78 H683 L705 100 V236 H525 Z" class="paper"/><path d="M683 78 V100 H705" class="rule"/><text x="537" y="105" class="strong" text-anchor="start">r3</text><path class="rule" d="M537 117 L693 117"/><text x="537" y="143" class="mono" text-anchor="start">S01: 70</text><text x="537" y="168" class="mono" text-anchor="start">S02: 85</text><text x="537" y="193" class="mono" text-anchor="start">S03: 90</text><text x="525" y="261" class="muted small" text-anchor="start">Added result</text><path class="rule" d="M25 284 L725 284"/><path class="rule" d="M35 284 L35 295"/><path class="rule" d="M715 284 L715 295"/><path d="M105 323 H623 L645 345 V423 H105 Z" class="green"/><path d="M623 323 V345 H645" class="rule"/><text x="117" y="350" class="strong" text-anchor="start">Report using r1</text><path class="rule" d="M117 362 L633 362"/><text x="117" y="388" class="mono" text-anchor="start">Mean = (70 + 80) / 2 = 75</text><text x="24" y="459" class="muted small" text-anchor="start">Saved revisions are records of earlier states, not just names for the current file.</text></svg>