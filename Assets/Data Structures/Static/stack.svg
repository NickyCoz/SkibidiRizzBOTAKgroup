<svg xmlns="http://www.w3.org/2000/svg" width="480" height="186" viewBox="0 0 480 186" role="img" aria-labelledby="title">
  <title id="title">Stack with B on top of A. Push and pop use the top.</title>
  <style>
    text { paint-order: stroke; stroke: #f8fafc; stroke-width: 2.5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
    <rect x="178" y="68" width="124" height="44" rx="4" fill="#dbeafe" stroke="#1e40af" />
    <text x="240" y="96">B</text>
    <rect x="178" y="116" width="124" height="44" rx="4" fill="#dbeafe" stroke="#1e40af" />
    <text x="240" y="144">A</text>
    <text x="124" y="95">Top</text>
    <path d="M150 90 H172" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="142" y="28">Push</text>
    <path d="M178 35 L201 61" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="28">Pop</text>
    <path d="M279 62 L303 35" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
