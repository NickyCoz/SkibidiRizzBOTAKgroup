<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Two encoded files with distinct checksum fingerprints</title><desc id="desc">CSV and JSON have equivalent records but different computed SHA-256 prefixes.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">A checksum detects byte differences, not their meaning.</text><path d="M35 74 H323 L345 96 V202 H35 Z" class="paper"/><path d="M323 74 V96 H345" class="rule"/><text x="47" y="101" class="strong" text-anchor="start">marks.csv</text><path class="rule" d="M47 113 L333 113"/><text x="47" y="139" class="mono" text-anchor="start">S01,70</text><text x="47" y="164" class="mono" text-anchor="start">S02,85</text><text x="35" y="237" class="muted small" text-anchor="start">SHA-256 prefix</text><rect x="35" y="251" width="23" height="35" rx="3" class="green"/><text x="46.5" y="275" class="mono" text-anchor="middle">c</text><rect x="60" y="251" width="23" height="35" rx="3" class="blue"/><text x="71.5" y="275" class="mono" text-anchor="middle">2</text><rect x="85" y="251" width="23" height="35" rx="3" class="green"/><text x="96.5" y="275" class="mono" text-anchor="middle">d</text><rect x="110" y="251" width="23" height="35" rx="3" class="blue"/><text x="121.5" y="275" class="mono" text-anchor="middle">2</text><rect x="135" y="251" width="23" height="35" rx="3" class="green"/><text x="146.5" y="275" class="mono" text-anchor="middle">0</text><rect x="160" y="251" width="23" height="35" rx="3" class="blue"/><text x="171.5" y="275" class="mono" text-anchor="middle">6</text><rect x="185" y="251" width="23" height="35" rx="3" class="green"/><text x="196.5" y="275" class="mono" text-anchor="middle">8</text><rect x="210" y="251" width="23" height="35" rx="3" class="blue"/><text x="221.5" y="275" class="mono" text-anchor="middle">6</text><rect x="235" y="251" width="23" height="35" rx="3" class="green"/><text x="246.5" y="275" class="mono" text-anchor="middle">5</text><rect x="260" y="251" width="23" height="35" rx="3" class="blue"/><text x="271.5" y="275" class="mono" text-anchor="middle">2</text><rect x="285" y="251" width="23" height="35" rx="3" class="green"/><text x="296.5" y="275" class="mono" text-anchor="middle">8</text><rect x="310" y="251" width="23" height="35" rx="3" class="blue"/><text x="321.5" y="275" class="mono" text-anchor="middle">5</text><path d="M410 74 H698 L720 96 V202 H410 Z" class="paper"/><path d="M698 74 V96 H720" class="rule"/><text x="422" y="101" class="strong" text-anchor="start">marks.json</text><path class="rule" d="M422 113 L708 113"/><text x="422" y="139" class="mono" text-anchor="start">{&quot;S01&quot;:70,&quot;S02&quot;:85}</text><text x="410" y="237" class="muted small" text-anchor="start">SHA-256 prefix</text><rect x="410" y="251" width="23" height="35" rx="3" class="green"/><text x="421.5" y="275" class="mono" text-anchor="middle">2</text><rect x="435" y="251" width="23" height="35" rx="3" class="blue"/><text x="446.5" y="275" class="mono" text-anchor="middle">f</text><rect x="460" y="251" width="23" height="35" rx="3" class="green"/><text x="471.5" y="275" class="mono" text-anchor="middle">b</text><rect x="485" y="251" width="23" height="35" rx="3" class="blue"/><text x="496.5" y="275" class="mono" text-anchor="middle">d</text><rect x="510" y="251" width="23" height="35" rx="3" class="green"/><text x="521.5" y="275" class="mono" text-anchor="middle">3</text><rect x="535" y="251" width="23" height="35" rx="3" class="blue"/><text x="546.5" y="275" class="mono" text-anchor="middle">d</text><rect x="560" y="251" width="23" height="35" rx="3" class="green"/><text x="571.5" y="275" class="mono" text-anchor="middle">f</text><rect x="585" y="251" width="23" height="35" rx="3" class="blue"/><text x="596.5" y="275" class="mono" text-anchor="middle">d</text><rect x="610" y="251" width="23" height="35" rx="3" class="green"/><text x="621.5" y="275" class="mono" text-anchor="middle">2</text><rect x="635" y="251" width="23" height="35" rx="3" class="blue"/><text x="646.5" y="275" class="mono" text-anchor="middle">0</text><rect x="660" y="251" width="23" height="35" rx="3" class="green"/><text x="671.5" y="275" class="mono" text-anchor="middle">c</text><rect x="685" y="251" width="23" height="35" rx="3" class="blue"/><text x="696.5" y="275" class="mono" text-anchor="middle">8</text><text x="24" y="329" class="strong" text-anchor="start">Both files encode S01 = 70 and S02 = 85, but their bytes differ.</text><text x="24" y="362" class="muted small" text-anchor="start">UTF-8; CSV has LF after each row. Only 12 hash characters are displayed.</text></svg>