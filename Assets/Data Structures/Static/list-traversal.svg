<svg xmlns="http://www.w3.org/2000/svg" width="540" height="80" viewBox="0 0 540 80" role="img" aria-labelledby="title">
  <title id="title">Head points to 72, then 85, then 91, then None</title>
  <style>
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
    .changed { fill: #a7f3d0; stroke: #16835e; }
    text { font: 17px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #b8c7db; }
      .label { fill: #f8fafc; stroke: #111827; }
    }
  </style>
  <path class="edge" d="M85 40 H116 m-6 -5 6 5 -6 5"/>
  <path class="edge" d="M190 40 H221 m-6 -5 6 5 -6 5"/>
  <path class="edge" d="M295 40 H326 m-6 -5 6 5 -6 5"/>
  <path class="edge" d="M400 40 H431 m-6 -5 6 5 -6 5"/>
  <rect class="node" x="15" y="21" width="70" height="38" rx="8"/>
  <text x="50" y="46">Head</text>
  <rect class="node" x="120" y="21" width="70" height="38" rx="8"/>
  <text x="155" y="46">72</text>
  <rect class="node changed" x="225" y="21" width="70" height="38" rx="8"/>
  <text x="260" y="46">85</text>
  <rect class="node" x="330" y="21" width="70" height="38" rx="8"/>
  <text x="365" y="46">91</text>
  <rect class="node" x="435" y="21" width="70" height="38" rx="8"/>
  <text x="470" y="46">None</text>
</svg>
