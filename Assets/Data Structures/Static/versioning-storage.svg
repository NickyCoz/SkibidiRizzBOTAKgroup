<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title desc"><title id="title">Storage bars for full snapshots and deltas</title><desc id="desc">A full-copy bar uses 100 GB. A proportional base-plus-deltas bar uses 1.099 GB.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Storage: full snapshots versus a base plus changes.</text><text x="24" y="56" class="muted small" text-anchor="start">100 states of a 1 GB dataset; each of 99 changes is 1 MB.</text><text x="28" y="110" class="strong" text-anchor="start">Full snapshots</text><text x="732" y="110" class="strong" text-anchor="end">100 GB</text><rect x="28" y="125" width="704" height="42" rx="0" class="blue"/><path class="rule" d="M63.2 125 L63.2 167"/><path class="rule" d="M98.4 125 L98.4 167"/><path class="rule" d="M133.60000000000002 125 L133.60000000000002 167"/><path class="rule" d="M168.8 125 L168.8 167"/><path class="rule" d="M204.0 125 L204.0 167"/><path class="rule" d="M239.20000000000002 125 L239.20000000000002 167"/><path class="rule" d="M274.40000000000003 125 L274.40000000000003 167"/><path class="rule" d="M309.6 125 L309.6 167"/><path class="rule" d="M344.8 125 L344.8 167"/><path class="rule" d="M380.0 125 L380.0 167"/><path class="rule" d="M415.20000000000005 125 L415.20000000000005 167"/><path class="rule" d="M450.40000000000003 125 L450.40000000000003 167"/><path class="rule" d="M485.6 125 L485.6 167"/><path class="rule" d="M520.8000000000001 125 L520.8000000000001 167"/><path class="rule" d="M556.0 125 L556.0 167"/><path class="rule" d="M591.2 125 L591.2 167"/><path class="rule" d="M626.4000000000001 125 L626.4000000000001 167"/><path class="rule" d="M661.6 125 L661.6 167"/><path class="rule" d="M696.8000000000001 125 L696.8000000000001 167"/><text x="28" y="219" class="strong" text-anchor="start">Base + 99 deltas</text><text x="732" y="219" class="strong" text-anchor="end">1.099 GB</text><rect x="28" y="234" width="704" height="42" rx="0" class="paper"/><rect x="28" y="234" width="7.04" height="42" rx="0" class="green"/><rect x="35.04" y="234" width="0.697" height="42" rx="0" class="blue"/><text x="28" y="312" class="muted small" text-anchor="start">Same scale: small changes can take much less space than full copies.</text><text x="28" y="344" class="muted small" text-anchor="start">Full snapshots: read directly. Deltas: reconstruct from a base and changes.</text><text x="28" y="376" class="muted small" text-anchor="start">1 GB = 1,000 MB. Compression and metadata are excluded.</text></svg>