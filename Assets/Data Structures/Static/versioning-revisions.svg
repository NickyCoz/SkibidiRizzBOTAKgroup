<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Saving revisions as separate snapshots</title><desc id="desc">Snapshot sheets move from working data into archive positions. S02 changes after r1 is saved; S03 is added after r2 is saved. Static and reduced-motion states show all three snapshots.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.blank{fill:none}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.blueText{fill:#93c5fd}.greenText{fill:#6ee7b7}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Save a separate snapshot after each change.</text><text x="24" y="56" class="muted small" text-anchor="start">The working table changes; earlier snapshots remain in the archive.</text><text x="35" y="93" class="strong" text-anchor="start">Working data</text><rect x="35" y="107" width="170" height="126" rx="6" class="paper"/><text x="48" y="143" class="mono" text-anchor="start">S01: 70</text><text x="265" y="120" class="small muted" text-anchor="start">Save r1, then correct S02.</text><text x="265" y="149" class="small muted" text-anchor="start">Save r2, then add S03.</text><text x="265" y="178" class="small muted" text-anchor="start">Save r3. Keep all three states.</text><text x="35" y="278" class="strong" text-anchor="start">Saved snapshots</text><path class="rule" d="M25 461 L735 461"/><path class="edge" d="M212 375 H280" marker-end="url(#arrow)"/><path class="edge" d="M467 375 H535" marker-end="url(#arrow)"/><text x="48" y="173" class="mono" text-anchor="start">S02: 85</text><text x="48" y="203" class="mono" text-anchor="start">S03: 90</text><g class="save1"><path d="M35 302 H183 L205 324 V452 H35 Z" class="paper"/><path d="M183 302 V324 H205" class="rule"/><text x="47" y="329" class="strong" text-anchor="start">r1</text><path class="rule" d="M47 341 L193 341"/><text x="47" y="367" class="mono" text-anchor="start">S01: 70</text><text x="47" y="392" class="mono" text-anchor="start">S02: 80</text><text x="35" y="492" class="greenText small" text-anchor="start">Release 1.0</text></g><g class="save2"><path d="M290 302 H438 L460 324 V452 H290 Z" class="paper"/><path d="M438 302 V324 H460" class="rule"/><text x="302" y="329" class="strong" text-anchor="start">r2</text><path class="rule" d="M302 341 L448 341"/><text x="302" y="367" class="mono" text-anchor="start">S01: 70</text><text x="302" y="392" class="mono" text-anchor="start">S02: 85</text><text x="290" y="492" class="muted small" text-anchor="start">Internal revision</text></g><g class="save3"><path d="M545 302 H693 L715 324 V452 H545 Z" class="paper"/><path d="M693 302 V324 H715" class="rule"/><text x="557" y="329" class="strong" text-anchor="start">r3</text><path class="rule" d="M557 341 L703 341"/><text x="557" y="367" class="mono" text-anchor="start">S01: 70</text><text x="557" y="392" class="mono" text-anchor="start">S02: 85</text><text x="557" y="417" class="mono" text-anchor="start">S03: 90</text><text x="545" y="492" class="greenText small" text-anchor="start">Release 1.1</text></g><text x="24" y="532" class="small muted" text-anchor="start">1. Save r1.   2. Save corrected r2.   3. Save expanded r3.</text></svg>