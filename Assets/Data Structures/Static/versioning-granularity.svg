<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415" role="img" aria-labelledby="title desc"><title id="title">A collection folder, its files, and a selected table row</title><desc id="desc">A folder contains Class A r2 and Class B r1. A separate Class A r2 table selects S02, mark 85.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42} .title{font-size:22px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:32px;font-weight:700}.muted{fill:#465d73}.blueText{fill:#1d4ed8}.greenText{fill:#047857}
