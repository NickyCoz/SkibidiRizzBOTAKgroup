</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="tip" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><text x="24" y="30" class="title" text-anchor="start">Choose the whole collection, one dataset, or a subset.</text><path class="blue" d="M24 91 V76 H162.6 L185.7 91 H354 V387 H24 Z"/><text x="38" y="121" class="strong" text-anchor="start">Quiz results / release 1.0</text><path d="M43 142 H160 L182 164 V284 H43 Z" class="green"/><path d="M160 142 V164 H182" class="rule"/><text x="55" y="169" class="strong" text-anchor="start">Class A / r2</text><path class="rule" d="M55 181 L170 181"/><text x="55" y="207" class="mono" text-anchor="start">S01: 70</text><text x="55" y="232" class="mono" text-anchor="start">S02: 85</text><path d="M197 142 H314 L336 164 V284 H197 Z" class="paper"/><path d="M314 142 V164 H336" class="rule"/><text x="209" y="169" class="strong" text-anchor="start">Class B / r1</text><path class="rule" d="M209 181 L324 181"/><text x="209" y="207" class="mono" text-anchor="start">S04: 60</text><text x="209" y="232" class="mono" text-anchor="start">S05: 75</text><text x="42" y="323" class="small" text-anchor="start">Manifest identifies the versions:</text><text x="42" y="350" class="mono" text-anchor="start">Class A r2; Class B r1</text><text x="391" y="105" class="strong" text-anchor="start">Subset of Class A r2</text><rect x="391" y="129" width="343" height="102" rx="6" class="paper"/><text x="403.0" y="152" class="strong" text-anchor="start">Student ID</text><text x="574.5" y="152" class="strong" text-anchor="start">Mark</text><path class="rule" d="M391 163 L734 163"/><text x="403.0" y="186" class="mono" text-anchor="start">S01</text><text x="574.5" y="186" class="mono" text-anchor="start">70</text><rect x="392" y="197" width="341" height="34" rx="0" class="green"/><path class="rule" d="M391 197 L734 197"/><text x="403.0" y="220" class="mono" text-anchor="start">S02</text><text x="574.5" y="220" class="mono" text-anchor="start">85</text><text x="391" y="279" class="mono" text-anchor="start">Selection: ID = S02</text><text x="391" y="312" class="muted small" text-anchor="start">Keep the dataset version</text><text x="391" y="336" class="muted small" text-anchor="start">with the selection rule.</text></svg>