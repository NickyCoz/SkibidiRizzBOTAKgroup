<svg xmlns="http://www.w3.org/2000/svg" width="480" height="207" viewBox="0 0 480 207" role="img" aria-labelledby="title desc">
  <title id="title">Peek at the front of the queue</title>
  <desc id="desc">Peek reads Nicky. Both items stay in place.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #0f172a; }
    .label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
    .heading { font-weight: 700; font-size: 19px; }
    .tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2px; }
    .focus { fill: #a7f3d0; stroke: #16835e; }
    .readout { fill: #fef3c7; stroke: #92630e; stroke-width: 2px; }
    .connector { fill: none; stroke: #16835e; stroke-width: 2.5px; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; stroke: #111827; }
      .connector { stroke: #4ade80; }
    }
  </style>
  <text class="label heading" x="240" y="26">Peek at the front of the queue</text>
  <text class="label" x="80" y="78">Front</text>
  <rect class="tile focus" x="30" y="90" width="100" height="40" rx="6"/>
  <text x="80" y="116">Nicky</text>
  <rect class="tile" x="140" y="90" width="110" height="40" rx="6"/>
  <text x="195" y="116">Darren</text>
  <g transform="translate(122 94)" aria-hidden="true">
    <g class="lens">
      <path d="M7 7 L16 16" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
      <path d="M7 7 L16 16" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <circle r="10" fill="#ecfdf5" stroke="#f8fafc" stroke-width="5"/>
      <circle r="10" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    </g>
  </g>
  <rect class="readout" x="303" y="71" width="151" height="44" rx="6"/>
  <g class="result">
    <path class="connector" d="M80 132 V151 H300 V114"/>
    <text x="378" y="99">Peek returns Nicky</text>
  </g>
  <text class="label" x="240" y="188">Both items stay in place.</text>
</svg>
