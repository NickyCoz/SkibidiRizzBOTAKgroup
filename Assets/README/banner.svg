  <title id="title">B.O.T.A.K. — Algorithms, Data Structures and Connectionist AI</title>
  <defs>
    <linearGradient id="accent">
      <stop stop-color="#b59aff"/><stop offset="1" stop-color="#77e5ee"/>
    </linearGradient>
    <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .label, .label-edge { fill: none; stroke-linecap: square; stroke-linejoin: bevel; }
      .label-edge { stroke: #242342; stroke-width: 7; }
      .label { stroke: url(#accent); stroke-width: 4.5; }
      .trace { fill: none; stroke: #6da7fa; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .spin, .brain, .glow { transform-box: fill-box; transform-origin: center; }
      .spin { animation: spin 3s linear infinite; }
      .reverse { animation-direction: reverse; animation-duration: 2.4s; }
      .brain { animation: breathe 4.5s ease-in-out infinite; transform-origin: right center; }
      .glow { animation: bloom 2.4s ease-in-out infinite; }
      .delay { animation-delay: -.8s; }
      .late { animation-delay: -1.6s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.09, 1.05); }
      }
      @keyframes bloom {
        0%, 100% { opacity: .18; transform: scale(.65); }
        38% { opacity: 1; transform: scale(1.55); }
      }
      @media (prefers-reduced-motion: reduce) { .spin, .brain, .glow { animation: none; } }
    </style>
  </defs>

