<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Precision@10 and recall@10</title>
  <desc id="desc">Three of ten shown items are relevant. The user has six relevant items total, so precision is three tenths and recall is three sixths.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Precision@10 and recall@10</text>
  <text x="362" y="61" class="label">Top 10 shown items</text>
  <g class="tile">
    <rect x="48" y="78" width="51" height="40" rx="4" class="green" />
    <text x="73.5" y="104" class="label ink">1</text>
  </g>
  <g class="tile">
    <rect x="111" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="136.5" y="104" class="label ink">2</text>
  </g>
  <g class="tile">
    <rect x="174" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="199.5" y="104" class="label ink">3</text>
  </g>
  <g class="tile">
    <rect x="237" y="78" width="51" height="40" rx="4" class="green" />
    <text x="262.5" y="104" class="label ink">4</text>
  </g>
  <g class="tile">
    <rect x="300" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="325.5" y="104" class="label ink">5</text>
  </g>
  <g class="tile">
    <rect x="363" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="388.5" y="104" class="label ink">6</text>
  </g>
  <g class="tile">
    <rect x="426" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="451.5" y="104" class="label ink">7</text>
  </g>
  <g class="tile">
    <rect x="489" y="78" width="51" height="40" rx="4" class="green" />
    <text x="514.5" y="104" class="label ink">8</text>
  </g>
  <g class="tile">
    <rect x="552" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="577.5" y="104" class="label ink">9</text>
  </g>
  <g class="tile">
    <rect x="615" y="78" width="51" height="40" rx="4" class="blue" />
    <text x="640.5" y="104" class="label ink">10</text>
  </g>
  <text x="140" y="159" class="label">Relevant shown</text>
  <circle cx="307" cy="153" r="9" class="green" />
  <circle cx="349" cy="153" r="9" class="green" />
  <circle cx="391" cy="153" r="9" class="green" />
  <circle cx="433" cy="153" r="9" class="amber" />
  <circle cx="475" cy="153" r="9" class="amber" />
  <circle cx="517" cy="153" r="9" class="amber" />
  <g class="tile">
    <rect x="61" y="186" width="267" height="38" rx="10" class="blue" />
    <text x="194.5" y="210" class="label ink">Precision@10 = 3 / 10 = 0.30</text>
  </g>
  <g class="tile">
    <rect x="383" y="186" width="275" height="38" rx="10" class="violet" />
    <text x="520.5" y="210" class="label ink">Recall@10 = 3 / 6 = 0.50</text>
  </g>
</svg>
