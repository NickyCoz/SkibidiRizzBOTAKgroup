<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="title desc">
  <title id="title">GAN training</title>
  <desc id="desc">The discriminator sees examples from the training data and examples made by the generator. Feedback through the discriminator gives the generator a learning signal.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">GAN training</text>
  <g class="tile">
    <rect x="31" y="106" width="102" height="38" rx="19" class="blue"/>
    <text x="82" y="130" class="label">Noise</text>
  </g>
  <path d="M138 125L169 125" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="175" y="106" width="145" height="38" rx="19" class="violet"/>
    <text x="247.5" y="130" class="label">Generator</text>
  </g>
  <path d="M325 125L408 125" class="edge" marker-end="url(#arrow)"/>
  <text x="365" y="113" class="note">Fake</text>
  <g class="tile">
    <rect x="403" y="48" width="146" height="38" rx="19" class="blue"/>
    <text x="476" y="72" class="label">Training data</text>
  </g>
  <path d="M477 88L477 103" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="414" y="106" width="147" height="38" rx="19" class="green"/>
    <text x="487.5" y="130" class="label">Discriminator</text>
  </g>
  <path d="M567 125L600 125" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="606" y="106" width="90" height="38" rx="19" class="amber"/>
    <text x="651" y="130" class="label">Real?</text>
  </g>
  <path d="M488 146V185H248V148" class="edge" marker-end="url(#arrow)"/>
  <text x="368" y="210" class="note">Generator feedback</text>
</svg>
