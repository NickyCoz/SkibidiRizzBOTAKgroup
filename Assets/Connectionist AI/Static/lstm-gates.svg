<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
  <title id="title">LSTM memory and gates</title>
  <desc id="desc">The forget gate scales old memory, the input gate controls the new candidate added to memory, and the output gate controls how much of the transformed memory is exposed.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">LSTM memory and gates</text>
  <g class="tile">
    <rect x="24" y="61" width="130" height="36" rx="12" class="blue"/>
    <text x="89" y="84" class="label">Previous memory</text>
  </g>
  <path d="M160 79L190 79" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="196" y="61" width="126" height="36" rx="12" class="amber"/>
    <text x="259" y="84" class="label">Forget gate</text>
  </g>
  <path d="M328 79L371 79" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <circle cx="395" cy="79" r="19" class="violet"/>
    <text x="395" y="85" class="num">+</text>
  </g>
  <path d="M418 79L458 79" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="465" y="61" width="137" height="36" rx="12" class="green"/>
    <text x="533.5" y="84" class="label">New memory</text>
  </g>
  <g class="tile">
    <rect x="72" y="148" width="140" height="36" rx="12" class="blue"/>
    <text x="142" y="171" class="label">New candidate</text>
  </g>
  <path d="M218 166L250 166" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="256" y="148" width="126" height="36" rx="12" class="amber"/>
    <text x="319" y="171" class="label">Input gate</text>
  </g>
  <path d="M383 166H395V104" class="edge" marker-end="url(#arrow)"/>
  <path d="M531 103V133" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="465" y="139" width="137" height="36" rx="12" class="amber"/>
    <text x="533.5" y="162" class="label">Output gate</text>
  </g>
  <path d="M606 157L632 157" class="edge" marker-end="url(#arrow)"/>
  <text x="666" y="163" class="note">State hₜ</text>
  <text x="530" y="121" class="note">tanh</text>
</svg>
