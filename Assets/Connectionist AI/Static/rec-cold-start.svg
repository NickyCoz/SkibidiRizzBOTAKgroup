<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
  <title id="title">New-item cold start</title>
  <desc id="desc">A new item with no interactions can still be represented by its content features. Genre, description and image can feed an item encoder.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">New-item cold start</text>
  <g class="tile">
    <rect x="39" y="77" width="151" height="83" rx="7" class="blue" />
    <text x="114" y="108" class="label ink">New item</text>
    <text x="114" y="135" class="note ink">0 interactions</text>
  </g>
  <g class="tile">
    <rect x="255" y="62" width="126" height="38" rx="10" class="violet" />
    <text x="318" y="86" class="label ink">Genre</text>
  </g>
  <g class="tile">
    <rect x="255" y="107" width="126" height="38" rx="10" class="violet" />
    <text x="318" y="131" class="label ink">Description</text>
  </g>
  <g class="tile">
    <rect x="255" y="152" width="126" height="38" rx="10" class="violet" />
    <text x="318" y="176" class="label ink">Image</text>
  </g>
  <path d="M193 118L249 81" class="edge" marker-end="url(#arrow)" />
  <path d="M193 118L249 126" class="edge" marker-end="url(#arrow)" />
  <path d="M193 118L249 171" class="edge" marker-end="url(#arrow)" />
  <path d="M386 81L467 126" class="edge" marker-end="url(#arrow)" />
  <path d="M386 126L467 126" class="edge" marker-end="url(#arrow)" />
  <path d="M386 171L467 126" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="474" y="107" width="198" height="38" rx="10" class="green" />
    <text x="573" y="131" class="label ink">Content embedding</text>
  </g>
</svg>
