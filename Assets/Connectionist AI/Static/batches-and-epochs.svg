<svg xmlns="http://www.w3.org/2000/svg" width="720" height="208" viewBox="0 0 720 208" role="img" aria-labelledby="title desc">
  <title id="title">Batches and epochs</title>
  <desc id="desc">A training set of one thousand examples is split into ten batches of one hundred. In this example, each batch triggers one update, so one epoch contains ten updates.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Batches and epochs</text>
  <text x="360" y="65" class="label">1,000 examples · 100 per batch</text>
  <g class="tile batch"><title>Batch 1</title><rect x="32" y="87" width="52" height="47" rx="8" class="blue"/><text x="58" y="116" class="label">1</text></g>
  <g class="tile batch"><title>Batch 2</title><rect x="99" y="87" width="52" height="47" rx="8" class="blue"/><text x="125" y="116" class="label">2</text></g>
  <g class="tile batch"><title>Batch 3</title><rect x="166" y="87" width="52" height="47" rx="8" class="blue"/><text x="192" y="116" class="label">3</text></g>
  <g class="tile batch"><title>Batch 4</title><rect x="233" y="87" width="52" height="47" rx="8" class="blue"/><text x="259" y="116" class="label">4</text></g>
  <g class="tile batch"><title>Batch 5</title><rect x="300" y="87" width="52" height="47" rx="8" class="blue"/><text x="326" y="116" class="label">5</text></g>
  <g class="tile batch"><title>Batch 6</title><rect x="367" y="87" width="52" height="47" rx="8" class="blue"/><text x="393" y="116" class="label">6</text></g>
  <g class="tile batch"><title>Batch 7</title><rect x="434" y="87" width="52" height="47" rx="8" class="blue"/><text x="460" y="116" class="label">7</text></g>
  <g class="tile batch"><title>Batch 8</title><rect x="501" y="87" width="52" height="47" rx="8" class="blue"/><text x="527" y="116" class="label">8</text></g>
  <g class="tile batch"><title>Batch 9</title><rect x="568" y="87" width="52" height="47" rx="8" class="blue"/><text x="594" y="116" class="label">9</text></g>
  <g class="tile batch"><title>Batch 10</title><rect x="635" y="87" width="52" height="47" rx="8" class="blue"/><text x="661" y="116" class="label">10</text></g>
  <path d="M32 151v12h655v-12" class="edge"/>
  <text x="360" y="187" class="label">1 epoch · 10 batches · 10 updates</text>
</svg>
