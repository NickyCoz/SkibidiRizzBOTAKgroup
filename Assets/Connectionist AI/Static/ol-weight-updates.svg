<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
  <title id="title">Two online regression updates</title>
  <desc id="desc">The chapter starts the linear model weight at zero. Sample one moves it to 1.6. Sample two moves it to 1.68, toward the illustrative underlying slope of two.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Two online regression updates</text>
  <text x="116" y="207" class="note">0</text>
  <text x="236.24" y="207" class="note">0.5</text>
  <text x="356.48" y="207" class="note">1</text>
  <text x="476.71" y="207" class="note">1.5</text>
  <text x="596.95" y="207" class="note">2</text>
  <path d="M116 188L630 188" class="edge" marker-end="url(#arrow)" />
  <path d="M116 188L116 64" class="edge" marker-end="url(#arrow)" />
  <text x="368.5" y="227" class="note">Linear weight w</text>
  <text x="106" y="55" class="note"></text>
  <path d="M596.95 65V196" class="guide" />
  <text x="596.95" y="57" class="note">True slope 2</text>
  <circle cx="116" cy="144" r="6" class="blue" />
  <path d="M124 144L492.76 144" class="edge" marker-end="url(#arrow)" />
  <circle cx="500.76" cy="144" r="6" class="violet" />
  <path d="M500.76 108L520 108" class="edge" marker-end="url(#arrow)" />
  <circle cx="520" cy="108" r="6" class="green" />
  <text x="134" y="163" class="note">Start 0</text>
  <text x="470.76" y="164" class="note">After sample 1: 1.6</text>
  <text x="482" y="93" class="note">After sample 2: 1.68</text>
</svg>
