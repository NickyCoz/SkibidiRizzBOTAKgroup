<svg xmlns="http://www.w3.org/2000/svg" width="720" height="201" viewBox="0 0 720 201" role="img" aria-labelledby="title desc">
  <title id="title">Dense layer matrix form</title>
  <desc id="desc">In a dense layer with three inputs and two output neurons, the first row holds the three weights for the first neuron, and the second row holds the weights for the second neuron.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Dense layer matrix form</text>
  <text x="124" y="63" class="label">Weights W</text>
  <text x="311" y="63" class="label">Inputs x</text>
  <text x="467" y="63" class="label">Bias b</text>
  <text x="623" y="63" class="label">Pre-activation z</text>
  <g class="tile">
    <rect x="42" y="91" width="51" height="39" rx="8" class="blue"/>
    <text x="67" y="116" class="label">w₁₁</text>
    <rect x="97" y="91" width="51" height="39" rx="8" class="blue"/>
    <text x="122" y="116" class="label">w₁₂</text>
    <rect x="152" y="91" width="51" height="39" rx="8" class="blue"/>
    <text x="177" y="116" class="label">w₁₃</text>
  </g>
  <g class="tile">
    <rect x="424" y="91" width="86" height="38" rx="19" class="blue"/>
    <text x="467" y="115" class="label">b₁</text>
  </g>
  <g class="tile">
    <rect x="580" y="91" width="86" height="38" rx="19" class="blue"/>
    <text x="623" y="115" class="label">z₁</text>
  </g>
  <g class="tile">
    <rect x="42" y="136" width="51" height="39" rx="8" class="violet"/>
    <text x="67" y="161" class="label">w₂₁</text>
    <rect x="97" y="136" width="51" height="39" rx="8" class="violet"/>
    <text x="122" y="161" class="label">w₂₂</text>
    <rect x="152" y="136" width="51" height="39" rx="8" class="violet"/>
    <text x="177" y="161" class="label">w₂₃</text>
  </g>
  <g class="tile">
    <rect x="424" y="136" width="86" height="38" rx="19" class="violet"/>
    <text x="467" y="160" class="label">b₂</text>
  </g>
  <g class="tile">
    <rect x="580" y="136" width="86" height="38" rx="19" class="violet"/>
    <text x="623" y="160" class="label">z₂</text>
  </g>
  <g class="tile">
    <rect x="271" y="76" width="80" height="38" rx="19" class="blue"/>
    <text x="311" y="100" class="label">x₁</text>
  </g>
  <g class="tile">
    <rect x="271" y="114" width="80" height="38" rx="19" class="blue"/>
    <text x="311" y="138" class="label">x₂</text>
  </g>
  <g class="tile">
    <rect x="271" y="152" width="80" height="38" rx="19" class="blue"/>
    <text x="311" y="176" class="label">x₃</text>
  </g>
  <text x="229" y="126" class="num">×</text>
  <text x="389" y="126" class="num">+</text>
  <text x="544" y="126" class="num">=</text>
</svg>
