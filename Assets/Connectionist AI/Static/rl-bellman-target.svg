<svg xmlns="http://www.w3.org/2000/svg" width="720" height="212" viewBox="0 0 720 212" role="img" aria-labelledby="title desc">
  <title id="title">One-step Bellman target</title>
  <desc id="desc">The worked example combines immediate reward one with the best next-state value two discounted by 0.9, giving target 2.8.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">One-step Bellman target</text>
  <g class="tile">
    <rect x="30" y="73" width="141" height="38" rx="10" class="blue" />
    <text x="100.5" y="97" class="label ink">Reward 1</text>
  </g>
  <text x="203" y="99" class="num">+</text>
  <g class="tile">
    <rect x="242" y="73" width="184" height="38" rx="10" class="violet" />
    <text x="334" y="97" class="label ink">Discounted next value</text>
  </g>
  <text x="463" y="99" class="num">=</text>
  <g class="tile">
    <rect x="502" y="73" width="181" height="38" rx="10" class="green" />
    <text x="592.5" y="97" class="label ink">Target 2.8</text>
  </g>
  <text x="334" y="143" class="label">0.9 × 2 = 1.8</text>
</svg>
