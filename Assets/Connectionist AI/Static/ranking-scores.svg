<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation ranking</title>
  <desc id="desc">Candidate A scores 0.42, B scores 0.91, and C scores 0.67. Sorting by score places B first, C second, and A third.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Recommendation ranking</text>
  <text x="164" y="63" class="label">Candidate scores</text>
  <text x="550" y="63" class="label">Ranked feed</text>
  <g class="tile">
    <rect x="71" y="81" width="185" height="38" rx="19" class="blue"/>
    <text x="163.5" y="105" class="label">Item A · 0.42</text>
  </g>
  <g class="tile">
    <rect x="71" y="124" width="185" height="38" rx="19" class="blue"/>
    <text x="163.5" y="148" class="label">Item B · 0.91</text>
  </g>
  <g class="tile">
    <rect x="71" y="167" width="185" height="38" rx="19" class="blue"/>
    <text x="163.5" y="191" class="label">Item C · 0.67</text>
  </g>
  <g class="tile">
    <rect x="456" y="81" width="185" height="38" rx="19" class="green"/>
    <text x="548.5" y="105" class="label">1. Item B</text>
  </g>
  <g class="tile">
    <rect x="456" y="124" width="185" height="38" rx="19" class="green"/>
    <text x="548.5" y="148" class="label">2. Item C</text>
  </g>
  <g class="tile">
    <rect x="456" y="167" width="185" height="38" rx="19" class="green"/>
    <text x="548.5" y="191" class="label">3. Item A</text>
  </g>
  <path d="M278 141L433 141" class="edge" marker-end="url(#arrow)"/>
  <text x="355" y="125" class="note">Sort by score</text>
</svg>
