<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-labelledby="title desc">
  <title id="title">Requirements for deep learning</title>
  <desc id="desc">Examples provide a learning signal, parallel hardware speeds computation, and training methods help deep networks update effectively.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Requirements for deep learning</text>
  <g class="tile">
    <rect x="37" y="57" width="188" height="38" rx="19" class="blue"/>
    <text x="131" y="81" class="label">Data</text>
  </g>
  <text x="131" y="116" class="note">Examples to learn from</text>
  <path d="M131 124L291.3 157" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="266" y="57" width="188" height="38" rx="19" class="violet"/>
    <text x="360" y="81" class="label">Compute</text>
  </g>
  <text x="360" y="116" class="note">Fast parallel calculations</text>
  <path d="M360 124L360 157" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="495" y="57" width="188" height="38" rx="19" class="green"/>
    <text x="589" y="81" class="label">Methods</text>
  </g>
  <text x="589" y="116" class="note">Stable, effective updates</text>
  <path d="M589 124L428.7 157" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="253" y="162" width="214" height="38" rx="19" class="amber"/>
    <text x="360" y="186" class="label">Practical deep training</text>
  </g>
</svg>
