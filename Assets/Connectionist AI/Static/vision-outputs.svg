<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision outputs</title>
  <desc id="desc">Classification gives the whole image a label, detection places a box around each object, and segmentation marks the pixels belonging to each object.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .outline { fill: none; stroke: #6538aa; stroke-width: 2; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Computer vision outputs</text>
  <text x="141" y="69" class="label">Classification</text>
  <g class="tile">
    <rect x="63" y="84" width="157" height="102" rx="8" class="blue"/>
    <path d="M74 166H209" class="edge"/>
    <rect x="94" y="124" width="33" height="36" rx="5" class="amber"/>
    <circle cx="169" cy="141" r="18" class="amber"/>
  </g>
  <text x="141" y="213" class="note">Whole image: toys</text>
  <text x="359" y="69" class="label">Detection</text>
  <g class="tile">
    <rect x="281" y="84" width="157" height="102" rx="8" class="blue"/>
    <path d="M292 166H427" class="edge"/>
    <rect x="312" y="124" width="33" height="36" rx="5" class="amber"/>
    <circle cx="387" cy="141" r="18" class="amber"/>
    <rect x="305" y="117" width="47" height="50" rx="1" class="outline"/>
    <rect x="363" y="117" width="48" height="48" rx="1" class="outline"/>
  </g>
  <text x="359" y="213" class="note">Where each toy is</text>
  <text x="577" y="69" class="label">Segmentation</text>
  <g class="tile">
    <rect x="499" y="84" width="157" height="102" rx="8" class="blue"/>
    <path d="M510 166H645" class="edge"/>
    <rect x="530" y="124" width="33" height="36" rx="10" class="violet"/>
    <circle cx="605" cy="141" r="18" class="green"/>
  </g>
  <text x="577" y="213" class="note">Which pixels belong to each toy</text>
</svg>
