<svg xmlns="http://www.w3.org/2000/svg" width="720" height="227" viewBox="0 0 720 227" role="img" aria-labelledby="title desc">
  <title id="title">Shortage cost and stocking quantile</title>
  <desc id="desc">The chapter assigns cost nine per unit short and cost one per unit left over. The optimal quantile for these costs is 0.9.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Shortage cost and stocking quantile</text>
  <text x="166" y="63" class="label">Shortage cost per unit</text>
  <text x="550" y="63" class="label">Leftover cost per unit</text>
  <rect x="52" y="81" width="31" height="28" rx="4" class="amber" />
  <rect x="94" y="81" width="31" height="28" rx="4" class="amber" />
  <rect x="136" y="81" width="31" height="28" rx="4" class="amber" />
  <rect x="178" y="81" width="31" height="28" rx="4" class="amber" />
  <rect x="220" y="81" width="31" height="28" rx="4" class="amber" />
  <rect x="52" y="118" width="31" height="28" rx="4" class="amber" />
  <rect x="94" y="118" width="31" height="28" rx="4" class="amber" />
  <rect x="136" y="118" width="31" height="28" rx="4" class="amber" />
  <rect x="178" y="118" width="31" height="28" rx="4" class="amber" />
  <rect x="535" y="90" width="31" height="28" rx="4" class="blue" />
  <text x="167" y="173" class="label">9</text>
  <text x="550" y="173" class="label">1</text>
  <path d="M270 129L324 183" class="edge" marker-end="url(#arrow)" />
  <path d="M478 129L425 183" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="280" y="185" width="191" height="38" rx="10" class="green" />
    <text x="375.5" y="209" class="label ink">τ* = 0.90 → P90</text>
  </g>
</svg>
