<svg xmlns="http://www.w3.org/2000/svg" width="720" height="238" viewBox="0 0 720 238" role="img" aria-labelledby="title desc">
  <title id="title">DQN action values</title>
  <desc id="desc">A neural network maps an illustrative state vector to one value per discrete action. The action with the larger estimated Q-value is the greedy choice.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">DQN action values</text>
  <g class="tile">
    <rect x="28" y="104" width="145" height="38" rx="10" class="blue" />
    <text x="100.5" y="128" class="label ink">State features</text>
  </g>
  <path d="M179 123L250 123" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="256" y="104" width="156" height="38" rx="10" class="violet" />
    <text x="334" y="128" class="label ink">Q-network</text>
  </g>
  <path d="M418 123L483 88" class="edge" marker-end="url(#arrow)" />
  <path d="M418 123L483 169" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="489" y="69" width="195" height="38" rx="10" class="blue" />
    <text x="586.5" y="93" class="label ink">Left · Q = 0.2</text>
  </g>
  <g class="tile">
    <rect x="489" y="150" width="195" height="38" rx="10" class="green" />
    <text x="586.5" y="174" class="label ink">Right · Q = 0.8</text>
  </g>
  <text x="588" y="217" class="note">Greedy action: right</text>
</svg>
