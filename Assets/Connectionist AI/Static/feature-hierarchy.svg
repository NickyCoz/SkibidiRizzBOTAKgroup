<svg xmlns="http://www.w3.org/2000/svg" width="720" height="186" viewBox="0 0 720 186" role="img" aria-labelledby="title desc">
  <title id="title">Visual feature hierarchy</title>
  <desc id="desc">An illustrative image pipeline moves from pixels to edges to a shape part and finally to a wheel-like pattern.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Visual feature hierarchy</text>
  <text x="104" y="68" class="label">Pixels</text>
  <rect x="57" y="82" width="94" height="88" rx="8" class="blue"/>
  <text x="274" y="68" class="label">Edges</text>
  <rect x="227" y="82" width="94" height="88" rx="8" class="blue"/>
  <text x="444" y="68" class="label">Part</text>
  <rect x="397" y="82" width="94" height="88" rx="8" class="blue"/>
  <text x="614" y="68" class="label">Pattern</text>
  <rect x="567" y="82" width="94" height="88" rx="8" class="blue"/>
  <path d="M156 126L219 126" class="edge" marker-end="url(#arrow)"/>
  <path d="M326 126L389 126" class="edge" marker-end="url(#arrow)"/>
  <path d="M496 126L559 126" class="edge" marker-end="url(#arrow)"/>
  <rect x="75" y="97" width="13" height="13" rx="1" class="blue"/>
  <rect x="90" y="97" width="13" height="13" rx="1" class="violet"/>
  <rect x="105" y="97" width="13" height="13" rx="1" class="violet"/>
  <rect x="120" y="97" width="13" height="13" rx="1" class="blue"/>
  <rect x="75" y="112" width="13" height="13" rx="1" class="violet"/>
  <rect x="90" y="112" width="13" height="13" rx="1" class="blue"/>
  <rect x="105" y="112" width="13" height="13" rx="1" class="blue"/>
  <rect x="120" y="112" width="13" height="13" rx="1" class="violet"/>
  <rect x="75" y="127" width="13" height="13" rx="1" class="violet"/>
  <rect x="90" y="127" width="13" height="13" rx="1" class="blue"/>
  <rect x="105" y="127" width="13" height="13" rx="1" class="blue"/>
  <rect x="120" y="127" width="13" height="13" rx="1" class="violet"/>
  <rect x="75" y="142" width="13" height="13" rx="1" class="blue"/>
  <rect x="90" y="142" width="13" height="13" rx="1" class="violet"/>
  <rect x="105" y="142" width="13" height="13" rx="1" class="violet"/>
  <rect x="120" y="142" width="13" height="13" rx="1" class="blue"/>
  <path d="M250 144V109H275 M284 109H298V144" class="violet-line"/>
  <path d="M418 143A27 27 0 0 1 472 143" class="violet-line"/>
  <circle cx="614" cy="126" r="28" class="violet"/>
  <circle cx="614" cy="126" r="7" class="green"/>
  <path d="M614 99V153M587 126H641" class="green-line"/>
</svg>
