<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">User-based collaborative filtering</title>
  <desc id="desc">Alice and Bob have matching ratings for movies A and B. Bob rated C highly, suggesting C as a candidate for Alice. Carol has a different rating pattern.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">User-based collaborative filtering</text>
  <text x="296" y="65" class="note">Movie A</text>
  <text x="404" y="65" class="note">Movie B</text>
  <text x="512" y="65" class="note">Movie C</text>
  <text x="131" y="102" class="label">Alice</text>
  <g class="tile">
    <rect x="270" y="80" width="54" height="34" rx="4" class="violet" />
    <text x="297" y="103" class="label ink">5</text>
  </g>
  <g class="tile">
    <rect x="378" y="80" width="54" height="34" rx="4" class="violet" />
    <text x="405" y="103" class="label ink">4</text>
  </g>
  <g class="tile">
    <rect x="486" y="80" width="54" height="34" rx="4" class="violet" />
    <text x="513" y="103" class="label ink">?</text>
  </g>
  <text x="131" y="150" class="label">Bob</text>
  <g class="tile">
    <rect x="270" y="128" width="54" height="34" rx="4" class="violet" />
    <text x="297" y="151" class="label ink">5</text>
  </g>
  <g class="tile">
    <rect x="378" y="128" width="54" height="34" rx="4" class="violet" />
    <text x="405" y="151" class="label ink">4</text>
  </g>
  <g class="tile">
    <rect x="486" y="128" width="54" height="34" rx="4" class="violet" />
    <text x="513" y="151" class="label ink">5</text>
  </g>
  <text x="131" y="198" class="label">Carol</text>
  <g class="tile">
    <rect x="270" y="176" width="54" height="34" rx="4" class="blue" />
    <text x="297" y="199" class="label ink">1</text>
  </g>
  <g class="tile">
    <rect x="378" y="176" width="54" height="34" rx="4" class="blue" />
    <text x="405" y="199" class="label ink">2</text>
  </g>
  <g class="tile">
    <rect x="486" y="176" width="54" height="34" rx="4" class="blue" />
    <text x="513" y="199" class="label ink">1</text>
  </g>
  <path d="M596 145H629V97H597" class="edge" marker-end="url(#arrow)" />
  <text x="366" y="235" class="note">Similar rating histories</text>
</svg>
