<svg xmlns="http://www.w3.org/2000/svg" width="720" height="259" viewBox="0 0 720 259" role="img" aria-labelledby="title desc">
  <title id="title">Point forecast and predictive distribution</title>
  <desc id="desc">A point forecast at one hundred is shown inside a normal predictive distribution with mean one hundred and standard deviation ten. Different widths represent different uncertainty, even for the same point forecast.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Point forecast and predictive distribution</text>
  <path d="M98 189H629" class="guide" />
  <text x="76" y="193" class="note">0</text>
  <path d="M98 133.89H629" class="guide" />
  <text x="76" y="137.89" class="note">0.02</text>
  <path d="M98 78.78H629" class="guide" />
  <text x="76" y="82.78" class="note">0.04</text>
  <text x="98" y="208" class="note">50</text>
  <text x="230.75" y="208" class="note">75</text>
  <text x="363.5" y="208" class="note">100</text>
  <text x="496.25" y="208" class="note">125</text>
  <text x="629" y="208" class="note">150</text>
  <path d="M98 189L638 189" class="edge" marker-end="url(#arrow)" />
  <path d="M98 189L98 57" class="edge" marker-end="url(#arrow)" />
  <text x="363.5" y="228" class="note">Demand</text>
  <text x="88" y="48" class="note">Density</text>
