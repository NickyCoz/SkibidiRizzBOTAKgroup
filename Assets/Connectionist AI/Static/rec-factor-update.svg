<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="title desc">
  <title id="title">Matrix-factorisation update</title>
  <desc id="desc">The chapter's simultaneous embedding update moves the score from five to 3.55 while the true rating is four. It overshoots the target but reduces absolute error from one to 0.45.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Matrix-factorisation update</text>
  <path d="M79 133L654 133" class="edge" marker-end="url(#arrow)" />
  <circle cx="185" cy="133" r="6" class="violet" />
  <text x="185" y="160" class="note">3.55</text>
  <text x="185" y="190" class="note">After update</text>
  <circle cx="315" cy="133" r="6" class="green" />
  <text x="315" y="160" class="note">4</text>
  <text x="315" y="190" class="note">True rating</text>
  <circle cx="604" cy="133" r="6" class="blue" />
  <text x="604" y="160" class="note">5</text>
  <text x="604" y="190" class="note">Before update</text>
  <path d="M596 106Q390 40 194 106" class="edge" marker-end="url(#arrow)" />
  <text x="393" y="61" class="note">One simultaneous update</text>
</svg>
