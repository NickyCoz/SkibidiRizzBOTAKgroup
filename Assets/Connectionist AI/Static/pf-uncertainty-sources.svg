<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">Aleatoric and epistemic uncertainty</title>
  <desc id="desc">The left panel shows random variation around a shared pattern. The right shows several model predictions disagreeing increasingly over the forecast range. Curves are illustrative.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
