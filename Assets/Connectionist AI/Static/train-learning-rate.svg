  <path d="M100 84.86H629" class="guide" />
  <text x="78" y="88.86" class="note">1.2</text>
  <text x="100" y="211" class="note">0</text>
  <text x="276.33" y="211" class="note">4</text>
  <text x="452.67" y="211" class="note">8</text>
  <text x="629" y="211" class="note">12</text>
  <path d="M100 192L638 192" class="edge" marker-end="url(#arrow)" />
  <path d="M100 192L100 59" class="edge" marker-end="url(#arrow)" />
  <text x="364.5" y="231" class="note">Update step</text>
  <text x="90" y="50" class="note">Loss / initial loss</text>
  <path d="M100 102.71 L144.08 109.71 L188.17 116.17 L232.25 122.11 L276.33 127.59 L320.42 132.64 L364.5 137.29 L408.58 141.58 L452.67 145.54 L496.75 149.18 L540.83 152.54 L584.92 155.63 L629 158.48" class="blue-line" />
