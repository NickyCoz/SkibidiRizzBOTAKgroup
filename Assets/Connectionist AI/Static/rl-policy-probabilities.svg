<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" role="img" aria-labelledby="title desc">
  <title id="title">Policy network probabilities</title>
  <desc id="desc">An illustrative policy maps state features to probabilities of left 0.25 and right 0.75. Actions are sampled from the distribution during stochastic behavior.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Policy network probabilities</text>
  <g class="tile">
    <rect x="31" y="94" width="139" height="38" rx="10" class="blue" />
    <text x="100.5" y="118" class="label ink">State</text>
  </g>
  <path d="M176 113L244 113" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="250" y="94" width="171" height="38" rx="10" class="violet" />
    <text x="335.5" y="118" class="label ink">Policy network</text>
  </g>
  <path d="M427 113L474 113" class="edge" marker-end="url(#arrow)" />
  <text x="521" y="70" class="label">Left</text>
  <text x="631" y="70" class="label">Right</text>
  <rect x="490" y="139.25" width="62" height="13.75" rx="4" class="blue" />
  <rect x="600" y="111.75" width="62" height="41.25" rx="4" class="green" />
  <text x="521" y="176" class="note">0.25</text>
  <text x="631" y="176" class="note">0.75</text>
  <text x="575" y="209" class="note">Action probabilities</text>
</svg>
