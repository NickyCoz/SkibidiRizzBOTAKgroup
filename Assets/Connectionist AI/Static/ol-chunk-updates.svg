<svg xmlns="http://www.w3.org/2000/svg" width="720" height="205" viewBox="0 0 720 205" role="img" aria-labelledby="title desc">
  <title id="title">Mini-batch incremental updates</title>
  <desc id="desc">A stream of examples fills a small buffer. One update uses the filled chunk, then the buffer is reused for later incoming data.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Mini-batch incremental updates</text>
  <circle cx="48" cy="108" r="7" class="blue" />
  <circle cx="84" cy="108" r="7" class="blue" />
  <circle cx="120" cy="108" r="7" class="blue" />
  <circle cx="156" cy="108" r="7" class="blue" />
  <path d="M168 108L218 108" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="224" y="70" width="173" height="76" rx="7" class="violet" />
    <circle cx="253" cy="94" r="6" class="blue" />
    <circle cx="287" cy="94" r="6" class="blue" />
    <circle cx="321" cy="94" r="6" class="blue" />
    <circle cx="355" cy="94" r="6" class="blue" />
    <circle cx="253" cy="122" r="6" class="blue" />
    <circle cx="287" cy="122" r="6" class="blue" />
    <circle cx="321" cy="122" r="6" class="blue" />
    <circle cx="355" cy="122" r="6" class="blue" />
  </g>
  <path d="M403 108L462 108" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="468" y="89" width="217" height="38" rx="10" class="green" />
    <text x="576.5" y="113" class="label ink">One incremental update</text>
  </g>
  <path d="M578 132V174H309V151" class="edge" marker-end="url(#arrow)" />
  <text x="441" y="194" class="note">Reuse buffer for next chunk</text>
</svg>
