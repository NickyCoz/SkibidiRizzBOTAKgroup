<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img" aria-labelledby="title desc">
  <title id="title">Replay with new and past examples</title>
  <desc id="desc">New examples are combined with a sample of earlier examples retained in a bounded memory. The mixed batch updates the model.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Replay with new and past examples</text>
  <g class="tile">
    <rect x="40" y="61" width="170" height="38" rx="10" class="blue" />
    <text x="125" y="85" class="label ink">New examples</text>
  </g>
  <g class="tile">
    <rect x="40" y="139" width="170" height="38" rx="10" class="violet" />
    <text x="125" y="163" class="label ink">Replay memory</text>
  </g>
  <circle cx="74" cy="194" r="6" class="violet" />
  <circle cx="114" cy="194" r="6" class="violet" />
  <circle cx="154" cy="194" r="6" class="violet" />
  <path d="M216 80L318 123" class="edge" marker-end="url(#arrow)" />
  <path d="M216 158L318 137" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="325" y="105" width="146" height="38" rx="10" class="amber" />
    <text x="398" y="129" class="label ink">Mixed batch</text>
  </g>
  <path d="M477 124L524 124" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="531" y="105" width="152" height="38" rx="10" class="green" />
    <text x="607" y="129" class="label ink">Update model</text>
  </g>
  <path d="M210 81H245V157H216" class="guide" marker-end="url(#arrow)" />
  <text x="320" y="214" class="note">Keep a bounded sample</text>
</svg>
