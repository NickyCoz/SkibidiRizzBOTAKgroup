<svg xmlns="http://www.w3.org/2000/svg" width="720" height="233" viewBox="0 0 720 233" role="img" aria-labelledby="title desc">
  <title id="title">Training and prediction</title>
  <desc id="desc">In training, the model compares its output with a known target and updates its weights. When using the trained model for prediction, the weights are held fixed.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Training and prediction</text>
  <text x="76" y="84" class="label">Training</text>
  <g class="tile">
    <rect x="153" y="61" width="133" height="36" rx="12" class="blue"/>
    <text x="219.5" y="84" class="label">Known example</text>
  </g>
  <path d="M292 79L320 79" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="326" y="61" width="138" height="36" rx="12" class="violet"/>
    <text x="395" y="84" class="label">Model output</text>
  </g>
  <path d="M469 79L499 79" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="505" y="61" width="174" height="36" rx="12" class="green"/>
    <text x="592" y="84" class="label">Compare with target</text>
  </g>
  <path d="M591 99V128H392V101" class="edge" marker-end="url(#arrow)"/>
  <text x="492" y="151" class="note">Update weights</text>
  <text x="76" y="197" class="label">Prediction</text>
  <g class="tile">
    <rect x="153" y="174" width="133" height="36" rx="12" class="blue"/>
    <text x="219.5" y="197" class="label">New input</text>
  </g>
  <path d="M292 192L320 192" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="326" y="174" width="138" height="36" rx="12" class="violet"/>
    <text x="395" y="197" class="label">Fixed weights</text>
  </g>
  <path d="M469 192L499 192" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="505" y="174" width="174" height="36" rx="12" class="green"/>
    <text x="592" y="197" class="label">Prediction</text>
  </g>
</svg>
