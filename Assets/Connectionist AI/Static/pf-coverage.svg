<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-labelledby="title desc">
  <title id="title">Coverage across ten forecasts</title>
  <desc id="desc">Eight of ten illustrative observed values lie inside their issued prediction intervals. Two observations lie outside, producing empirical coverage of eighty percent.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Coverage across ten forecasts</text>
  <text x="137" y="68" class="note">1</text>
  <path d="M220 64H492" class="violet-line" />
  <circle cx="310" cy="64" r="4" class="green" />
  <text x="137" y="85" class="note">2</text>
  <path d="M234 81H474" class="violet-line" />
  <circle cx="342" cy="81" r="4" class="green" />
  <text x="137" y="102" class="note">3</text>
  <path d="M248 98H492" class="violet-line" />
  <circle cx="374" cy="98" r="4" class="green" />
  <text x="137" y="119" class="note">4</text>
  <path d="M220 115H474" class="violet-line" />
  <circle cx="176" cy="115" r="4" class="amber" />
  <text x="137" y="136" class="note">5</text>
  <path d="M234 132H492" class="violet-line" />
  <circle cx="310" cy="132" r="4" class="green" />
  <text x="137" y="153" class="note">6</text>
  <path d="M248 149H474" class="violet-line" />
  <circle cx="342" cy="149" r="4" class="green" />
  <text x="137" y="170" class="note">7</text>
  <path d="M220 166H492" class="violet-line" />
  <circle cx="374" cy="166" r="4" class="green" />
  <text x="137" y="187" class="note">8</text>
  <path d="M234 183H474" class="violet-line" />
  <circle cx="406" cy="183" r="4" class="green" />
  <text x="137" y="204" class="note">9</text>
  <path d="M248 200H492" class="violet-line" />
  <circle cx="526" cy="200" r="4" class="amber" />
  <text x="137" y="221" class="note">10</text>
  <path d="M220 217H474" class="violet-line" />
  <circle cx="342" cy="217" r="4" class="green" />
  <text x="143" y="47" class="note">Case</text>
  <text x="357" y="256" class="note">8 / 10 inside = 80% coverage</text>
</svg>
