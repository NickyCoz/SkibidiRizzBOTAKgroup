<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img" aria-labelledby="title desc">
  <title id="title">Learning signals</title>
  <desc id="desc">Supervised learning uses example targets, unsupervised learning uses structure in inputs, and reinforcement learning obtains rewards after actions.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Learning signals</text>
  <text x="122" y="88" class="label">Supervised</text>
  <g class="tile">
    <rect x="246" y="64" width="208" height="38" rx="10" class="blue" />
    <text x="350" y="88" class="label ink">Examples + targets</text>
  </g>
  <path d="M460 83L508 83" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="515" y="64" width="160" height="38" rx="10" class="blue" />
    <text x="595" y="88" class="label ink">Prediction</text>
  </g>
  <text x="122" y="144" class="label">Unsupervised</text>
  <g class="tile">
    <rect x="246" y="120" width="208" height="38" rx="10" class="blue" />
    <text x="350" y="144" class="label ink">Inputs only</text>
  </g>
  <path d="M460 139L508 139" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="515" y="120" width="160" height="38" rx="10" class="violet" />
    <text x="595" y="144" class="label ink">Structure</text>
  </g>
  <text x="122" y="200" class="label">Reinforcement</text>
  <g class="tile">
    <rect x="246" y="176" width="208" height="38" rx="10" class="blue" />
    <text x="350" y="200" class="label ink">Interaction + rewards</text>
  </g>
  <path d="M460 195L508 195" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="515" y="176" width="160" height="38" rx="10" class="green" />
    <text x="595" y="200" class="label ink">Policy</text>
  </g>
</svg>
