<svg xmlns="http://www.w3.org/2000/svg" width="720" height="461" viewBox="0 0 720 461" role="img" aria-labelledby="title desc">
  <title id="title">Activation functions</title>
  <desc id="desc">Sigmoid approaches 0 and 1, tanh approaches −1 and 1, ReLU is flat for negative inputs, and leaky ReLU has slope 0.01 for negative inputs. Both ReLUs equal z for positive inputs.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
