<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264" role="img" aria-labelledby="title desc">
  <title id="title">Actor and critic</title>
  <desc id="desc">An actor chooses an action from the state. A critic evaluates the state or action and produces an advantage estimate that helps train the actor.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Actor and critic</text>
  <g class="tile">
    <rect x="32" y="106" width="124" height="38" rx="10" class="blue" />
    <text x="94" y="130" class="label ink">State</text>
  </g>
  <path d="M162 125L242 78" class="edge" marker-end="url(#arrow)" />
  <path d="M162 125L242 173" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="248" y="59" width="166" height="38" rx="10" class="violet" />
    <text x="331" y="83" class="label ink">Actor</text>
  </g>
  <g class="tile">
    <rect x="248" y="154" width="166" height="38" rx="10" class="blue" />
    <text x="331" y="178" class="label ink">Critic</text>
  </g>
  <path d="M420 78L498 78" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="504" y="59" width="171" height="38" rx="10" class="green" />
    <text x="589.5" y="83" class="label ink">Action</text>
  </g>
  <path d="M420 173L498 173" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="504" y="154" width="171" height="38" rx="10" class="amber" />
    <text x="589.5" y="178" class="label ink">Advantage</text>
  </g>
  <path d="M588 196V226H331V102" class="edge" marker-end="url(#arrow)" />
  <text x="533" y="246" class="note">Feedback to policy</text>
</svg>
