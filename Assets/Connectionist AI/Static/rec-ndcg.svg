<svg xmlns="http://www.w3.org/2000/svg" width="720" height="245" viewBox="0 0 720 245" role="img" aria-labelledby="title desc">
  <title id="title">Discounted relevance by rank</title>
  <desc id="desc">The chapter compares relevance patterns one,zero,one and one,one,zero. The first has DCG 1.5, the ideal has about 1.631, and their ratio is about 0.92.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Discounted relevance by rank</text>
  <text x="276" y="62" class="note">Rank 1</text>
  <text x="408" y="62" class="note">Rank 2</text>
  <text x="540" y="62" class="note">Rank 3</text>
  <text x="110" y="106" class="label">Shown</text>
  <g class="tile">
    <rect x="246" y="81" width="61" height="36" rx="4" class="green" />
    <text x="276" y="105" class="label ink">1</text>
  </g>
  <text x="276" y="135" class="note">× 1</text>
  <g class="tile">
    <rect x="378" y="81" width="61" height="36" rx="4" class="blue" />
    <text x="408" y="105" class="label ink">0</text>
  </g>
  <text x="408" y="135" class="note">× 0.631</text>
  <g class="tile">
    <rect x="510" y="81" width="61" height="36" rx="4" class="green" />
    <text x="540" y="105" class="label ink">1</text>
  </g>
  <text x="540" y="135" class="note">× 0.5</text>
  <text x="110" y="168" class="label">Ideal</text>
  <g class="tile">
    <rect x="246" y="143" width="61" height="36" rx="4" class="green" />
    <text x="276" y="167" class="label ink">1</text>
  </g>
  <text x="276" y="197" class="note">× 1</text>
  <g class="tile">
    <rect x="378" y="143" width="61" height="36" rx="4" class="green" />
    <text x="408" y="167" class="label ink">1</text>
  </g>
  <text x="408" y="197" class="note">× 0.631</text>
  <g class="tile">
    <rect x="510" y="143" width="61" height="36" rx="4" class="blue" />
    <text x="540" y="167" class="label ink">0</text>
  </g>
  <text x="540" y="197" class="note">× 0.5</text>
  <text x="360" y="232" class="note">DCG 1.5 / IDCG 1.631 ≈ NDCG 0.92</text>
</svg>
