<svg xmlns="http://www.w3.org/2000/svg" width="720" height="271" viewBox="0 0 720 271" role="img" aria-labelledby="title desc">
  <title id="title">Tanh around zero</title>
  <desc id="desc">Tanh is zero at zero. Equal-magnitude positive and negative inputs have equal-magnitude outputs with opposite signs.</desc>
