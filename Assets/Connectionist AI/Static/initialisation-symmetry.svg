<svg xmlns="http://www.w3.org/2000/svg" width="720" height="186" viewBox="0 0 720 186" role="img" aria-labelledby="title desc">
  <title id="title">Symmetry at initialisation</title>
  <desc id="desc">Two units starting with the same incoming weights and receiving the same updates remain identical. Different starting weights can let units learn different features.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Symmetry at initialisation</text>
  <text x="175" y="66" class="label">Identical incoming weights</text>
  <text x="543" y="66" class="label">Different incoming weights</text>
  <path d="M52 131L126 105" class="edge"/>
  <path d="M216 105L291 131" class="edge"/>
  <path d="M52 131L126 157" class="edge"/>
  <path d="M216 157L291 131" class="edge"/>
  <circle cx="52" cy="131" r="10" class="blue"/>
  <circle cx="291" cy="131" r="10" class="green"/>
  <g class="tile">
    <rect x="126" y="89" width="90" height="32" rx="8" class="violet"/>
    <text x="171" y="110" class="label">Same weights</text>
  </g>
  <g class="tile">
    <rect x="126" y="141" width="90" height="32" rx="8" class="violet"/>
    <text x="171" y="162" class="label">Same weights</text>
  </g>
  <path d="M421 131L493 105" class="edge"/>
  <path d="M582 105L658 131" class="edge"/>
  <path d="M421 131L493 157" class="edge"/>
  <path d="M582 157L658 131" class="edge"/>
  <circle cx="421" cy="131" r="10" class="blue"/>
  <circle cx="658" cy="131" r="10" class="green"/>
  <g class="tile">
    <rect x="493" y="89" width="89" height="32" rx="8" class="violet"/>
    <text x="537.5" y="110" class="label">Weights A</text>
  </g>
  <g class="tile">
    <rect x="493" y="141" width="89" height="32" rx="8" class="amber"/>
    <text x="537.5" y="162" class="label">Weights B</text>
  </g>
</svg>
