<svg xmlns="http://www.w3.org/2000/svg" width="720" height="177" viewBox="0 0 720 177" role="img" aria-labelledby="title desc">
  <title id="title">Anomaly threshold</title>
  <desc id="desc">Most examples in an illustrative reconstruction-error plot lie below the threshold. Points beyond the threshold are flagged for review. A flag is not a confirmed fault.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Anomaly threshold</text>
  <path d="M70 134H662" class="edge" marker-end="url(#arrow)"/>
  <path d="M510 58V144" class="guide"/>
  <text x="510" y="51" class="label">Chosen threshold</text>
  <circle cx="121" cy="122" r="6" class="blue"/>
  <circle cx="160" cy="105" r="6" class="blue"/>
  <circle cx="181" cy="123" r="6" class="blue"/>
  <circle cx="200" cy="91" r="6" class="blue"/>
  <circle cx="223" cy="110" r="6" class="blue"/>
  <circle cx="238" cy="124" r="6" class="blue"/>
  <circle cx="280" cy="101" r="6" class="blue"/>
  <circle cx="301" cy="122" r="6" class="blue"/>
  <circle cx="345" cy="109" r="6" class="blue"/>
  <circle cx="390" cy="121" r="6" class="blue"/>
  <circle cx="546" cy="112" r="6" class="amber"/>
  <circle cx="603" cy="95" r="6" class="amber"/>
  <circle cx="637" cy="119" r="6" class="amber"/>
  <text x="113" y="157" class="note">Lower error</text>
  <text x="601" y="157" class="note">Higher error</text>
</svg>
