<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img" aria-labelledby="title desc">
  <title id="title">Transfer learning with frozen layers</title>
  <desc id="desc">A pretrained feature extractor can be frozen while a new task head is trained. A later fine-tuning phase may unfreeze selected layers at a smaller learning rate.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Transfer learning with frozen layers</text>
  <g class="tile">
    <rect x="30" y="94" width="113" height="38" rx="10" class="blue" />
    <text x="86.5" y="118" class="label ink">Input</text>
  </g>
  <path d="M149 113L189 113" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="195" y="94" width="92" height="38" rx="10" class="blue" />
    <text x="241" y="118" class="label ink">Layer 1</text>
  </g>
  <g class="tile">
    <rect x="299" y="94" width="92" height="38" rx="10" class="blue" />
    <text x="345" y="118" class="label ink">Layer 2</text>
  </g>
  <g class="tile">
    <rect x="403" y="94" width="92" height="38" rx="10" class="blue" />
    <text x="449" y="118" class="label ink">Layer 3</text>
  </g>
  <path d="M497 113L535 113" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="541" y="94" width="152" height="38" rx="10" class="green" />
    <text x="617" y="118" class="label ink">New task head</text>
  </g>
  <path d="M195 145V161H495V145" class="edge" />
  <text x="345" y="187" class="note">Frozen pretrained weights</text>
  <text x="617" y="187" class="note">Trainable</text>
</svg>
