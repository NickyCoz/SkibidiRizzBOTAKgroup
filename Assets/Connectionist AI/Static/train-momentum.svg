<svg xmlns="http://www.w3.org/2000/svg" width="720" height="233" viewBox="0 0 720 233" role="img" aria-labelledby="title desc">
  <title id="title">Momentum with a constant gradient</title>
  <desc id="desc">With constant gradient one, beta 0.9 and learning rate 0.1, the three update sizes are 0.1,0.19,0.271. They grow as velocity accumulates.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Momentum with a constant gradient</text>
  <path d="M92 150L648 150" class="edge" marker-end="url(#arrow)" />
  <circle cx="130" cy="150" r="5" class="blue" />
  <path d="M130 120L190 120" class="edge" marker-end="url(#arrow)" />
  <text x="160" y="99" class="note">Step 1: 0.1</text>
  <circle cx="230" cy="150" r="5" class="blue" />
  <path d="M230 120L344 120" class="edge" marker-end="url(#arrow)" />
  <text x="287" y="99" class="note">Step 2: 0.19</text>
  <circle cx="420" cy="150" r="5" class="blue" />
  <path d="M420 120L582.6 120" class="edge" marker-end="url(#arrow)" />
  <text x="501.3" y="99" class="note">Step 3: 0.271</text>
  <text x="362" y="189" class="note">Velocity: 1 → 1.9 → 2.71</text>
</svg>
