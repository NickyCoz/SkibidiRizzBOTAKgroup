<svg xmlns="http://www.w3.org/2000/svg" width="720" height="251" viewBox="0 0 720 251" role="img" aria-labelledby="title desc">
  <title id="title">2 × 2 max pooling</title>
  <desc id="desc">Each disjoint two by two block contributes its largest value. A four by four input becomes a two by two output containing 6, 4, 7, and 6.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">2 × 2 max pooling</text>
  <text x="153" y="60" class="label">4 × 4 input</text>
  <text x="554" y="60" class="label">2 × 2 output</text>
  <g class="tile">
    <rect x="77" y="72" width="36" height="36" rx="4" class="blue"/>
    <text x="95" y="95" class="label">2</text>
  </g>
  <g class="tile">
    <rect x="116" y="72" width="36" height="36" rx="4" class="blue"/>
    <text x="134" y="95" class="label">6</text>
  </g>
  <g class="tile">
    <rect x="155" y="72" width="36" height="36" rx="4" class="violet"/>
    <text x="173" y="95" class="label">1</text>
  </g>
  <g class="tile">
    <rect x="194" y="72" width="36" height="36" rx="4" class="violet"/>
    <text x="212" y="95" class="label">4</text>
  </g>
  <g class="tile">
    <rect x="77" y="111" width="36" height="36" rx="4" class="blue"/>
    <text x="95" y="134" class="label">3</text>
  </g>
  <g class="tile">
    <rect x="116" y="111" width="36" height="36" rx="4" class="blue"/>
    <text x="134" y="134" class="label">1</text>
  </g>
  <g class="tile">
    <rect x="155" y="111" width="36" height="36" rx="4" class="violet"/>
    <text x="173" y="134" class="label">2</text>
  </g>
  <g class="tile">
    <rect x="194" y="111" width="36" height="36" rx="4" class="violet"/>
    <text x="212" y="134" class="label">0</text>
  </g>
  <g class="tile">
    <rect x="77" y="150" width="36" height="36" rx="4" class="green"/>
    <text x="95" y="173" class="label">4</text>
  </g>
  <g class="tile">
    <rect x="116" y="150" width="36" height="36" rx="4" class="green"/>
    <text x="134" y="173" class="label">7</text>
  </g>
  <g class="tile">
    <rect x="155" y="150" width="36" height="36" rx="4" class="amber"/>
    <text x="173" y="173" class="label">3</text>
  </g>
  <g class="tile">
    <rect x="194" y="150" width="36" height="36" rx="4" class="amber"/>
    <text x="212" y="173" class="label">5</text>
  </g>
  <g class="tile">
    <rect x="77" y="189" width="36" height="36" rx="4" class="green"/>
    <text x="95" y="212" class="label">0</text>
  </g>
  <g class="tile">
    <rect x="116" y="189" width="36" height="36" rx="4" class="green"/>
    <text x="134" y="212" class="label">2</text>
  </g>
  <g class="tile">
    <rect x="155" y="189" width="36" height="36" rx="4" class="amber"/>
    <text x="173" y="212" class="label">6</text>
  </g>
  <g class="tile">
    <rect x="194" y="189" width="36" height="36" rx="4" class="amber"/>
    <text x="212" y="212" class="label">1</text>
  </g>
  <path d="M263 140L473 140" class="edge" marker-end="url(#arrow)"/>
  <text x="367" y="125" class="note">Maximum per block</text>
  <g class="tile">
    <rect x="515" y="105" width="37" height="37" rx="4" class="blue"/>
    <text x="533.5" y="128.5" class="label">6</text>
  </g>
  <g class="tile">
    <rect x="555" y="105" width="37" height="37" rx="4" class="violet"/>
    <text x="573.5" y="128.5" class="label">4</text>
  </g>
  <g class="tile">
    <rect x="515" y="145" width="37" height="37" rx="4" class="green"/>
    <text x="533.5" y="168.5" class="label">7</text>
  </g>
  <g class="tile">
    <rect x="555" y="145" width="37" height="37" rx="4" class="amber"/>
    <text x="573.5" y="168.5" class="label">6</text>
  </g>
  <text x="360" y="237" class="note">Window 2 × 2 · stride 2</text>
</svg>
