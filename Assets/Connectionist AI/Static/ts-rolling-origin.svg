<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Rolling-origin validation</title>
  <desc id="desc">Three folds have expanding training histories and immediately following held-out blocks. Test blocks never precede their training history.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Rolling-origin validation</text>
  <text x="72" y="91" class="label">Fold 1</text>
  <g class="tile">
    <rect x="130" y="67" width="278" height="38" rx="10" class="blue" />
    <text x="269" y="91" class="label ink">Train 1–100</text>
  </g>
  <g class="tile">
    <rect x="413" y="67" width="141" height="38" rx="10" class="green" />
    <text x="483.5" y="91" class="label ink">Test 101–114</text>
  </g>
  <text x="72" y="144" class="label">Fold 2</text>
  <g class="tile">
    <rect x="130" y="120" width="358" height="38" rx="10" class="blue" />
    <text x="309" y="144" class="label ink">Train 1–114</text>
  </g>
  <g class="tile">
    <rect x="493" y="120" width="141" height="38" rx="10" class="green" />
    <text x="563.5" y="144" class="label ink">Test 115–128</text>
  </g>
  <text x="72" y="197" class="label">Fold 3</text>
  <g class="tile">
    <rect x="130" y="173" width="438" height="38" rx="10" class="blue" />
    <text x="349" y="197" class="label ink">Train 1–128</text>
  </g>
  <g class="tile">
    <rect x="573" y="173" width="141" height="38" rx="10" class="green" />
    <text x="643.5" y="197" class="label ink">Test 129–142</text>
  </g>
  <text x="398" y="230" class="note">Time →</text>
</svg>
