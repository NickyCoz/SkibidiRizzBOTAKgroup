<svg xmlns="http://www.w3.org/2000/svg" width="720" height="183" viewBox="0 0 720 183" role="img" aria-labelledby="title desc">
  <title id="title">Chronological data split</title>
  <desc id="desc">Earlier observations are used for training, followed by a validation period and a final test period. Fitting preprocessing uses the training portion only.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Chronological data split</text>
  <g class="tile">
    <rect x="39" y="66" width="341" height="38" rx="10" class="blue" />
    <text x="209.5" y="90" class="label ink">Training period</text>
  </g>
  <g class="tile">
    <rect x="385" y="66" width="151" height="38" rx="10" class="violet" />
    <text x="460.5" y="90" class="label ink">Validation</text>
  </g>
  <g class="tile">
    <rect x="541" y="66" width="140" height="38" rx="10" class="green" />
    <text x="611" y="90" class="label ink">Test</text>
  </g>
  <path d="M40 132L680 132" class="edge" marker-end="url(#arrow)" />
  <text x="68" y="156" class="note">Past</text>
  <text x="648" y="156" class="note">Latest</text>
  <text x="211" y="60" class="note">Fit scaler here</text>
</svg>
