<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval, ranking, and re-ranking</title>
  <desc id="desc">The catalogue is narrowed from millions of items to hundreds of candidates, then tens of ranked items, then a final list. Successive stages prioritize speed, relevance, and constraints.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Retrieval, ranking, and re-ranking</text>
  <g class="tile">
    <rect x="65" y="75" width="150" height="99" rx="8" class="blue" />
    <text x="140" y="117" class="label ink">Millions of items</text>
    <text x="140" y="145" class="note ink">Catalogue</text>
  </g>
  <g class="tile">
    <rect x="247" y="75" width="117" height="99" rx="8" class="violet" />
    <text x="305.5" y="117" class="label ink">Hundreds</text>
    <text x="305.5" y="145" class="note ink">Candidates</text>
  </g>
  <g class="tile">
    <rect x="440" y="75" width="99" height="99" rx="8" class="green" />
    <text x="489.5" y="117" class="label ink">Tens</text>
    <text x="489.5" y="145" class="note ink">Ranked</text>
  </g>
  <g class="tile">
    <rect x="584" y="75" width="86" height="99" rx="8" class="amber" />
    <text x="627" y="117" class="label ink">Final list</text>
    <text x="627" y="145" class="note ink">Shown</text>
  </g>
  <path d="M218 125L242 125" class="edge" marker-end="url(#arrow)" />
  <path d="M368 125L435 125" class="edge" marker-end="url(#arrow)" />
  <path d="M542 125L579 125" class="edge" marker-end="url(#arrow)" />
  <text x="246" y="212" class="note">Retrieve</text>
  <text x="420" y="212" class="note">Rank</text>
  <text x="572" y="212" class="note">Re-rank</text>
  <text x="246" y="242" class="note">Fast similarity</text>
  <text x="420" y="242" class="note">Rich features</text>
  <text x="572" y="242" class="note">Diversity + rules</text>
</svg>
