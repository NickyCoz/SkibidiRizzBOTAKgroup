<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-labelledby="title desc">
  <title id="title">XOR input space</title>
  <desc id="desc">The 0s are at (0,0) and (1,1). The 1s are at (0,1) and (1,0). The two segments joining equal-output pairs intersect.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="360" y="34" class="heading">XOR input space</text>
  <g transform="translate(132 0)">
  <path d="M118 219 L340 219" class="arrow" marker-end="url(#arrow)"/>
  <path d="M118 219 L118 60" class="arrow" marker-end="url(#arrow)"/>
  <text x="350" y="224" class="label">x₁</text>
  <text x="118" y="54" class="label">x₂</text>
  <g class="on-tile">
  <circle cx="143" cy="194" r="15" class="tile"/>
  <text x="143" y="199" class="label">0</text>
  </g>
  <g class="on-tile">
  <circle cx="292" cy="194" r="15" class="green"/>
  <text x="292" y="199" class="label">1</text>
  </g>
  <g class="on-tile">
  <circle cx="143" cy="82" r="15" class="green"/>
  <text x="143" y="87" class="label">1</text>
  </g>
  <g class="on-tile">
  <circle cx="292" cy="82" r="15" class="tile"/>
  <text x="292" y="87" class="label">0</text>
  </g>
  <text x="143" y="242" class="small">0</text>
  <text x="292" y="242" class="small">1</text>
  <text x="98" y="199" class="small">0</text>
  <text x="98" y="87" class="small">1</text>
  <path d="M143 194 L292 82 M143 82 L292 194" class="grid"/>
  </g>
</svg>
