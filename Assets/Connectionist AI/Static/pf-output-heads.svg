<svg xmlns="http://www.w3.org/2000/svg" width="720" height="245" viewBox="0 0 720 245" role="img" aria-labelledby="title desc">
  <title id="title">Probabilistic network outputs</title>
  <desc id="desc">Shared neural features can branch into a mean and a positive standard deviation for a Gaussian forecast, or into separate quantile predictions.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Probabilistic network outputs</text>
  <text x="166" y="63" class="label">Distribution parameters</text>
  <text x="550" y="63" class="label">Direct quantiles</text>
  <g class="tile">
    <rect x="50" y="119" width="123" height="38" rx="10" class="blue" />
    <text x="111.5" y="143" class="label ink">Features</text>
  </g>
  <path d="M179 138L220 96" class="edge" marker-end="url(#arrow)" />
  <path d="M179 138L220 172" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="225" y="77" width="103" height="38" rx="10" class="violet" />
    <text x="276.5" y="101" class="label ink">Mean μ</text>
  </g>
  <g class="tile">
    <rect x="225" y="153" width="103" height="38" rx="10" class="green" />
    <text x="276.5" y="177" class="label ink">σ &gt; 0</text>
  </g>
  <text x="278" y="215" class="note">Softplus on σ head</text>
  <g class="tile">
    <rect x="400" y="119" width="123" height="38" rx="10" class="blue" />
    <text x="461.5" y="143" class="label ink">Features</text>
  </g>
  <path d="M528 138L576 102" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="582" y="83" width="103" height="38" rx="10" class="blue" />
    <text x="633.5" y="107" class="label ink">P10</text>
  </g>
  <path d="M528 138L576 154" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="582" y="135" width="103" height="38" rx="10" class="violet" />
    <text x="633.5" y="159" class="label ink">P50</text>
  </g>
  <path d="M528 138L576 206" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="582" y="187" width="103" height="38" rx="10" class="green" />
    <text x="633.5" y="211" class="label ink">P90</text>
  </g>
</svg>
