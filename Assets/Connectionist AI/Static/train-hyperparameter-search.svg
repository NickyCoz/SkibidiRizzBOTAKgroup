<svg xmlns="http://www.w3.org/2000/svg" width="720" height="251" viewBox="0 0 720 251" role="img" aria-labelledby="title desc">
  <title id="title">Grid and random search</title>
  <desc id="desc">Grid search tests a regular set of combinations. Random search spreads a similar number of trials over distinct settings, with learning rate and decay represented on log scales.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Grid and random search</text>
  <text x="188" y="62" class="label">Grid search</text>
  <path d="M75 192L305 192" class="edge" marker-end="url(#arrow)" />
  <path d="M75 192L75 78" class="edge" marker-end="url(#arrow)" />
  <text x="189" y="218" class="note">Log learning rate</text>
  <text x="535" y="62" class="label">Random search</text>
  <path d="M422 192L652 192" class="edge" marker-end="url(#arrow)" />
  <path d="M422 192L422 78" class="edge" marker-end="url(#arrow)" />
