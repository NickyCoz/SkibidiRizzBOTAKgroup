<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="title desc">
  <title id="title">AND decision boundary</title>
  <desc id="desc">The line x one plus x two equals 1.5 separates (1,1) from the three inputs whose AND output is zero.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">AND decision boundary</text>
  <path d="M242 203L494 203" class="edge" marker-end="url(#arrow)"/>
  <path d="M242 203L242 55" class="edge" marker-end="url(#arrow)"/>
  <path d="M319 60L487 169.5" class="violet-line"/>
  <g class="tile">
    <circle cx="269" cy="176" r="13" class="blue"/>
    <text x="269" y="181" class="label">0</text>
  </g>
  <g class="tile">
    <circle cx="421" cy="176" r="13" class="blue"/>
    <text x="421" y="181" class="label">0</text>
  </g>
  <g class="tile">
    <circle cx="269" cy="77" r="13" class="blue"/>
    <text x="269" y="82" class="label">0</text>
  </g>
  <g class="tile">
    <circle cx="421" cy="77" r="13" class="green"/>
    <text x="421" y="82" class="label">1</text>
  </g>
  <text x="269" y="223" class="note">0</text>
  <text x="421" y="223" class="note">1</text>
  <text x="224" y="182" class="note">0</text>
  <text x="224" y="82" class="note">1</text>
  <text x="504" y="209" class="label">x₁</text>
  <text x="243" y="52" class="label">x₂</text>
  <text x="484" y="116" class="note">x₁ + x₂ = 1.5</text>
</svg>
