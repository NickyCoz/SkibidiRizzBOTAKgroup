<svg xmlns="http://www.w3.org/2000/svg" width="720" height="257" viewBox="0 0 720 257" role="img" aria-labelledby="title desc">
  <title id="title">Gaussian interval widths</title>
  <desc id="desc">All intervals are centered on one hundred with standard deviation ten. The sixty-eight, eighty, ninety and ninety-five percent intervals use progressively wider bounds.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Gaussian interval widths</text>
  <text x="72" y="84" class="label">68%</text>
  <path d="M280 80H480" class="violet-line" />
  <path d="M280 74V86M480 74V86" class="edge" />
  <text x="248" y="84" class="note">90</text>
  <text x="512" y="84" class="note">110</text>
  <text x="72" y="127" class="label">80%</text>
  <path d="M252.00000000000003 123H508" class="blue-line" />
  <path d="M252.00000000000003 117V129M508 117V129" class="edge" />
  <text x="220.00000000000003" y="127" class="note">87.2</text>
  <text x="540" y="127" class="note">112.8</text>
  <text x="72" y="170" class="label">90%</text>
  <path d="M215.49999999999997 166H544.5" class="violet-line" />
  <path d="M215.49999999999997 160V172M544.5 160V172" class="edge" />
  <text x="183.49999999999997" y="170" class="note">83.55</text>
  <text x="576.5" y="170" class="note">116.45</text>
  <text x="72" y="213" class="label">95%</text>
  <path d="M184.00000000000006 209H576" class="blue-line" />
  <path d="M184.00000000000006 203V215M576 203V215" class="edge" />
  <text x="152.00000000000006" y="213" class="note">80.4</text>
  <text x="608" y="213" class="note">119.6</text>
  <path d="M380 57V224" class="guide" />
  <text x="380" y="245" class="note">Mean = 100 · standard deviation = 10</text>
</svg>
