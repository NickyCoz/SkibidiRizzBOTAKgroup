<svg xmlns="http://www.w3.org/2000/svg" width="720" height="177" viewBox="0 0 720 177" role="img" aria-labelledby="title desc">
  <title id="title">Text classification</title>
  <desc id="desc">A short sentence is split into tokens. The model produces one sentiment score for the whole sentence.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Text classification</text>
  <g class="tile">
    <rect x="54" y="65" width="67" height="36" rx="12" class="blue"/>
    <text x="87.5" y="88" class="label">The</text>
  </g>
  <g class="tile">
    <rect x="129" y="65" width="67" height="36" rx="12" class="blue"/>
    <text x="162.5" y="88" class="label">film</text>
  </g>
  <g class="tile">
    <rect x="204" y="65" width="67" height="36" rx="12" class="blue"/>
    <text x="237.5" y="88" class="label">was</text>
  </g>
  <g class="tile">
    <rect x="279" y="65" width="67" height="36" rx="12" class="blue"/>
    <text x="312.5" y="88" class="label">great</text>
  </g>
  <path d="M353 83L400 83" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="407" y="65" width="109" height="36" rx="12" class="violet"/>
    <text x="461.5" y="88" class="label">Text model</text>
  </g>
  <path d="M523 83L561 83" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="568" y="65" width="128" height="36" rx="12" class="green"/>
    <text x="632" y="88" class="label">Positive</text>
  </g>
  <text x="200" y="134" class="label">Input tokens</text>
  <text x="632" y="134" class="label">Sentence label</text>
</svg>
