<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="title desc">
  <title id="title">Training diagnostics</title>
  <desc id="desc">If a model cannot overfit a tiny training batch, inspect the implementation and data. If it can, compare full training and validation behavior to investigate underfitting, overfitting, or data mismatch.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Training diagnostics</text>
  <g class="tile">
    <rect x="198" y="61" width="322" height="38" rx="10" class="violet" />
    <text x="359" y="85" class="label ink">Can the model fit one tiny batch?</text>
  </g>
  <path d="M260 105L157 151" class="edge" marker-end="url(#arrow)" />
  <path d="M459 105L561 151" class="edge" marker-end="url(#arrow)" />
  <text x="201" y="129" class="note">No</text>
  <text x="516" y="129" class="note">Yes</text>
  <g class="tile">
    <rect x="31" y="157" width="254" height="38" rx="10" class="amber" />
    <text x="158" y="181" class="label ink">Inspect labels, shapes, gradients</text>
  </g>
  <g class="tile">
    <rect x="430" y="157" width="258" height="38" rx="10" class="green" />
    <text x="559" y="181" class="label ink">Compare train / validation loss</text>
  </g>
  <text x="158" y="223" class="note">Data and implementation checks</text>
  <text x="559" y="223" class="note">Fit and generalisation checks</text>
</svg>
