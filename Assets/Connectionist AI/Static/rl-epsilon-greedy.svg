<svg xmlns="http://www.w3.org/2000/svg" width="720" height="227" viewBox="0 0 720 227" role="img" aria-labelledby="title desc">
  <title id="title">ε-greedy action selection</title>
  <desc id="desc">With epsilon 0.2, eighty percent of decisions use a current best action and twenty percent choose randomly from all actions. The random branch may also select a best action.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">ε-greedy action selection</text>
  <g class="tile">
    <rect x="30" y="92" width="145" height="38" rx="10" class="blue" />
    <text x="102.5" y="116" class="label ink">Decision</text>
  </g>
  <path d="M181 111L273 75" class="edge" marker-end="url(#arrow)" />
  <path d="M181 111L273 166" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="279" y="56" width="181" height="38" rx="10" class="blue" />
    <text x="369.5" y="80" class="label ink">Greedy branch</text>
  </g>
  <g class="tile">
    <rect x="279" y="147" width="181" height="38" rx="10" class="violet" />
    <text x="369.5" y="171" class="label ink">Random branch</text>
  </g>
  <text x="227" y="61" class="note">80%</text>
  <text x="227" y="186" class="note">20%</text>
  <path d="M466 75L515 75" class="edge" marker-end="url(#arrow)" />
  <path d="M466 166L515 166" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="521" y="56" width="168" height="38" rx="10" class="green" />
    <text x="605" y="80" class="label ink">Current best action</text>
  </g>
  <g class="tile">
    <rect x="521" y="147" width="168" height="38" rx="10" class="amber" />
    <text x="605" y="171" class="label ink">Any action</text>
  </g>
</svg>
