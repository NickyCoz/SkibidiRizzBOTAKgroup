<svg xmlns="http://www.w3.org/2000/svg" width="720" height="294" viewBox="0 0 720 294" role="img" aria-labelledby="title desc">
  <title id="title">GELU and SiLU near zero</title>
  <desc id="desc">A close-up shows GELU and SiLU outputting small negative values on the negative side. Their curves dip and then turn upward near zero.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
