<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" role="img" aria-labelledby="title desc">
  <title id="title">Reward design and unintended behavior</title>
  <desc id="desc">A schematic route offers repeated bonus points on a loop while the finish is elsewhere. Optimizing bonus reward alone can favor circling over finishing.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Reward design and unintended behavior</text>
  <rect x="71" y="74" width="451" height="106" rx="23" class="blue" />
  <path d="M136 126H455" class="guide" />
  <g class="tile">
    <rect x="555" y="105" width="132" height="38" rx="10" class="green" />
    <text x="621" y="129" class="label ink">Finish</text>
  </g>
  <path d="M501 127H548" class="edge" marker-end="url(#arrow)" />
  <path d="M122 127C122 61 285 61 285 127C285 180 122 180 122 127" class="violet-line" />
  <circle cx="204" cy="84" r="7" class="amber" />
  <text x="205" y="60" class="note">Repeat bonus</text>
  <text x="293" y="213" class="note">Looping route</text>
</svg>
