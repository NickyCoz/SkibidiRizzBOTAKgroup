<svg xmlns="http://www.w3.org/2000/svg" width="720" height="233" viewBox="0 0 720 233" role="img" aria-labelledby="title desc">
  <title id="title">Q-value update toward the target</title>
  <desc id="desc">With old Q zero, target 2.8 and learning rate 0.5, one Q-learning update moves halfway to the target, to 1.4.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Q-value update toward the target</text>
  <path d="M86 154L653 154" class="edge" marker-end="url(#arrow)" />
  <circle cx="108" cy="154" r="6" class="blue" />
  <text x="108" y="181" class="note">0</text>
  <text x="108" y="209" class="note">Old Q</text>
  <circle cx="360" cy="154" r="6" class="violet" />
  <text x="360" y="181" class="note">1.4</text>
  <text x="360" y="209" class="note">New Q</text>
  <circle cx="612" cy="154" r="6" class="green" />
  <text x="612" y="181" class="note">2.8</text>
  <text x="612" y="209" class="note">Target</text>
  <path d="M115 127Q238 64 352 127" class="edge" marker-end="url(#arrow)" />
  <text x="233" y="86" class="note">α = 0.5</text>
</svg>
