<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="title desc">
  <title id="title">Absolute and squared error</title>
  <desc id="desc">For errors one, two and three units from zero, absolute error is one, two and three while squared error is one, four and nine.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Absolute and squared error</text>
  <path d="M97 185L602 185" class="edge" marker-end="url(#arrow)"/>
  <path d="M97 185L97 51" class="edge" marker-end="url(#arrow)"/>
  <text x="67" y="62" class="note">Loss</text>
  <text x="98" y="207" class="note">0</text>
  <text x="243" y="207" class="note">1</text>
  <text x="388" y="207" class="note">2</text>
  <text x="533" y="207" class="note">3</text>
  <path d="M98 185L533 143" class="blue-line"/>
  <path d="M98 185Q315.5 185 533 59" class="violet-line"/>
  <text x="613" y="64" class="label">Squared error</text>
  <text x="613" y="147" class="label">Absolute error</text>
  <text x="360" y="235" class="note">Absolute prediction error</text>
</svg>
