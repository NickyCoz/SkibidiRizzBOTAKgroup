<svg xmlns="http://www.w3.org/2000/svg" width="720" height="261" viewBox="0 0 720 261" role="img" aria-labelledby="title desc">
  <title id="title">P90 pinball loss</title>
  <desc id="desc">For a fixed true value of one hundred, predicting ninety costs nine while predicting one hundred ten costs one. The underprediction branch is nine times as steep as the overprediction branch.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">P90 pinball loss</text>
  <path d="M94 198H625" class="guide" />
  <text x="72" y="202" class="note">0</text>
  <path d="M94 164.75H625" class="guide" />
  <text x="72" y="168.75" class="note">5</text>
  <path d="M94 131.5H625" class="guide" />
  <text x="72" y="135.5" class="note">10</text>
  <path d="M94 98.25H625" class="guide" />
  <text x="72" y="102.25" class="note">15</text>
  <path d="M94 65H625" class="guide" />
  <text x="72" y="69" class="note">20</text>
  <text x="94" y="217" class="note">80</text>
  <text x="226.75" y="217" class="note">90</text>
  <text x="359.5" y="217" class="note">100</text>
  <text x="492.25" y="217" class="note">110</text>
  <text x="625" y="217" class="note">120</text>
  <path d="M94 198L634 198" class="edge" marker-end="url(#arrow)" />
  <path d="M94 198L94 57" class="edge" marker-end="url(#arrow)" />
  <text x="359.5" y="237" class="note">Predicted P90 · true value = 100</text>
  <text x="84" y="48" class="note">Pinball loss</text>
  <path d="M94 78.3 L359.5 198 L625 184.7" class="violet-line" />
  <circle cx="226.75" cy="138.15" r="5" class="green" />
  <text x="256.75" y="126.15" class="note">Loss 9</text>
  <circle cx="492.25" cy="191.35" r="5" class="green" />
  <text x="522.25" y="179.35" class="note">Loss 1</text>
</svg>
