<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img" aria-labelledby="title desc">
  <title id="title">Self-attention weights</title>
  <desc id="desc">For the token it, example attention weights for the robot, moved, and it are 0.7, 0.2, and 0.1. The three value vectors are mixed in those proportions.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Self-attention weights</text>
  <g class="tile">
    <rect x="84" y="53" width="130" height="38" rx="19" class="blue"/>
    <text x="149" y="77" class="label">robot</text>
  </g>
  <path d="M149 91 Q149 145 360 176" fill="none" stroke="#8b70cb" stroke-width="7" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="126" y="108" width="46" height="23" rx="10" class="violet"/>
    <text x="149" y="124" class="note">0.70</text>
  </g>
  <g class="tile">
    <rect x="295" y="53" width="130" height="38" rx="19" class="blue"/>
    <text x="360" y="77" class="label">moved</text>
  </g>
  <path d="M360 91 Q360 145 360 176" fill="none" stroke="#8b70cb" stroke-width="3" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="337" y="108" width="46" height="23" rx="10" class="violet"/>
    <text x="360" y="124" class="note">0.20</text>
  </g>
  <g class="tile">
    <rect x="506" y="53" width="130" height="38" rx="19" class="blue"/>
    <text x="571" y="77" class="label">it</text>
  </g>
  <path d="M571 91 Q571 145 360 176" fill="none" stroke="#8b70cb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="548" y="108" width="46" height="23" rx="10" class="violet"/>
    <text x="571" y="124" class="note">0.10</text>
  </g>
  <g class="tile">
    <rect x="244" y="178" width="232" height="38" rx="19" class="green"/>
    <text x="360" y="202" class="label">Updated representation of “it”</text>
  </g>
</svg>
