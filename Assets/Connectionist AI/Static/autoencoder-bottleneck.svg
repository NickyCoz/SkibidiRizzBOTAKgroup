<svg xmlns="http://www.w3.org/2000/svg" width="720" height="235" viewBox="0 0 720 235" role="img" aria-labelledby="title desc">
  <title id="title">Autoencoder bottleneck</title>
  <desc id="desc">An encoder turns an input image into a smaller vector. The decoder uses that vector to reconstruct the image. Training compares the reconstruction with the original.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Autoencoder bottleneck</text>
  <text x="123" y="66" class="label">Original</text>
  <text x="360" y="66" class="label">Smaller latent code</text>
  <text x="594" y="66" class="label">Reconstruction</text>
  <rect x="86" y="84" width="17" height="17" rx="2" class="blue"/>
  <rect x="105" y="84" width="17" height="17" rx="2" class="violet"/>
  <rect x="124" y="84" width="17" height="17" rx="2" class="violet"/>
  <rect x="143" y="84" width="17" height="17" rx="2" class="blue"/>
  <rect x="86" y="103" width="17" height="17" rx="2" class="violet"/>
  <rect x="105" y="103" width="17" height="17" rx="2" class="blue"/>
  <rect x="124" y="103" width="17" height="17" rx="2" class="blue"/>
  <rect x="143" y="103" width="17" height="17" rx="2" class="violet"/>
  <rect x="86" y="122" width="17" height="17" rx="2" class="violet"/>
  <rect x="105" y="122" width="17" height="17" rx="2" class="blue"/>
  <rect x="124" y="122" width="17" height="17" rx="2" class="blue"/>
  <rect x="143" y="122" width="17" height="17" rx="2" class="violet"/>
  <rect x="86" y="141" width="17" height="17" rx="2" class="blue"/>
  <rect x="105" y="141" width="17" height="17" rx="2" class="violet"/>
  <rect x="124" y="141" width="17" height="17" rx="2" class="violet"/>
  <rect x="143" y="141" width="17" height="17" rx="2" class="blue"/>
  <rect x="557" y="84" width="17" height="17" rx="2" class="green"/>
  <rect x="576" y="84" width="17" height="17" rx="2" class="violet"/>
  <rect x="595" y="84" width="17" height="17" rx="2" class="violet"/>
