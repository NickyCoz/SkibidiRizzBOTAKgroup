<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img" aria-labelledby="title desc">
  <title id="title">Graph neural network message passing</title>
  <desc id="desc">Three neighboring nodes send information to a central node. Its updated representation aggregates those messages with its own features.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Graph neural network message passing</text>
  <path d="M160 73L315 126" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <circle cx="142" cy="73" r="17" class="blue"/>
    <text x="142" y="78" class="label">A</text>
  </g>
  <path d="M110 139L315 126" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <circle cx="92" cy="139" r="17" class="blue"/>
    <text x="92" y="144" class="label">B</text>
  </g>
  <path d="M182 188L315 126" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <circle cx="164" cy="188" r="17" class="blue"/>
    <text x="164" y="193" class="label">C</text>
  </g>
  <g class="tile">
    <circle cx="337" cy="126" r="20" class="violet"/>
    <text x="337" y="131" class="label">D</text>
  </g>
  <path d="M363 126L453 126" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="459" y="108" width="193" height="36" rx="12" class="green"/>
    <text x="555.5" y="131" class="label">Updated node D</text>
  </g>
  <text x="401" y="109" class="note">Aggregate</text>
  <text x="338" y="199" class="note">Incoming messages + node D’s own features</text>
</svg>
