<svg xmlns="http://www.w3.org/2000/svg" width="720" height="207" viewBox="0 0 720 207" role="img" aria-labelledby="title desc">
  <title id="title">Sales and unobserved demand</title>
  <desc id="desc">On an illustrative stock-out day, observed sales stop at eight available units. Additional desired purchases are unobserved, so sales alone cannot reveal total demand.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Sales and unobserved demand</text>
  <text x="166" y="63" class="label">Stock available</text>
  <text x="519" y="63" class="label">Observed purchases</text>
  <rect x="66" y="82" width="32" height="28" rx="3" class="blue" />
  <rect x="109" y="82" width="32" height="28" rx="3" class="blue" />
  <rect x="152" y="82" width="32" height="28" rx="3" class="blue" />
  <rect x="195" y="82" width="32" height="28" rx="3" class="blue" />
  <rect x="66" y="121" width="32" height="28" rx="3" class="blue" />
  <rect x="109" y="121" width="32" height="28" rx="3" class="blue" />
  <rect x="152" y="121" width="32" height="28" rx="3" class="blue" />
  <rect x="195" y="121" width="32" height="28" rx="3" class="blue" />
  <path d="M259 119L381 119" class="edge" marker-end="url(#arrow)" />
  <rect x="412" y="82" width="32" height="28" rx="3" class="green" />
  <rect x="455" y="82" width="32" height="28" rx="3" class="green" />
  <rect x="498" y="82" width="32" height="28" rx="3" class="green" />
  <rect x="541" y="82" width="32" height="28" rx="3" class="green" />
  <rect x="412" y="121" width="32" height="28" rx="3" class="green" />
  <rect x="455" y="121" width="32" height="28" rx="3" class="green" />
  <rect x="498" y="121" width="32" height="28" rx="3" class="green" />
  <rect x="541" y="121" width="32" height="28" rx="3" class="green" />
  <path d="M599 80V153H689V80Z" class="guide" />
  <text x="645" y="108" class="num">?</text>
  <text x="645" y="132" class="note">Unfilled</text>
  <text x="164" y="184" class="label">8 units</text>
  <text x="498" y="184" class="label">8 sold</text>
</svg>
