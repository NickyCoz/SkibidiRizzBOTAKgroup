<svg xmlns="http://www.w3.org/2000/svg" width="720" height="233" viewBox="0 0 720 233" role="img" aria-labelledby="title desc">
  <title id="title">Embedding dimensions and a score</title>
  <desc id="desc">The chapter gives user vector one,two and item vector three,one. The first latent dimension contributes three, and the second contributes two, so the dot-product score is five.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Embedding dimensions and a score</text>
  <text x="173" y="62" class="label">User embedding</text>
  <text x="550" y="62" class="label">Item embedding</text>
  <g class="tile">
    <rect x="122" y="78" width="41" height="41" rx="4" class="blue" />
    <text x="142.5" y="103.5" class="label ink">1</text>
  </g>
  <g class="tile">
    <rect x="176" y="78" width="41" height="41" rx="4" class="violet" />
    <text x="196.5" y="103.5" class="label ink">2</text>
  </g>
  <g class="tile">
    <rect x="500" y="78" width="41" height="41" rx="4" class="blue" />
    <text x="520.5" y="103.5" class="label ink">3</text>
  </g>
  <g class="tile">
    <rect x="554" y="78" width="41" height="41" rx="4" class="violet" />
    <text x="574.5" y="103.5" class="label ink">1</text>
  </g>
  <path d="M142 123L299 167" class="edge" marker-end="url(#arrow)" />
  <path d="M520 123L339 167" class="edge" marker-end="url(#arrow)" />
  <path d="M195 123L396 167" class="edge" marker-end="url(#arrow)" />
  <path d="M574 123L436 167" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="276" y="169" width="87" height="38" rx="10" class="blue" />
    <text x="319.5" y="193" class="label ink">3</text>
  </g>
  <text x="382" y="193" class="num">+</text>
  <g class="tile">
    <rect x="395" y="169" width="87" height="38" rx="10" class="violet" />
    <text x="438.5" y="193" class="label ink">2</text>
  </g>
  <text x="551" y="193" class="num">= 5</text>
</svg>
