<svg xmlns="http://www.w3.org/2000/svg" width="720" height="177" viewBox="0 0 720 177" role="img" aria-labelledby="title desc">
  <title id="title">Training, validation, and test sets</title>
  <desc id="desc">Training fits weights, validation guides model selection, and the held-out test set evaluates the selected model.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>
  <text x="360" y="34" class="heading">Training, validation, and test sets</text>
  <g class="on-tile">
  <rect x="24" y="65" width="212" height="96" rx="8" class="tile"/>
  <text x="130" y="95" class="label">Training set</text>
  <text x="130" y="122" class="small">Fit model weights</text>
  <text x="130" y="142" class="small">on these examples.</text>
  </g>
  <g class="on-tile">
  <rect x="254" y="65" width="212" height="96" rx="8" class="violet"/>
  <text x="360" y="95" class="label">Validation set</text>
  <text x="360" y="122" class="small">Choose settings and</text>
  <text x="360" y="142" class="small">compare candidates.</text>
  </g>
  <g class="on-tile">
  <rect x="484" y="65" width="212" height="96" rx="8" class="green"/>
  <text x="590" y="95" class="label">Test set</text>
  <text x="590" y="122" class="small">Evaluate the chosen model</text>
  <text x="590" y="142" class="small">on held-out examples.</text>
  </g>
</svg>
