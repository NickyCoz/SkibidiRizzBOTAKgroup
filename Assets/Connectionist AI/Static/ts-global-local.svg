<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-labelledby="title desc">
  <title id="title">Local and global forecasting models</title>
  <desc id="desc">Local forecasting gives each series its own model. A global model learns from several related series and receives series identity as an input.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Local and global forecasting models</text>
  <text x="178" y="62" class="label">Local</text>
  <text x="545" y="62" class="label">Global</text>
  <g class="tile">
    <rect x="26" y="81" width="93" height="38" rx="10" class="blue" />
    <text x="72.5" y="105" class="label ink">Series 1</text>
  </g>
  <path d="M124 100L164 100" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="170" y="81" width="149" height="38" rx="10" class="violet" />
    <text x="244.5" y="105" class="label ink">Model 1</text>
  </g>
  <g class="tile">
    <rect x="391" y="81" width="93" height="38" rx="10" class="blue" />
    <text x="437.5" y="105" class="label ink">Series 1</text>
  </g>
  <path d="M489 100L540 154" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="26" y="135" width="93" height="38" rx="10" class="blue" />
    <text x="72.5" y="159" class="label ink">Series 2</text>
  </g>
  <path d="M124 154L164 154" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="170" y="135" width="149" height="38" rx="10" class="violet" />
    <text x="244.5" y="159" class="label ink">Model 2</text>
  </g>
  <g class="tile">
    <rect x="391" y="135" width="93" height="38" rx="10" class="blue" />
    <text x="437.5" y="159" class="label ink">Series 2</text>
  </g>
  <path d="M489 154L540 154" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="26" y="189" width="93" height="38" rx="10" class="blue" />
    <text x="72.5" y="213" class="label ink">Series 3</text>
  </g>
  <path d="M124 208L164 208" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="170" y="189" width="149" height="38" rx="10" class="violet" />
    <text x="244.5" y="213" class="label ink">Model 3</text>
  </g>
  <g class="tile">
    <rect x="391" y="189" width="93" height="38" rx="10" class="blue" />
    <text x="437.5" y="213" class="label ink">Series 3</text>
  </g>
  <path d="M489 208L540 154" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="547" y="128" width="147" height="54" rx="10" class="green" />
    <text x="620.5" y="160" class="label ink">Shared model</text>
  </g>
  <text x="619" y="217" class="note">Series ID + values</text>
  <path d="M360 52V245" class="guide" />
</svg>
