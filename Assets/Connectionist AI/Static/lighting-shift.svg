<svg xmlns="http://www.w3.org/2000/svg" width="720" height="211" viewBox="0 0 720 211" role="img" aria-labelledby="title desc">
  <title id="title">Lighting shift</title>
  <desc id="desc">The same bottle is shown under bright and dim lighting. Images from the deployment camera may differ from the images the model was trained on, so its performance should be checked again.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Lighting shift</text>
  <text x="187" y="63" class="label">Training camera</text>
  <rect x="95" y="76" width="184" height="94" rx="8" class="blue"/>
  <path d="M177 96h20v13l11 14v32h-42v-32l11-14Z" fill="#f8fafc" stroke="#61738c" stroke-width="2"/>
  <text x="187" y="194" class="note">Bright lighting</text>
  <text x="532" y="63" class="label">Production camera</text>
  <rect x="440" y="76" width="184" height="94" rx="8" class="violet"/>
  <path d="M522 96h20v13l11 14v32h-42v-32l11-14Z" fill="#645780" stroke="#61738c" stroke-width="2"/>
  <text x="532" y="194" class="note">Dim lighting</text>
  <path d="M302 123L418 123" class="edge" marker-end="url(#arrow)"/>
  <text x="360" y="109" class="note">Same bottle</text>
</svg>
