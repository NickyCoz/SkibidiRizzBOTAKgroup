<svg xmlns="http://www.w3.org/2000/svg" width="720" height="271" viewBox="0 0 720 271" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid saturation</title>
  <desc id="desc">The sigmoid curve is steepest at zero, where its output is 0.5. It becomes nearly flat as the input approaches either extreme.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Sigmoid saturation</text>
  <text x="52" y="57" class="note">Output</text>
  <path d="M100 221.00H620" class="guide"/>
  <text x="79" y="225" class="note">0</text>
  <path d="M100 181.50H620" class="guide"/>
  <text x="79" y="185.5" class="note">0.25</text>
  <path d="M100 142.00H620" class="guide"/>
  <text x="79" y="146" class="note">0.5</text>
  <path d="M100 102.50H620" class="guide"/>
  <text x="79" y="106.5" class="note">0.75</text>
  <path d="M100 63.00H620" class="guide"/>
  <text x="79" y="67" class="note">1</text>
  <text x="100" y="241" class="note">-6</text>
  <text x="230" y="241" class="note">-3</text>
  <text x="360" y="241" class="note">0</text>
  <text x="490" y="241" class="note">3</text>
  <text x="620" y="241" class="note">6</text>
  <path d="M100 221L637 221" class="edge" marker-end="url(#arrow)"/>
  <path d="M100 221L100 54" class="edge" marker-end="url(#arrow)"/>
  <path d="M360.00 63V221" class="edge"/>
