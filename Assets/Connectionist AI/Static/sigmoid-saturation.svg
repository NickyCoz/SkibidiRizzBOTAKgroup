  <circle cx="360" cy="142" r="5" class="green"/>
  <text x="427" y="132" class="note">σ(0) = 0.5</text>
  <circle cx="143.33333333333334" cy="219.942529553963" r="5" class="amber"/>
  <text x="194.33333333333334" y="205.942529553963" class="note">Nearly flat</text>
  <circle cx="576.6666666666667" cy="64.057470446037" r="5" class="amber"/>
  <text x="515.6666666666667" y="81.057470446037" class="note">Nearly flat</text>
  <text x="360" y="257" class="note">Input z</text>
</svg>
