<svg xmlns="http://www.w3.org/2000/svg" width="720" height="249" viewBox="0 0 720 249" role="img" aria-labelledby="title desc">
  <title id="title">Softmax at three temperatures</title>
  <desc id="desc">The same scores produce a more concentrated distribution at temperature 0.5 and a flatter distribution at temperature 2.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Softmax at three temperatures</text>
  <text x="133" y="61" class="label">Temperature 0.5</text>
  <text x="46" y="92" class="note">A</text>
  <rect x="63" y="76" width="135.22287982278422" height="25" rx="3" class="blue"/>
  <text x="221.22287982278422" y="93" class="note">86.7%</text>
  <text x="46" y="131" class="note">B</text>
  <rect x="63" y="115" width="18.300426740886945" height="25" rx="3" class="violet"/>
  <text x="104.30042674088695" y="132" class="note">11.7%</text>
  <text x="46" y="170" class="note">C</text>
  <rect x="63" y="154" width="2.4766934363288153" height="25" rx="3" class="green"/>
  <text x="88.47669343632882" y="171" class="note">1.6%</text>
  <text x="361" y="61" class="label">Temperature 1</text>
  <text x="274" y="92" class="note">A</text>
  <rect x="291" y="76" width="103.77758910087222" height="25" rx="3" class="blue"/>
  <text x="417.7775891008722" y="93" class="note">66.5%</text>
  <text x="274" y="131" class="note">B</text>
  <rect x="291" y="115" width="38.17764148454843" height="25" rx="3" class="violet"/>
  <text x="352.1776414845484" y="132" class="note">24.5%</text>
  <text x="274" y="170" class="note">C</text>
  <rect x="291" y="154" width="14.044769414579353" height="25" rx="3" class="green"/>
  <text x="328.0447694145794" y="171" class="note">9.0%</text>
  <text x="589" y="61" class="label">Temperature 2</text>
  <text x="502" y="92" class="note">A</text>
  <rect x="519" y="76" width="79.01094100468202" height="25" rx="3" class="blue"/>
  <text x="621.0109410046821" y="93" class="note">50.6%</text>
  <text x="502" y="131" class="note">B</text>
  <rect x="519" y="115" width="47.92255817208574" height="25" rx="3" class="violet"/>
  <text x="589.9225581720857" y="132" class="note">30.7%</text>
  <text x="502" y="170" class="note">C</text>
  <rect x="519" y="154" width="29.066500823232218" height="25" rx="3" class="green"/>
  <text x="571.0665008232322" y="171" class="note">18.6%</text>
  <text x="360" y="226" class="note">Logits: A = 2 · B = 1 · C = 0</text>
</svg>
