<svg xmlns="http://www.w3.org/2000/svg" width="720" height="225" viewBox="0 0 720 225" role="img" aria-labelledby="title desc">
  <title id="title">Intermittent demand</title>
  <desc id="desc">Twelve illustrative days contain nine zero-demand days and three nonzero days. Separate gaps and nonzero sizes help explain intermittent demand.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Intermittent demand</text>
  <path d="M67 170L667 170" class="edge" marker-end="url(#arrow)" />
  <circle cx="98" cy="170" r="3" class="blue" />
  <text x="98" y="191" class="note">1</text>
  <circle cx="145" cy="170" r="3" class="blue" />
  <text x="145" y="191" class="note">2</text>
  <circle cx="192" cy="170" r="3" class="blue" />
  <text x="192" y="191" class="note">3</text>
  <rect x="227" y="90" width="24" height="80" rx="3" class="violet" />
  <text x="239" y="191" class="note">4</text>
  <circle cx="286" cy="170" r="3" class="blue" />
  <text x="286" y="191" class="note">5</text>
  <circle cx="333" cy="170" r="3" class="blue" />
  <text x="333" y="191" class="note">6</text>
  <circle cx="380" cy="170" r="3" class="blue" />
  <text x="380" y="191" class="note">7</text>
  <circle cx="427" cy="170" r="3" class="blue" />
  <text x="427" y="191" class="note">8</text>
  <rect x="462" y="138" width="24" height="32" rx="3" class="violet" />
  <text x="474" y="191" class="note">9</text>
  <circle cx="521" cy="170" r="3" class="blue" />
  <text x="521" y="191" class="note">10</text>
  <circle cx="568" cy="170" r="3" class="blue" />
  <text x="568" y="191" class="note">11</text>
  <rect x="603" y="74" width="24" height="96" rx="3" class="violet" />
  <text x="615" y="191" class="note">12</text>
  <text x="363" y="216" class="note">Day</text>
  <text x="76" y="62" class="note">Units</text>
</svg>
