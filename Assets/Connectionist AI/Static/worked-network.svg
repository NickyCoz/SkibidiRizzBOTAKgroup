<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Forward pass</title>
  <desc id="desc">Both inputs feed both hidden neurons. The hidden neurons apply ReLU to produce 0.3 and 0.9. The linear output combines them with weights 1 and minus 0.5, plus a bias of 0.2, to predict 0.05.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; }
    .title { fill: #172554; font-size: 23px; font-weight: 700; }
    .label { fill: #334155; font-size: 14px; font-weight: 600; }
    .symbol { font-size: 15px; font-weight: 500; }
    .value { font-size: 25px; font-weight: 700; }
    .input { fill: #164e83; }
    .hidden { fill: #56348b; }
    .output { fill: #065c46; }
    .edge { fill: none; stroke: #7c879e; stroke-width: 2; }
    .node { stroke-width: 2; }
    .input-node { fill: #e0f2fe; stroke: #3298d0; }
    .hidden-node { fill: #f1eaff; stroke: #9772dc; }
    .output-node { fill: #dcfce7; stroke: #1f9d73; }
    .weight { fill: #334155; font-size: 13px; font-weight: 600; }
    .weight-tag { fill: #f1f5f9; stroke: #94a3b8; }
    .divider { stroke: #94a3b8; opacity: .55; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5ff; }
      .label { fill: #cbd5e1; }
      .edge { stroke: #8996ad; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7c879e"/>
    </marker>
  </defs>
  <text x="360" y="30" class="title">Forward pass</text>
  <text x="106" y="60" class="label">1 · Read the inputs</text>
  <text x="360" y="60" class="label">2 · Combine and apply ReLU</text>
  <text x="621" y="60" class="label">3 · Make a prediction</text>
  <path d="M148 111 C220 111 244 111 316 111" class="edge" marker-end="url(#arrow)"/>
  <path d="M145 125 C220 144 248 199 318 219" class="edge" marker-end="url(#arrow)"/>
  <path d="M145 215 C220 196 248 141 318 121" class="edge" marker-end="url(#arrow)"/>
  <path d="M148 229 C220 229 244 229 316 229" class="edge" marker-end="url(#arrow)"/>
  <path d="M404 111 C482 111 503 154 574 162" class="edge" marker-end="url(#arrow)"/>
  <path d="M404 229 C482 229 503 186 574 178" class="edge" marker-end="url(#arrow)"/>
  <g class="input">
    <circle cx="106" cy="111" r="40" class="node input-node"/>
    <text x="106" y="104" class="symbol">x₁</text>
    <text x="106" y="132" class="value">1</text>
  </g>
  <g class="input">
    <circle cx="106" cy="229" r="40" class="node input-node"/>
    <text x="106" y="222" class="symbol">x₂</text>
    <text x="106" y="250" class="value">2</text>
  </g>
  <g class="hidden">
    <circle cx="360" cy="111" r="40" class="node hidden-node"/>
    <text x="360" y="104" class="symbol">h₁</text>
    <text x="360" y="132" class="value">0.3</text>
  </g>
  <g class="hidden">
    <circle cx="360" cy="229" r="40" class="node hidden-node"/>
    <text x="360" y="222" class="symbol">h₂</text>
    <text x="360" y="250" class="value">0.9</text>
  </g>
  <g class="output">
    <circle cx="621" cy="170" r="45" class="node output-node"/>
    <text x="621" y="163" class="symbol">ŷ</text>
    <text x="621" y="191" class="value">0.05</text>
  </g>
  <rect x="478" y="105" width="54" height="24" rx="12" class="weight-tag"/>
  <text x="505" y="122" class="weight">× 1</text>
  <rect x="475" y="216" width="60" height="24" rx="12" class="weight-tag"/>
  <text x="505" y="233" class="weight">× −0.5</text>
</svg>
