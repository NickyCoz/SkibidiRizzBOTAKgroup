<svg xmlns="http://www.w3.org/2000/svg" width="720" height="249" viewBox="0 0 720 249" role="img" aria-labelledby="title desc">
  <title id="title">Adam running statistics</title>
  <desc id="desc">The same gradient contributes to a first-moment average and a second-moment average of squared gradients. Bias-corrected estimates combine to scale the update.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Adam running statistics</text>
  <g class="tile">
    <rect x="31" y="105" width="132" height="38" rx="10" class="blue" />
    <text x="97" y="129" class="label ink">Gradient g</text>
  </g>
  <path d="M169 124L250 77" class="edge" marker-end="url(#arrow)" />
  <path d="M169 124L250 174" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="256" y="58" width="187" height="38" rx="10" class="violet" />
    <text x="349.5" y="82" class="label ink">Average of g</text>
  </g>
  <g class="tile">
    <rect x="256" y="155" width="187" height="38" rx="10" class="blue" />
    <text x="349.5" y="179" class="label ink">Average of g²</text>
  </g>
  <path d="M449 77L503 124" class="edge" marker-end="url(#arrow)" />
  <path d="M449 174L503 124" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="509" y="105" width="180" height="38" rx="10" class="green" />
    <text x="599" y="129" class="label ink">Scaled update</text>
  </g>
  <text x="349" y="119" class="note">Bias correction</text>
  <text x="598" y="211" class="note">m̂ / (√v̂ + ε)</text>
</svg>
