<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-labelledby="title desc">
  <title id="title">Patterns of concept drift</title>
  <desc id="desc">Four schematic panels show an abrupt change, a gradual mixture transition, continuous incremental drift, and recurring behavior. Heights represent an illustrative concept statistic.</desc>
  <style>
