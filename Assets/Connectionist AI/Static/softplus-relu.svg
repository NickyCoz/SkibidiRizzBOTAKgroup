<svg xmlns="http://www.w3.org/2000/svg" width="720" height="294" viewBox="0 0 720 294" role="img" aria-labelledby="title desc">
  <title id="title">Softplus and ReLU</title>
  <desc id="desc">Softplus stays positive on the negative side and rounds off the corner that ReLU has at zero.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
