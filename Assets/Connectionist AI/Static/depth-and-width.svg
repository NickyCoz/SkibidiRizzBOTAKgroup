<svg xmlns="http://www.w3.org/2000/svg" width="720" height="209" viewBox="0 0 720 209" role="img" aria-labelledby="title desc">
  <title id="title">Network depth and width</title>
  <desc id="desc">One hidden layer with five units is wider than a hidden layer with three units. Three successive hidden layers are deeper than a single hidden layer.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
