<svg xmlns="http://www.w3.org/2000/svg" width="720" height="172" viewBox="0 0 720 172" role="img" aria-labelledby="title desc">
  <title id="title">Selected connectionist AI milestones</title>
  <desc id="desc">Four selected milestones from the chapter: the perceptron in 1958, popularisation of backpropagation in 1986, AlexNet in 2012, and the Transformer in 2017.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Selected connectionist AI milestones</text>
  <path d="M48 114L681 114" class="edge" marker-end="url(#arrow)"/>
  <circle cx="108" cy="114" r="8" class="blue"/>
  <text x="108" y="86" class="num">1958</text>
  <text x="108" y="153" class="label">Perceptron</text>
  <circle cx="275" cy="114" r="8" class="violet"/>
  <text x="275" y="86" class="num">1986</text>
  <text x="275" y="153" class="label">Backpropagation</text>
  <circle cx="443" cy="114" r="8" class="green"/>
  <text x="443" y="86" class="num">2012</text>
  <text x="443" y="153" class="label">AlexNet</text>
  <circle cx="612" cy="114" r="8" class="amber"/>
  <text x="612" y="86" class="num">2017</text>
  <text x="612" y="153" class="label">Transformer</text>
</svg>
