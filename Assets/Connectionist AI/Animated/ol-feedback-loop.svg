<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation feedback loop</title>
  <desc id="desc">Shown items generate observed interactions. Those interactions train the next model, influencing which items are shown again. Unshown items have less observed feedback.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .flow { fill: none; stroke: #b365dc; stroke-width: 4; stroke-dasharray: 7 14; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -63; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Recommendation feedback loop</text>
  <g class="tile">
    <rect x="39" y="65" width="164" height="38" rx="10" class="violet" />
    <text x="121" y="89" class="label ink">Current model</text>
  </g>
  <path d="M208 84L267 84" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="273" y="65" width="170" height="38" rx="10" class="blue" />
    <text x="358" y="89" class="label ink">Shown items</text>
  </g>
  <path d="M449 84L504 84" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="510" y="65" width="170" height="38" rx="10" class="green" />
    <text x="595" y="89" class="label ink">Observed clicks</text>
  </g>
  <path d="M596 108V170H123V108" class="edge" marker-end="url(#arrow)" />
  <path d="M596 108V170H123V108" class="flow" />
  <text x="363" y="194" class="note">Training on observed interactions</text>
  <g class="tile">
    <rect x="276" y="117" width="164" height="38" rx="10" class="amber" />
    <text x="358" y="141" class="label ink">Unshown items</text>
  </g>
</svg>
