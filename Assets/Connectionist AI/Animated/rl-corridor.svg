<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="title desc">
  <title id="title">Five-cell corridor</title>
  <desc id="desc">An agent moves right through states zero to four. Reaching state four gives reward one. The learned right-action values are 0.729,0.81,0.9,1.0 before the goal.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .agent { animation: corridor 8s steps(1,end) infinite; }
    @keyframes corridor { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(121px); } 40% { transform: translateX(242px); } 60% { transform: translateX(363px); } 80%,99% { transform: translateX(484px); } }
    @media (prefers-reduced-motion: reduce) { .agent { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Five-cell corridor</text>
  <g class="tile">
    <rect x="66" y="85" width="107" height="71" rx="6" class="blue" />
    <text x="119.5" y="112" class="label ink">State 0</text>
    <text x="119.5" y="142" class="num ink">→</text>
  </g>
  <g class="tile">
    <rect x="187" y="85" width="107" height="71" rx="6" class="blue" />
    <text x="240.5" y="112" class="label ink">State 1</text>
    <text x="240.5" y="142" class="num ink">→</text>
  </g>
  <g class="tile">
    <rect x="308" y="85" width="107" height="71" rx="6" class="blue" />
    <text x="361.5" y="112" class="label ink">State 2</text>
    <text x="361.5" y="142" class="num ink">→</text>
  </g>
  <g class="tile">
    <rect x="429" y="85" width="107" height="71" rx="6" class="blue" />
    <text x="482.5" y="112" class="label ink">State 3</text>
    <text x="482.5" y="142" class="num ink">→</text>
  </g>
  <g class="tile">
    <rect x="550" y="85" width="107" height="71" rx="6" class="green" />
    <text x="603.5" y="112" class="label ink">State 4</text>
    <text x="603.5" y="142" class="num ink">Goal +1</text>
  </g>
  <g class="agent">
    <circle cx="119" cy="182" r="10" class="violet" />
  </g>
  <text x="119.5" y="223" class="note">0.729</text>
  <text x="240.5" y="223" class="note">0.81</text>
  <text x="361.5" y="223" class="note">0.9</text>
  <text x="482.5" y="223" class="note">1</text>
  <text x="603.5" y="223" class="note">Terminal</text>
  <text x="76" y="247" class="note">Q(right)</text>
</svg>
