<svg xmlns="http://www.w3.org/2000/svg" width="720" height="239" viewBox="0 0 720 239" role="img" aria-labelledby="title desc">
  <title id="title">Two-tower retrieval</title>
  <desc id="desc">Separate networks encode user history and item features into vectors. Their similarity retrieves candidate items. Item vectors can be computed before the request.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .flow { fill: none; stroke: #b365dc; stroke-width: 4; stroke-dasharray: 7 14; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -63; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Two-tower retrieval</text>
  <g class="tile">
    <rect x="35" y="60" width="166" height="38" rx="10" class="blue" />
    <text x="118" y="84" class="label ink">User history</text>
  </g>
  <path d="M121 104L121 127" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="35" y="135" width="166" height="38" rx="10" class="violet" />
    <text x="118" y="159" class="label ink">User tower</text>
  </g>
  <g class="tile">
    <rect x="519" y="60" width="166" height="38" rx="10" class="blue" />
    <text x="602" y="84" class="label ink">Item features</text>
  </g>
  <path d="M601 104L601 127" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="519" y="135" width="166" height="38" rx="10" class="violet" />
    <text x="602" y="159" class="label ink">Item tower</text>
  </g>
  <path d="M208 154L278 154" class="edge" marker-end="url(#arrow)" />
  <path d="M512 154L441 154" class="edge" marker-end="url(#arrow)" />
  <rect x="282" y="134" width="11" height="40" rx="2" class="blue" />
  <rect x="380" y="134" width="11" height="40" rx="2" class="amber" />
  <rect x="298" y="134" width="11" height="40" rx="2" class="violet" />
  <rect x="396" y="134" width="11" height="40" rx="2" class="green" />
  <rect x="314" y="134" width="11" height="40" rx="2" class="blue" />
  <rect x="412" y="134" width="11" height="40" rx="2" class="amber" />
  <rect x="330" y="134" width="11" height="40" rx="2" class="violet" />
  <rect x="428" y="134" width="11" height="40" rx="2" class="green" />
  <text x="360" y="209" class="note">Vector similarity → candidates</text>
  <path d="M208 154H278M512 154H441" class="flow" />
</svg>
