<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
  <title id="title">Recursive and multi-output forecasts</title>
  <desc id="desc">Recursive forecasting feeds a predicted value back into the model to predict the next value. Multi-output forecasting emits the whole horizon from one input window.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .flow { fill: none; stroke: #b365dc; stroke-width: 4; stroke-dasharray: 7 14; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -63; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Recursive and multi-output forecasts</text>
  <text x="84" y="89" class="label">Recursive</text>
  <g class="tile">
    <rect x="169" y="68" width="111" height="38" rx="10" class="blue" />
    <text x="224.5" y="92" class="label ink">History</text>
  </g>
  <path d="M284 87L318 87" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="324" y="68" width="126" height="38" rx="10" class="violet" />
    <text x="387" y="92" class="label ink">Model</text>
  </g>
  <path d="M455 87L487 87" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="493" y="68" width="149" height="38" rx="10" class="green" />
    <text x="567.5" y="92" class="label ink">Next prediction</text>
  </g>
  <path d="M566 110V132H225V110" class="edge" marker-end="url(#arrow)" />
  <path d="M566 110V132H225V110" class="flow" />
  <text x="85" y="197" class="label">Multi-output</text>
  <g class="tile">
    <rect x="169" y="176" width="111" height="38" rx="10" class="blue" />
    <text x="224.5" y="200" class="label ink">History</text>
  </g>
  <path d="M284 195L318 195" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="324" y="176" width="126" height="38" rx="10" class="violet" />
    <text x="387" y="200" class="label ink">Model</text>
  </g>
  <g class="tile">
    <rect x="494" y="176" width="59" height="38" rx="10" class="green" />
    <text x="523.5" y="200" class="label ink">t+1</text>
  </g>
  <g class="tile">
    <rect x="559" y="176" width="59" height="38" rx="10" class="green" />
    <text x="588.5" y="200" class="label ink">t+2</text>
  </g>
  <g class="tile">
    <rect x="624" y="176" width="59" height="38" rx="10" class="green" />
    <text x="653.5" y="200" class="label ink">t+3</text>
  </g>
  <path d="M455 195L487 195" class="edge" marker-end="url(#arrow)" />
</svg>
