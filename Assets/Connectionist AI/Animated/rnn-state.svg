<svg xmlns="http://www.w3.org/2000/svg" width="720" height="185" viewBox="0 0 720 185" role="img" aria-labelledby="title desc">
  <title id="title">RNN state across time</title>
  <desc id="desc">Each sequence item enters the same recurrent cell. The first step uses an initial state, and each later step uses the state produced by the preceding step.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .cell rect { animation: focus 6s infinite; }
    .cell-2 rect { animation-delay: 1.5s; }
    .cell-3 rect { animation-delay: 3s; }
    @keyframes focus { 0%, 25%, 100% { fill: #ede9fe; } 9%, 18% { fill: #fdbaef; } }
    @media (prefers-reduced-motion: reduce) { .cell rect { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">RNN state across time</text>
  <text x="169" y="66" class="label">Input x₁</text>
  <path d="M169 74L169 109" class="edge" marker-end="url(#arrow)"/>
  <g class="tile cell cell-1">
    <rect x="110" y="113" width="118" height="56" rx="8" class="violet"/>
    <text x="169" y="137" class="label">Same RNN cell</text>
    <text x="169" y="158" class="note">State h₁</text>
  </g>
  <text x="360" y="66" class="label">Input x₂</text>
  <path d="M360 74L360 109" class="edge" marker-end="url(#arrow)"/>
  <g class="tile cell cell-2">
    <rect x="301" y="113" width="118" height="56" rx="8" class="violet"/>
    <text x="360" y="137" class="label">Same RNN cell</text>
    <text x="360" y="158" class="note">State h₂</text>
  </g>
  <text x="551" y="66" class="label">Input x₃</text>
  <path d="M551 74L551 109" class="edge" marker-end="url(#arrow)"/>
  <g class="tile cell cell-3">
    <rect x="492" y="113" width="118" height="56" rx="8" class="violet"/>
    <text x="551" y="137" class="label">Same RNN cell</text>
    <text x="551" y="158" class="note">State h₃</text>
  </g>
  <text x="54" y="131" class="label">Start</text>
  <text x="54" y="153" class="note">h₀</text>
  <path d="M77 141L105 141" class="edge" marker-end="url(#arrow)"/>
  <path d="M229 141L296 141" class="edge" marker-end="url(#arrow)"/>
  <path d="M420 141L487 141" class="edge" marker-end="url(#arrow)"/>
</svg>
