<svg xmlns="http://www.w3.org/2000/svg" width="720" height="204" viewBox="0 0 720 204" role="img" aria-labelledby="title desc">
  <title id="title">One training step</title>
  <desc id="desc">The model predicts below the target. Squared error measures the gap. Backpropagation traces the loss to one output weight. The update increases that weight, moving the prediction toward the target.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .step .tile { animation: highlight 7.28s infinite; }
    .step-2 .tile { animation-delay: 1.6s; }
    .step-3 .tile { animation-delay: 3.2s; }
    .step-4 .tile { animation-delay: 4.800000000000001s; }
    @keyframes highlight {
      0%, 21.98%, 100% { fill: #dbeafe; stroke: #4169a9; }
      3.96%, 17.58% { fill: #fde68a; stroke: #a16207; }
    }
    @media (prefers-reduced-motion: reduce) { .step .tile { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="360" y="34" class="heading">One training step</text>
  <path d="M168 125 h19" class="arrow" marker-end="url(#arrow)"/>
  <path d="M342 125 h19" class="arrow" marker-end="url(#arrow)"/>
  <path d="M516 125 h19" class="arrow" marker-end="url(#arrow)"/>
  <g class="step step-1 on-tile">
    <rect x="16" y="63" width="152" height="128" rx="8" class="tile"/>
    <text x="92" y="90" class="label">1 · Predict</text>
    <path d="M38 131 H143" class="axis"/>
    <circle cx="48" cy="131" r="6" class="violet"/>
    <circle cx="132" cy="131" r="6" class="green"/>
    <text x="49" y="155" class="small">Model</text>
    <text x="132" y="155" class="small">Target</text>
    <text x="49" y="175" class="small">0.05</text>
    <text x="132" y="175" class="small">1</text>
  </g>
  <g class="step step-2 on-tile">
    <rect x="190" y="63" width="152" height="128" rx="8" class="tile"/>
    <text x="266" y="90" class="label">2 · Measure loss</text>
    <path d="M216 119 v14 h100 v-14" class="axis"/>
    <circle cx="216" cy="119" r="6" class="violet"/>
    <circle cx="316" cy="119" r="6" class="green"/>
    <text x="266" y="155" class="small">Square the gap</text>
    <text x="266" y="175" class="small">Loss = 0.9025</text>
  </g>
  <g class="step step-3 on-tile">
    <rect x="364" y="63" width="152" height="128" rx="8" class="tile"/>
    <text x="440" y="90" class="label">3 · Trace back</text>
    <text x="405" y="124" class="label">w₁</text>
    <text x="480" y="124" class="small">Loss</text>
    <path d="M459 120 H424" class="arrow" marker-end="url(#arrow)"/>
    <text x="440" y="155" class="small">Increasing w₁</text>
    <text x="440" y="175" class="small">lowers loss here</text>
  </g>
  <g class="step step-4 on-tile">
    <rect x="538" y="63" width="166" height="128" rx="8" class="tile"/>
    <text x="621" y="90" class="label">4 · Adjust</text>
    <text x="576" y="124" class="small">1.0</text>
    <text x="665" y="124" class="small">1.057</text>
    <path d="M599 120 H637" class="arrow" marker-end="url(#arrow)"/>
    <text x="621" y="155" class="small">Increase w₁</text>
    <text x="621" y="175" class="small">by a small step</text>
  </g>
</svg>
