<svg xmlns="http://www.w3.org/2000/svg" width="720" height="237" viewBox="0 0 720 237" role="img" aria-labelledby="title desc">
  <title id="title">Forward values and backward gradients</title>
  <desc id="desc">The forward pass computes the hidden value, prediction, and loss. Backpropagation follows the dependency path in the opposite direction and multiplies local derivatives.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
    .flow { fill: none; stroke: #a864db; stroke-width: 4; stroke-dasharray: 7 13; animation: move 2s linear infinite; }
    @keyframes move { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Forward values and backward gradients</text>
  <g class="tile">
    <rect x="42" y="91" width="115" height="36" rx="12" class="blue"/>
    <text x="99.5" y="114" class="label">Weight w₁</text>
  </g>
  <g class="tile">
    <rect x="213" y="91" width="130" height="36" rx="12" class="violet"/>
    <text x="278" y="114" class="label">Prediction ŷ</text>
  </g>
  <g class="tile">
    <rect x="404" y="91" width="120" height="36" rx="12" class="green"/>
    <text x="464" y="114" class="label">Loss L</text>
  </g>
  <path d="M162 108L207 108" class="edge" marker-end="url(#arrow)"/>
  <path d="M348 108L398 108" class="edge" marker-end="url(#arrow)"/>
  <text x="598" y="112" class="note">Forward values</text>
  <path d="M466 132V169H290" class="edge" marker-end="url(#arrow)"/>
  <path d="M276 169H100V132" class="edge" marker-end="url(#arrow)"/>
  <path d="M466 132V169H290" class="flow"/>
  <path d="M276 169H100V132" class="flow"/>
  <text x="193" y="159" class="note">× ∂ŷ/∂w₁</text>
  <text x="372" y="159" class="note">∂L/∂ŷ</text>
  <text x="604" y="174" class="note">Backward gradients</text>
  <text x="286" y="210" class="label">∂L/∂w₁ = (∂L/∂ŷ) × (∂ŷ/∂w₁)</text>
</svg>
