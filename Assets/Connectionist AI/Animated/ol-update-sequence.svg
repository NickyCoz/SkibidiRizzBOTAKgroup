<svg xmlns="http://www.w3.org/2000/svg" width="720" height="215" viewBox="0 0 720 215" role="img" aria-labelledby="title desc">
  <title id="title">Predict, measure, then update</title>
  <desc id="desc">An incoming example is first scored by the existing model. After its target is available, its error is measured and the model is updated for the next example.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .focus { animation: focus 8s infinite; }
    .phase-0 { animation-delay: 0s; }
    .phase-1 { animation-delay: 2s; }
    .phase-2 { animation-delay: 4s; }
    .phase-3 { animation-delay: 6s; }
    @keyframes focus { 0%, 25%, 100% { fill: #dbeafe; } 5%, 20% { fill: #f9c8ed; } }
    @media (prefers-reduced-motion: reduce) { .focus { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Predict, measure, then update</text>
  <g class="tile">
    <rect x="31" y="83" width="140" height="54" rx="7" class="blue focus phase-0" />
    <text x="101" y="115" class="label ink">New example</text>
  </g>
  <g class="tile">
    <rect x="213" y="83" width="140" height="54" rx="7" class="blue focus phase-1" />
    <text x="283" y="115" class="label ink">Predict</text>
  </g>
  <g class="tile">
    <rect x="395" y="83" width="140" height="54" rx="7" class="blue focus phase-2" />
    <text x="465" y="115" class="label ink">Measure error</text>
  </g>
  <g class="tile">
    <rect x="577" y="83" width="122" height="54" rx="7" class="blue focus phase-3" />
    <text x="638" y="115" class="label ink">Update weights</text>
  </g>
  <path d="M172 110L206 110" class="edge" marker-end="url(#arrow)" />
  <path d="M354 110L388 110" class="edge" marker-end="url(#arrow)" />
  <path d="M536 110L570 110" class="edge" marker-end="url(#arrow)" />
  <path d="M638 140V177H284V141" class="edge" marker-end="url(#arrow)" />
  <text x="460" y="197" class="note">Updated model for later examples</text>
</svg>
