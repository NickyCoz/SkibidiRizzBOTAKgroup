<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" role="img" aria-labelledby="title desc">
  <title id="title">AND neuron threshold</title>
  <desc id="desc">Both input signals feed a weighted sum. The bias sets a threshold between one and two active inputs. Only the case with two active inputs has a positive sum.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .step .tile { animation: highlight 5.680000000000001s infinite; }
    .step-2 .tile { animation-delay: 1.6s; }
    .step-3 .tile { animation-delay: 3.2s; }
    @keyframes highlight {
      0%, 28.17%, 100% { fill: #dbeafe; stroke: #4169a9; }
      5.07%, 22.54% { fill: #fde68a; stroke: #a16207; }
    }
    @media (prefers-reduced-motion: reduce) { .step .tile { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="360" y="34" class="heading">AND neuron threshold</text>
  <path d="M143 99 L206 124" class="arrow" marker-end="url(#arrow)"/>
  <path d="M143 161 L206 136" class="arrow" marker-end="url(#arrow)"/>
  <path d="M366 130 H402" class="arrow" marker-end="url(#arrow)"/>
  <g class="step step-1 on-tile">
    <rect x="22" y="78" width="120" height="42" rx="8" class="tile"/>
    <text x="82" y="105" class="label">Input 1 = 1</text>
    <rect x="22" y="140" width="120" height="42" rx="8" class="tile"/>
    <text x="82" y="167" class="label">Input 2 = 1</text>
  </g>
  <text x="171" y="91" class="small">×1</text>
  <text x="171" y="177" class="small">×1</text>
  <g class="step step-2 on-tile">
    <rect x="210" y="84" width="155" height="92" rx="8" class="tile"/>
    <text x="287" y="113" class="label">Add signals</text>
    <text x="287" y="137" class="small">Subtract 1.5</text>
    <text x="287" y="158" class="small">Score = 0.5</text>
  </g>
  <g class="step step-3 on-tile">
    <rect x="406" y="67" width="290" height="128" rx="8" class="tile"/>
    <text x="551" y="94" class="label">Threshold at zero</text>
    <path d="M433 132 H671" class="axis" marker-end="url(#arrow)"/>
    <path d="M604 117 V146" class="axis"/>
    <circle cx="451" cy="132" r="6" class="violet"/>
    <circle cx="553" cy="132" r="6" class="violet"/>
    <circle cx="655" cy="132" r="6" class="green"/>
    <text x="451" y="155" class="small">−1.5</text>
    <text x="553" y="155" class="small">−0.5</text>
    <text x="604" y="162" class="small">0</text>
    <text x="655" y="155" class="small">0.5</text>
    <text x="493" y="181" class="small">Output 0</text>
    <text x="654" y="181" class="small">Output 1</text>
  </g>
</svg>
