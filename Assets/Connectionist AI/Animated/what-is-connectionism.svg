<svg xmlns="http://www.w3.org/2000/svg" width="720" height="223" viewBox="0 0 720 223" role="img" aria-labelledby="title desc">
  <title id="title">Connection weights before and after learning</title>
  <desc id="desc">Two simplified networks receive the same inputs, 1 and 0. With no bias and an identity output, the first network scores 0.2 and the second scores 0.8 because their connection weights differ.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Connection weights before and after learning</text>
  <text x="181" y="63" class="label">Before learning</text>
  <path d="M102 108L236 140" class="edge" marker-end="url(#arrow)"/>
  <path d="M102 185L236 151" class="edge" marker-end="url(#arrow)"/>
  <path d="M102 108L236 140" class="signal" style="stroke-width:2px"/>
  <g class="tile">
    <rect x="26" y="87" width="74" height="38" rx="19" class="blue"/>
    <text x="63" y="111" class="label">Input 1</text>
  </g>
  <g class="tile">
    <rect x="26" y="166" width="74" height="38" rx="19" class="blue"/>
    <text x="63" y="190" class="label">Input 0</text>
  </g>
  <text x="169" y="109" class="note">× 0.2</text>
  <text x="169" y="191" class="note">× 0.8</text>
  <g class="tile">
    <rect x="241" y="126" width="94" height="38" rx="19" class="green"/>
    <text x="288" y="150" class="label">Score 0.2</text>
  </g>
  <text x="536" y="63" class="label">After a possible update</text>
  <path d="M457 108L591 140" class="edge" marker-end="url(#arrow)"/>
  <path d="M457 185L591 151" class="edge" marker-end="url(#arrow)"/>
  <path d="M457 108L591 140" class="signal" style="stroke-width:5px"/>
  <g class="tile">
    <rect x="381" y="87" width="74" height="38" rx="19" class="blue"/>
    <text x="418" y="111" class="label">Input 1</text>
  </g>
  <g class="tile">
    <rect x="381" y="166" width="74" height="38" rx="19" class="blue"/>
    <text x="418" y="190" class="label">Input 0</text>
  </g>
  <text x="524" y="109" class="note">× 0.8</text>
  <text x="524" y="191" class="note">× 0.2</text>
  <g class="tile">
    <rect x="596" y="126" width="94" height="38" rx="19" class="green"/>
    <text x="643" y="150" class="label">Score 0.8</text>
  </g>
  <path d="M360 53L360 211" class="guide"/>
</svg>
