<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-labelledby="title desc">
  <title id="title">Vanishing gradients</title>
  <desc id="desc">Four proportional bars show how an output gradient of 1 shrinks to 0.25, 0.0625, and 0.015625 on its way backward through three layers.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .step .tile { animation: highlight 7.28s infinite; }
    .step-2 .tile { animation-delay: 1.6s; }
    .step-3 .tile { animation-delay: 3.2s; }
    .step-4 .tile { animation-delay: 4.800000000000001s; }
    @keyframes highlight {
      0%, 21.98%, 100% { fill: #dbeafe; stroke: #4169a9; }
      3.96%, 17.58% { fill: #fde68a; stroke: #a16207; }
    }
    @media (prefers-reduced-motion: reduce) { .step .tile { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="360" y="34" class="heading">Vanishing gradients</text>
  <path d="M200 79 V240" class="axis"/>
  <text x="127" y="102" class="label">Output</text>
  <g class="step step-1">
    <rect x="200" y="82" width="365" height="26" rx="8" class="tile"/>
  </g>
  <text x="597" y="101" class="small">1</text>
  <path d="M48 103 v34" class="arrow" marker-end="url(#arrow)"/>
  <text x="127" y="145" class="label">Later layer</text>
  <g class="step step-2">
    <rect x="200" y="125" width="91.25" height="26" rx="8" class="tile"/>
  </g>
  <text x="323.25" y="144" class="small">0.25</text>
  <path d="M48 146 v34" class="arrow" marker-end="url(#arrow)"/>
  <text x="127" y="188" class="label">Middle layer</text>
  <g class="step step-3">
    <rect x="200" y="168" width="22.8125" height="26" rx="8" class="tile"/>
  </g>
  <text x="254.8125" y="187" class="small">0.0625</text>
  <path d="M48 189 v34" class="arrow" marker-end="url(#arrow)"/>
  <text x="127" y="231" class="label">Earlier layer</text>
  <g class="step step-4">
    <rect x="200" y="211" width="5.703125" height="26" rx="8" class="tile"/>
  </g>
  <text x="237.703125" y="230" class="small">0.015625</text>
  <text x="360" y="261" class="small">Scalar example · weights = 1 · sigmoid slopes = 0.25</text>
</svg>
