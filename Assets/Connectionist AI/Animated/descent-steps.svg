<svg xmlns="http://www.w3.org/2000/svg" width="720" height="263" viewBox="0 0 720 263" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent on a toy loss surface</title>
  <desc id="desc">The example uses loss equal to w squared and a learning rate of 0.2. Starting at three, successive weights are 1.8, 1.08, and 0.648.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
    .point circle { animation: step 5.6s infinite; }
    .step-1 circle { animation-delay: 1.05s; }
    .step-2 circle { animation-delay: 2.1s; }
    .step-3 circle { animation-delay: 3.15s; }
    @keyframes step { 0%, 22%, 100% { r: 6; } 8%, 15% { r: 11; } }
    @media (prefers-reduced-motion: reduce) { .point circle { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Gradient descent on a toy loss surface</text>
  <path d="M82 204L657 204" class="edge" marker-end="url(#arrow)"/>
  <path d="M82 204L82 57" class="edge" marker-end="url(#arrow)"/>
  <text x="51" y="66" class="note">Loss</text>
  <path d="M133 77Q362 329 591 77" class="violet-line"/>
  <text x="641" y="230" class="note">Weight</text>
  <g class="point step-0">
    <circle cx="591" cy="77" r="6" class="amber"/>
  </g>
  <text x="595" y="63" class="note">3.00</text>
  <g class="point step-1">
    <circle cx="499.4" cy="157.64" r="6" class="amber"/>
  </g>
  <text x="503.4" y="143.64" class="note">1.80</text>
  <g class="point step-2">
    <circle cx="444.44" cy="187.67" r="6" class="amber"/>
  </g>
  <text x="448.44" y="167" class="note">1.08</text>
  <g class="point step-3">
    <circle cx="411.46" cy="197.12" r="6" class="amber"/>
  </g>
  <text x="415.46" y="223" class="note">0.65</text>
  <text x="363" y="247" class="note">Toy loss: L = w² · learning rate: 0.2</text>
</svg>
