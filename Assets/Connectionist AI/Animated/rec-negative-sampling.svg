<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-labelledby="title desc">
  <title id="title">Implicit positive and sampled negatives</title>
  <desc id="desc">One observed clicked item is paired with several sampled unobserved items. The latter are training negatives, although lack of observation is not proof of dislike.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 13px; }
    .num { font-size: 20px; font-weight: 700; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    .blue-line, .violet-line, .green-line, .amber-line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #3386c5; }
    .violet-line { stroke: #9670d2; }
    .green-line { stroke: #21a47a; }
    .amber-line { stroke: #ce873a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .ink { fill: #18243a; }
    .focus { animation: focus 6s infinite; }
    .phase-0 { animation-delay: 0s; }
    .phase-1 { animation-delay: 1.5s; }
    .phase-2 { animation-delay: 3s; }
    .phase-3 { animation-delay: 4.5s; }
    @keyframes focus { 0%, 25%, 100% { fill: #dbeafe; } 5%, 20% { fill: #f9c8ed; } }
    @media (prefers-reduced-motion: reduce) { .focus { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b" />
    </marker>
  </defs>
  <text x="360" y="29" class="title">Implicit positive and sampled negatives</text>
  <g class="tile">
    <rect x="36" y="92" width="128" height="38" rx="10" class="blue" />
    <text x="100" y="116" class="label ink">User</text>
  </g>
  <path d="M169 111L250 111" class="edge" marker-end="url(#arrow)" />
  <g class="tile">
    <rect x="281" y="79" width="92" height="67" rx="7" class="green" />
    <text x="327" y="103" class="note ink">Item 1</text>
    <text x="327" y="127" class="note ink">Clicked</text>
  </g>
  <g class="tile">
    <rect x="385" y="79" width="92" height="67" rx="7" class="blue focus phase-1" />
    <text x="431" y="103" class="note ink">Item 2</text>
    <text x="431" y="127" class="note ink">Unseen</text>
  </g>
  <g class="tile">
    <rect x="489" y="79" width="92" height="67" rx="7" class="blue focus phase-2" />
    <text x="535" y="103" class="note ink">Item 3</text>
    <text x="535" y="127" class="note ink">Unseen</text>
  </g>
  <g class="tile">
    <rect x="593" y="79" width="92" height="67" rx="7" class="blue focus phase-3" />
    <text x="639" y="103" class="note ink">Item 4</text>
    <text x="639" y="127" class="note ink">Unseen</text>
  </g>
  <text x="468" y="190" class="note">Positive–negative training pairs</text>
</svg>
