<svg xmlns="http://www.w3.org/2000/svg" width="720" height="217" viewBox="0 0 720 217" role="img" aria-labelledby="title desc">
  <title id="title">Bottle inspection workflow</title>
  <desc id="desc">A camera captures an image and a fine-tuned CNN scores it. Confident scores produce an automatic OK or defect decision. Uncertain scores go to an inspector.</desc>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle;
      fill: #0f172a; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-weight: 650; }
    .small { font-size: 14px; fill: #334155; }
    .tile, .violet, .green, .amber { stroke-width: 1.5; }
    .tile { fill: #dbeafe; stroke: #4169a9; }
    .violet { fill: #ede9fe; stroke: #6d4ba3; }
    .green { fill: #d1fae5; stroke: #16835e; }
    .amber { fill: #fef3c7; stroke: #a16207; }
    .arrow, .axis { fill: none; stroke: #64748b; stroke-width: 2; }
    .arrowhead { fill: #64748b; }
    .grid { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .small { fill: #e2e8f0; }
      .on-tile text { fill: #0f172a; }
      .on-tile .small { fill: #334155; }
      .arrow, .axis { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
    .curve { fill: none; stroke: #315a9c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .step .tile { animation: highlight 5.680000000000001s infinite; }
    .step-2 .tile { animation-delay: 1.6s; }
    .step-3 .tile { animation-delay: 3.2s; }
    @keyframes highlight {
      0%, 28.17%, 100% { fill: #dbeafe; stroke: #4169a9; }
      5.07%, 22.54% { fill: #fde68a; stroke: #a16207; }
    }
    @media (prefers-reduced-motion: reduce) { .step .tile { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="360" y="34" class="heading">Bottle inspection workflow</text>
  <path d="M175 131 H218" class="arrow" marker-end="url(#arrow)"/>
  <path d="M394 131 H425 L466 94 H498" class="arrow" marker-end="url(#arrow)"/>
  <path d="M425 131 L466 167 H498" class="arrow" marker-end="url(#arrow)"/>
  <g class="step step-1 on-tile">
    <rect x="22" y="91" width="152" height="80" rx="8" class="tile"/>
    <text x="98" y="122" class="label">Camera</text>
    <text x="98" y="147" class="small">Bottle photo</text>
  </g>
  <g class="step step-2 on-tile">
    <rect x="222" y="91" width="171" height="80" rx="8" class="tile"/>
    <text x="307" y="122" class="label">Fine-tuned CNN</text>
    <text x="307" y="147" class="small">Defect score</text>
  </g>
  <g class="step step-3 on-tile">
    <rect x="501" y="61" width="197" height="62" rx="8" class="tile"/>
    <text x="599" y="86" class="label">Confident score</text>
    <text x="599" y="108" class="small">Mark OK or defect</text>
    <rect x="501" y="139" width="197" height="62" rx="8" class="tile"/>
    <text x="599" y="164" class="label">Uncertain score</text>
    <text x="599" y="186" class="small">Send to a human inspector</text>
  </g>
</svg>
