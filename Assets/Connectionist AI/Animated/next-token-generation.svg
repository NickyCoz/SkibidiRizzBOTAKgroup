<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
  <title id="title">Autoregressive text generation</title>
  <desc id="desc">A model predicts the next token from a prefix. The chosen token becomes part of the prefix for the next prediction.</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #263449; }
    .title { font-size: 22px; font-weight: 700; fill: #172554; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .num { font-size: 19px; font-weight: 700; }
    .tile text { fill: #18243a; }
    .edge { fill: none; stroke: #74849b; stroke-width: 2; }
    .guide { fill: none; stroke: #74849b; stroke-width: 1; stroke-dasharray: 4 5; }
    .blue { fill: #dbeafe; stroke: #477fc0; }
    .violet { fill: #ede9fe; stroke: #8864cb; }
    .green { fill: #d1fae5; stroke: #19936c; }
    .amber { fill: #ffedd5; stroke: #bd6a26; }
    .blue, .violet, .green, .amber { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .title { fill: #f1f5ff; }
      .edge { stroke: #94a3b8; }
    }
    .blue-line { fill: none; stroke: #3b89ce; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet-line { fill: none; stroke: #9571d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green-line { fill: none; stroke: #22a87e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .amber-line { fill: none; stroke: #d88835; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: none; stroke: #bc70ed; stroke-width: 4; stroke-dasharray: 8 14; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
    .flow { fill: none; stroke: #a864db; stroke-width: 4; stroke-dasharray: 7 13; animation: move 2s linear infinite; }
    @keyframes move { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#74849b"/>
    </marker>
  </defs>
  <text x="360" y="28" class="title">Autoregressive text generation</text>
  <text x="130" y="61" class="label">Current prefix</text>
  <g class="tile">
    <rect x="47" y="75" width="169" height="36" rx="12" class="blue"/>
    <text x="131.5" y="98" class="label">The robot</text>
  </g>
  <path d="M222 93L276 93" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="282" y="75" width="155" height="36" rx="12" class="violet"/>
    <text x="359.5" y="98" class="label">Next-token model</text>
  </g>
  <path d="M443 93L491 93" class="edge" marker-end="url(#arrow)"/>
  <g class="tile">
    <rect x="497" y="75" width="176" height="36" rx="12" class="green"/>
    <text x="585" y="98" class="label">Choose “turns”</text>
  </g>
  <path d="M585 116V151H132V115" class="edge" marker-end="url(#arrow)"/>
  <path d="M585 116V151H132V115" class="flow"/>
  <text x="360" y="188" class="note">Next prefix: The robot turns</text>
</svg>
