<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Notebooks left over or customers unserved</title><desc id="desc">Three outcomes start with four notebooks. Demand two leaves two unsold and costs four; demand four costs zero; demand six leaves two missed sales and costs ten.</desc><style>
