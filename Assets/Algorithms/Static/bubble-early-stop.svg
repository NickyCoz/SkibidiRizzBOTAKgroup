<svg xmlns="http://www.w3.org/2000/svg" width="640" height="177" viewBox="0 0 640 177" role="img" aria-labelledby="title desc">
<title id="title">Stop when a full pass makes no swaps</title><desc id="desc">For already sorted input, the optimized bubble sort stops after one pass.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">Stop when a full pass makes no swaps</text>
<rect class="tile" x="55.0" y="70" width="90" height="40" rx="7"/><text class="ink" x="100" y="96">55</text><rect class="tile" x="165.0" y="70" width="90" height="40" rx="7"/><text class="ink" x="210" y="96">65</text><rect class="tile" x="275.0" y="70" width="90" height="40" rx="7"/><text class="ink" x="320" y="96">75</text><rect class="tile" x="385.0" y="70" width="90" height="40" rx="7"/><text class="ink" x="430" y="96">85</text><rect class="tile" x="495.0" y="70" width="90" height="40" rx="7"/><text class="ink" x="540" y="96">95</text><text class="label" x="320" y="145">4 neighboring comparisons. 0 swaps. Stop after this pass.</text>
</svg>
