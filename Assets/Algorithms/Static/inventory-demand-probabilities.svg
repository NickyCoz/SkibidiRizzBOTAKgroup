<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title desc"><title id="title">Probabilities of notebook demand</title><desc id="desc">Bars show probabilities 30 percent for demand two, 50 percent for demand four, and 20 percent for demand six.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Possible demand</text><text x="24" y="57" class="small muted" text-anchor="start" xml:space="preserve">Illustrative probabilities.</text><path class="rule" d="M92 286 L700 286" /><text x="35" y="97" class="small muted" text-anchor="start" xml:space="preserve">Probability</text><rect x="160" y="196" width="90" height="90" rx="0" class="blue" /><text x="205" y="178" class="strong" text-anchor="middle" xml:space="preserve">30%</text><text x="205" y="320" class="strong" text-anchor="middle" xml:space="preserve">2 notebooks</text><rect x="360" y="136" width="90" height="150" rx="0" class="green" /><text x="405" y="118" class="strong" text-anchor="middle" xml:space="preserve">50%</text><text x="405" y="320" class="strong" text-anchor="middle" xml:space="preserve">4 notebooks</text><rect x="560" y="226" width="90" height="60" rx="0" class="blue" /><text x="605" y="208" class="strong" text-anchor="middle" xml:space="preserve">20%</text><text x="605" y="320" class="strong" text-anchor="middle" xml:space="preserve">6 notebooks</text></svg>