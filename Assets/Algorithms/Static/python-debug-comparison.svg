<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tracing a logical error</title><desc id="desc">A table evaluates the less-than-five and greater-than-five conditions for three, seven, two, and nine, showing why only the latter matches the printed label.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Find the logical error</text><text x="35" y="85" class="mono" text-anchor="start" xml:space="preserve">numbers = [3, 7, 2, 9]</text><rect x="35" y="110" width="690" height="175" rx="5" class="paper" /><text x="47.0" y="134" class="strong" text-anchor="start" xml:space="preserve">number</text><text x="277.0" y="134" class="strong" text-anchor="start" xml:space="preserve">number &lt; 5</text><text x="507.0" y="134" class="strong" text-anchor="start" xml:space="preserve">number &gt; 5</text><path class="rule" d="M35 145 L725 145" /><text x="47.0" y="169" class="mono" text-anchor="start" xml:space="preserve">3</text><text x="277.0" y="169" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="169" class="mono" text-anchor="start" xml:space="preserve">False</text><path class="rule" d="M35 180 L725 180" /><text x="47.0" y="204" class="mono" text-anchor="start" xml:space="preserve">7</text><text x="277.0" y="204" class="mono" text-anchor="start" xml:space="preserve">False</text><text x="507.0" y="204" class="mono" text-anchor="start" xml:space="preserve">True</text><path class="rule" d="M35 215 L725 215" /><text x="47.0" y="239" class="mono" text-anchor="start" xml:space="preserve">2</text><text x="277.0" y="239" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="239" class="mono" text-anchor="start" xml:space="preserve">False</text><path class="rule" d="M35 250 L725 250" /><text x="47.0" y="274" class="mono" text-anchor="start" xml:space="preserve">9</text><text x="277.0" y="274" class="mono" text-anchor="start" xml:space="preserve">False</text><text x="507.0" y="274" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="35" y="335" class="amberText strong" text-anchor="start" xml:space="preserve">Wrong test: 3 and 2.</text><text x="35" y="369" class="greenText strong" text-anchor="start" xml:space="preserve">Correct test: 7 and 9.</text></svg>