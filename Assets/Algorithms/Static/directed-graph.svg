<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-labelledby="title desc">
<title id="title">A directed graph follows arrow directions</title><desc id="desc">A can reach C through B. These arrows provide no route back to A.</desc>
<style>
