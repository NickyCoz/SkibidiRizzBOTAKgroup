@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">DP state table</text><rect x="35" y="97" width="255" height="48" rx="0" class="paper" /><rect x="35" y="145" width="255" height="48" rx="0" class="paper" /><rect x="35" y="193" width="255" height="48" rx="0" class="paper" /><rect x="35" y="241" width="255" height="48" rx="0" class="paper" /><rect x="35" y="289" width="255" height="48" rx="0" class="paper" /><rect x="290" y="97" width="145" height="48" rx="0" class="paper" /><rect x="290" y="145" width="145" height="48" rx="0" class="paper" /><rect x="290" y="193" width="145" height="48" rx="0" class="paper" /><rect x="290" y="241" width="145" height="48" rx="0" class="paper" /><rect x="290" y="289" width="145" height="48" rx="0" class="paper" /><rect x="435" y="97" width="145" height="48" rx="0" class="paper" /><rect x="435" y="145" width="145" height="48" rx="0" class="paper" /><rect x="435" y="193" width="145" height="48" rx="0" class="paper" /><rect x="435" y="241" width="145" height="48" rx="0" class="paper" /><rect x="435" y="289" width="145" height="48" rx="0" class="paper" /><rect x="580" y="97" width="145" height="48" rx="0" class="paper" /><rect x="580" y="145" width="145" height="48" rx="0" class="paper" /><rect x="580" y="193" width="145" height="48" rx="0" class="paper" /><rect x="580" y="241" width="145" height="48" rx="0" class="paper" /><rect x="580" y="289" width="145" height="48" rx="0" class="paper" /><text x="49" y="128" class="strong" text-anchor="start" xml:space="preserve">Next day</text><text x="304" y="128" class="strong" text-anchor="start" xml:space="preserve">0 passes</text><text x="449" y="128" class="strong" text-anchor="start" xml:space="preserve">1 pass</text><text x="594" y="128" class="strong" text-anchor="start" xml:space="preserve">2 passes</text><text x="49" y="176" class="mono" text-anchor="start" xml:space="preserve">Day 1 (0)</text><text x="49" y="224" class="mono" text-anchor="start" xml:space="preserve">Day 2 (1)</text><text x="49" y="272" class="mono" text-anchor="start" xml:space="preserve">Day 3 (2)</text><text x="49" y="320" class="mono" text-anchor="start" xml:space="preserve">No days (3)</text><text x="362" y="176" class="strong" text-anchor="middle" xml:space="preserve">0</text><text x="507" y="176" class="strong" text-anchor="middle" xml:space="preserve">10</text><text x="652" y="176" class="strong" text-anchor="middle" xml:space="preserve">16</text><text x="362" y="224" class="strong" text-anchor="middle" xml:space="preserve">0</text><text x="507" y="224" class="strong" text-anchor="middle" xml:space="preserve">10</text><text x="652" y="224" class="strong" text-anchor="middle" xml:space="preserve">16</text><text x="362" y="272" class="strong" text-anchor="middle" xml:space="preserve">0</text><text x="507" y="272" class="strong" text-anchor="middle" xml:space="preserve">10</text><text x="652" y="272" class="strong" text-anchor="middle" xml:space="preserve">10</text><text x="362" y="320" class="strong" text-anchor="middle" xml:space="preserve">0</text><text x="507" y="320" class="strong" text-anchor="middle" xml:space="preserve">0</text><text x="652" y="320" class="strong" text-anchor="middle" xml:space="preserve">0</text><rect x="581" y="146" width="143" height="46" rx="0" class="blank" /><text x="35" y="399" class="strong" text-anchor="start" xml:space="preserve">At best(0, 2): Skip = 16; Use = 5 + 10 = 15. Choose 16.</text><text x="35" y="446" class="small muted" text-anchor="start" xml:space="preserve">Recurrence table; the code uses recursion + caching.</text></svg>