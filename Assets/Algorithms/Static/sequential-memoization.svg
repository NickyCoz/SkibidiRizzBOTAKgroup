<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Two paths share a memoized state</title><desc id="desc">Skipping Day one then using Day two, or using Day one then skipping Day two, both reach best(2,1). Its cached future value is ten.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Memoized states</text><text x="24" y="57" class="small muted" text-anchor="start" xml:space="preserve">Partial dependency graph.</text><ellipse cx="380" cy="105" rx="93" ry="34" class="blue" /><text x="380" y="111" class="mono" text-anchor="middle" xml:space="preserve">best(0, 2)</text><ellipse cx="150" cy="244" rx="93" ry="34" class="blue" /><text x="150" y="250" class="mono" text-anchor="middle" xml:space="preserve">best(1, 2)</text><ellipse cx="610" cy="244" rx="93" ry="34" class="blue" /><text x="610" y="250" class="mono" text-anchor="middle" xml:space="preserve">best(1, 1)</text><ellipse cx="380" cy="378" rx="93" ry="34" class="green" /><text x="380" y="384" class="mono" text-anchor="middle" xml:space="preserve">best(2, 1)</text><path d="M316 132 L191 211" class="edge" marker-end="url(#arrow)" /><path d="M444 132 L569 211" class="edge" marker-end="url(#arrow)" /><path d="M192 276 L315 348" class="edge" marker-end="url(#arrow)" /><path d="M568 276 L445 348" class="edge" marker-end="url(#arrow)" /><text x="155" y="158" class="small" text-anchor="start" xml:space="preserve">Skip Day 1</text><text x="509" y="158" class="small" text-anchor="start" xml:space="preserve">Use Day 1: +5</text><text x="86" y="334" class="small" text-anchor="start" xml:space="preserve">Use Day 2: +6</text><text x="557" y="334" class="small" text-anchor="start" xml:space="preserve">Skip Day 2</text><text x="380" y="450" class="greenText strong" text-anchor="middle" xml:space="preserve">Cached best(2, 1) = 10</text></svg>