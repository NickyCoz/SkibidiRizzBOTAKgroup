<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">The matching branch in a Python conditional</title><desc id="desc">The first comparison is false, the second true, and only the indented warm print statement runs.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Conditional execution</text><text x="42" y="98" class="mono" text-anchor="start" xml:space="preserve">if temperature &gt; 30:</text><text x="42" y="133" class="mono" text-anchor="start" xml:space="preserve">    print("It's hot!")</text><rect x="30" y="145" width="475" height="32" rx="0" class="green" /><text x="42" y="168" class="mono" text-anchor="start" xml:space="preserve">elif temperature == 30:</text><rect x="30" y="180" width="475" height="32" rx="0" class="green" /><text x="42" y="203" class="mono" text-anchor="start" xml:space="preserve">    print("It's warm!")</text><text x="42" y="238" class="mono" text-anchor="start" xml:space="preserve">else:</text><text x="42" y="273" class="mono" text-anchor="start" xml:space="preserve">    print("It's cool!")</text><text x="540" y="98" class="small" text-anchor="start" xml:space="preserve">30 &gt; 30: False</text><text x="540" y="168" class="small greenText" text-anchor="start" xml:space="preserve">30 == 30: True</text><text x="540" y="238" class="small muted" text-anchor="start" xml:space="preserve">else is skipped</text><text x="35" y="343" class="strong" text-anchor="start" xml:space="preserve">Output: It's warm!</text></svg>