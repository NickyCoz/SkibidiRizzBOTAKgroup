<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-labelledby="title desc">
<title id="title">An unweighted graph counts edges equally</title><desc id="desc">No costs are attached. A → B is one step, while A → C → B is two.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">An unweighted graph counts edges equally</text>
<path class="edge" d="M158.0 100.0 L450.0 100.0"/><path class="edge" d="M153.6340538634986 113.48228603064899 L284.74559362663194 208.3453412710337"/><path class="edge" d="M323.6340538634986 209.517713969351 L454.74559362663194 114.6546587289663"/><circle class="tile" cx="135" cy="100" r="23"/><text class="ink" x="135" y="106">A</text><circle class="tile" cx="475" cy="100" r="23"/><text class="ink" x="475" y="106">B</text><circle class="tile" cx="305" cy="223" r="23"/><text class="ink" x="305" y="229">C</text><text class="label small" x="320" y="286">No costs are attached. A → B is one step, while A → C → B is two.</text>
</svg>
