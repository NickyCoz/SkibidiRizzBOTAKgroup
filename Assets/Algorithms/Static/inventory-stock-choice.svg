</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Compare stock quantities</text><text x="35" y="128" class="strong" text-anchor="start" xml:space="preserve">Stock 2</text><rect x="150" y="100" width="477.0" height="42" rx="0" class="blue" /><text x="642.0" y="128" class="strong" text-anchor="start" xml:space="preserve">9.0</text><text x="35" y="213" class="strong" text-anchor="start" xml:space="preserve">Stock 4</text><rect x="150" y="185" width="169.60000000000002" height="42" rx="0" class="green" /><text x="334.6" y="213" class="strong" text-anchor="start" xml:space="preserve">3.2</text><text x="35" y="298" class="strong" text-anchor="start" xml:space="preserve">Stock 6</text><rect x="150" y="270" width="233.20000000000002" height="42" rx="0" class="blue" /><text x="398.20000000000005" y="298" class="strong" text-anchor="start" xml:space="preserve">4.4</text></svg>