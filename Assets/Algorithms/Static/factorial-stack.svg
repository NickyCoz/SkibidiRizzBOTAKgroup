<svg xmlns="http://www.w3.org/2000/svg" width="640" height="286" viewBox="0 0 640 286" role="img" aria-labelledby="title desc">
<title id="title">The newest call is on top</title><desc id="desc">At the base case, factorial(1) finishes before the calls waiting below it.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">The newest call is on top</text>
<rect class="tile focus" x="207.5" y="55" width="225" height="40" rx="7"/><text class="ink" x="320" y="81">factorial(1)</text><rect class="tile" x="207.5" y="99" width="225" height="40" rx="7"/><text class="ink" x="320" y="125">factorial(2)</text><rect class="tile" x="207.5" y="143" width="225" height="40" rx="7"/><text class="ink" x="320" y="169">factorial(3)</text><rect class="tile" x="207.5" y="187" width="225" height="40" rx="7"/><text class="ink" x="320" y="213">factorial(4)</text><rect class="tile" x="207.5" y="231" width="225" height="40" rx="7"/><text class="ink" x="320" y="257">factorial(5)</text><text class="label" x="112" y="80">Top · finish first</text><text class="label" x="112" y="256">Bottom</text>
</svg>
