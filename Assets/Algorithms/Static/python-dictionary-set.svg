<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Dictionary lookup and set membership</title><desc id="desc">A key-value table selects B and value four. The set contains A and B, so membership of A is true. Positions in the set illustration are not indexes.</desc><style>
