</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Dictionaries and sets</text><text x="35" y="86" class="mono strong" text-anchor="start" xml:space="preserve">distances</text><rect x="35" y="106" width="340" height="140" rx="5" class="paper" /><text x="47.0" y="130" class="strong" text-anchor="start" xml:space="preserve">Key</text><text x="217.0" y="130" class="strong" text-anchor="start" xml:space="preserve">Value</text><path class="rule" d="M35 141 L375 141" /><text x="47.0" y="165" class="mono" text-anchor="start" xml:space="preserve">A</text><text x="217.0" y="165" class="mono" text-anchor="start" xml:space="preserve">0</text><rect x="36" y="176" width="338" height="35" rx="0" class="green" /><path class="rule" d="M35 176 L375 176" /><text x="47.0" y="200" class="mono" text-anchor="start" xml:space="preserve">B</text><text x="217.0" y="200" class="mono" text-anchor="start" xml:space="preserve">4</text><path class="rule" d="M35 211 L375 211" /><text x="47.0" y="235" class="mono" text-anchor="start" xml:space="preserve">C</text><text x="217.0" y="235" class="mono" text-anchor="start" xml:space="preserve">7</text><text x="35" y="291" class="mono" text-anchor="start" xml:space="preserve">distances["B"] is 4</text><text x="35" y="324" class="mono" text-anchor="start" xml:space="preserve">Update: distances["C"] = 5</text><text x="450" y="86" class="mono strong" text-anchor="start" xml:space="preserve">visited</text><ellipse cx="570" cy="184" rx="125" ry="83" class="green" /><text x="523" y="177" class="large" text-anchor="middle" xml:space="preserve">A</text><text x="617" y="215" class="large" text-anchor="middle" xml:space="preserve">B</text><text x="437" y="291" class="mono" text-anchor="start" xml:space="preserve">"A" in visited: True</text></svg>