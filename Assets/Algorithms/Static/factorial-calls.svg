<svg xmlns="http://www.w3.org/2000/svg" width="640" height="335" viewBox="0 0 640 335" role="img" aria-labelledby="title desc">
<title id="title">Recursive calls move toward the base case</title><desc id="desc">Each call reduces n by one until factorial(1) returns 1.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">Recursive calls move toward the base case</text>
<rect class="tile" x="110.0" y="48" width="150" height="40" rx="7"/><text class="ink" x="185" y="74">factorial(5)</text><text class="label" x="416" y="73">5 × factorial(4)</text><path class="route" d="M185 90 L185 101"/><path class="route" d="M181.1 92.9 L185 101 L188.9 92.9"/><rect class="tile" x="110.0" y="105" width="150" height="40" rx="7"/><text class="ink" x="185" y="131">factorial(4)</text><text class="label" x="416" y="130">4 × factorial(3)</text><path class="route" d="M185 147 L185 158"/><path class="route" d="M181.1 149.9 L185 158 L188.9 149.9"/><rect class="tile" x="110.0" y="162" width="150" height="40" rx="7"/><text class="ink" x="185" y="188">factorial(3)</text><text class="label" x="416" y="187">3 × factorial(2)</text><path class="route" d="M185 204 L185 215"/><path class="route" d="M181.1 206.9 L185 215 L188.9 206.9"/><rect class="tile" x="110.0" y="219" width="150" height="40" rx="7"/><text class="ink" x="185" y="245">factorial(2)</text><text class="label" x="416" y="244">2 × factorial(1)</text><path class="route" d="M185 261 L185 272"/><path class="route" d="M181.1 263.9 L185 272 L188.9 263.9"/><rect class="tile" x="110.0" y="276" width="150" height="40" rx="7"/><text class="ink" x="185" y="302">factorial(1)</text><text class="label" x="416" y="301">Base case returns 1</text>
</svg>
