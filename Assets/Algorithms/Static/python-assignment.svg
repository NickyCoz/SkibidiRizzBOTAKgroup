<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc"><title id="title">A variable name before and after reassignment</title><desc id="desc">The label score refers to 10 before the update and 15 afterward. Assignment is distinguished from comparison.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Variable assignment</text><text x="35" y="92" class="mono" text-anchor="start" xml:space="preserve">Before: score = 10</text><text x="415" y="92" class="mono" text-anchor="start" xml:space="preserve">After: score = score + 5</text><path d="M35 130 H123 L143 151 L123 172 H35 Z" class="green" /><text x="75" y="157" class="strong" text-anchor="middle" xml:space="preserve">score</text><path d="M150 151 H213" class="edge" marker-end="url(#arrow)" /><rect x="227" y="127" width="88" height="48" rx="5" class="blue" /><text x="271.0" y="157.0" class="strong" text-anchor="middle" xml:space="preserve">10</text><path d="M415 130 H503 L523 151 L503 172 H415 Z" class="green" /><text x="455" y="157" class="strong" text-anchor="middle" xml:space="preserve">score</text><path d="M530 151 H593" class="edge" marker-end="url(#arrow)" /><rect x="607" y="127" width="88" height="48" rx="5" class="blue" /><text x="651.0" y="157.0" class="strong" text-anchor="middle" xml:space="preserve">15</text></svg>