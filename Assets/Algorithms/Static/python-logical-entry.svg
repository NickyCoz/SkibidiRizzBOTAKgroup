<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Two conditions for entry</title><desc id="desc">A person aged 20 holds a ticket beside an entry gate. Both age at least 18 and ticket possession are true.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">An AND condition</text><circle cx="90" cy="127" r="9" class="paper" /><path d="M90 137 V167 M77 150 H103 M90 167 L78 184 M90 167 L102 184" class="inkLine" /><text x="90" y="223" class="strong" text-anchor="middle" xml:space="preserve">Age: 20</text><path d="M124 144 H179 V155.0 Q171 159.0 179 163.0 V174 H124 V163.0 Q132 159.0 124 155.0 Z" class="green" /><path class="dash" d="M167 148 L167 170" /><text x="35" y="270" class="greenText strong" text-anchor="start" xml:space="preserve">20 &gt;= 18: True</text><path d="M400 255 V103 Q510 20 620 103 V255" class="edge" /><path class="edge" d="M399 165 L620 165" /><path class="edge" d="M399 210 L620 210" /><text x="510" y="105" class="strong" text-anchor="middle" xml:space="preserve">ENTRY</text><text x="510" y="300" class="large greenText" text-anchor="middle" xml:space="preserve">Entry allowed</text><text x="35" y="307" class="greenText strong" text-anchor="start" xml:space="preserve">has_ticket: True</text><text x="35" y="354" class="mono" text-anchor="start" xml:space="preserve">True and True = True</text></svg>