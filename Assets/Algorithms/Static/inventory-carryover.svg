<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title desc"><title id="title">A notebook carried over into tomorrow</title><desc id="desc">A before-and-after calendar illustration follows one unsold notebook from today into tomorrow, illustrating why inventory decisions link days.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Stock carries over</text><rect x="70" y="87" width="230" height="170" rx="5" class="paper" /><rect x="70" y="87" width="230" height="32" rx="5" class="blue" /><path class="edge" d="M90 81 L90 96" /><path class="edge" d="M280 81 L280 96" /><text x="185.0" y="110" class="strong" text-anchor="middle" xml:space="preserve">Today</text><text x="185.0" y="156" class="strong" text-anchor="middle" xml:space="preserve">After sales</text><rect x="450" y="87" width="230" height="170" rx="5" class="paper" /><rect x="450" y="87" width="230" height="32" rx="5" class="blue" /><path class="edge" d="M470 81 L470 96" /><path class="edge" d="M660 81 L660 96" /><text x="565.0" y="110" class="strong" text-anchor="middle" xml:space="preserve">Tomorrow</text><text x="565.0" y="156" class="strong" text-anchor="middle" xml:space="preserve">Before new orders</text><rect x="160" y="173" width="40" height="62" rx="2" class="blue" /><path class="rule" d="M165 173 L165 235" /><path class="rule" d="M169 230 L197 230" /><rect x="540" y="173" width="40" height="62" rx="2" class="green" /><path class="rule" d="M545 173 L545 235" /><path class="rule" d="M549 230 L577 230" /><path d="M220 207 C310 269 410 269 485 207" class="edge" marker-end="url(#arrow)" /><text x="70" y="303" class="small" text-anchor="start" xml:space="preserve">One unsold notebook</text><text x="450" y="303" class="small" text-anchor="start" xml:space="preserve">The same notebook remains</text><text x="35" y="357" class="mono strong" text-anchor="start" xml:space="preserve">State: (day, current_stock)</text></svg>