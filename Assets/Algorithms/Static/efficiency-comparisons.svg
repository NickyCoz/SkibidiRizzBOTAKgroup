<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
<title id="title">Count the work, not the clock time</title><desc id="desc">The shown inputs need 4, 9, and 10 comparisons respectively.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">Count the work, not the clock time</text>
<text class="label" x="118" y="80">Sorted input</text><rect class="tile focus" x="225" y="61" width="100" height="29" rx="4"/><text class="label" x="505" y="80">4</text><text class="label" x="118" y="139">Random example</text><rect class="tile focus" x="225" y="120" width="225" height="29" rx="4"/><text class="label" x="505" y="139">9</text><text class="label" x="118" y="198">Reverse sorted</text><rect class="tile focus" x="225" y="179" width="250" height="29" rx="4"/><text class="label" x="505" y="198">10</text><text class="label small" x="320" y="248">Comparisons made by optimized bubble sort on the five-item examples.</text>
</svg>
