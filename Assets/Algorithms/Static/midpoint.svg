<svg xmlns="http://www.w3.org/2000/svg" width="640" height="179" viewBox="0 0 640 179" role="img" aria-labelledby="title desc">
<title id="title">Find the middle index</title><desc id="desc">Use the integer midpoint of the left and right index bounds.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">Find the middle index</text>
<rect class="tile" x="82.5" y="72" width="135" height="40" rx="7"/><text class="ink" x="150" y="98">left = 0</text><rect class="tile" x="422.5" y="72" width="135" height="40" rx="7"/><text class="ink" x="490" y="98">right = 6</text><text class="label" x="320" y="147">mid = (0 + 6) // 2 = 3</text><path class="route" d="M220 92 L420 92"/><text class="label small" x="320" y="90">Index range</text>
</svg>
