<svg xmlns="http://www.w3.org/2000/svg" width="640" height="335" viewBox="0 0 640 335" role="img" aria-labelledby="title desc">
<title id="title">Return values finish the waiting calls</title><desc id="desc">1 returns first. Waiting multiplications produce 2, 6, 24, then 120.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<text class="label heading" x="320" y="29">Return values finish the waiting calls</text>
<rect class="tile focus" x="188.0" y="49" width="264" height="40" rx="7"/><text class="ink" x="320" y="75">factorial(1) returns 1</text><path class="route" d="M320 91 L320 102"/><path class="route" d="M316.1 93.9 L320 102 L323.9 93.9"/><rect class="tile focus" x="188.0" y="106" width="264" height="40" rx="7"/><text class="ink" x="320" y="132">factorial(2) returns 2</text><path class="route" d="M320 148 L320 159"/><path class="route" d="M316.1 150.9 L320 159 L323.9 150.9"/><rect class="tile focus" x="188.0" y="163" width="264" height="40" rx="7"/><text class="ink" x="320" y="189">factorial(3) returns 6</text><path class="route" d="M320 205 L320 216"/><path class="route" d="M316.1 207.9 L320 216 L323.9 207.9"/><rect class="tile focus" x="188.0" y="220" width="264" height="40" rx="7"/><text class="ink" x="320" y="246">factorial(4) returns 24</text><path class="route" d="M320 262 L320 273"/><path class="route" d="M316.1 264.9 L320 273 L323.9 264.9"/><rect class="tile focus" x="188.0" y="277" width="264" height="40" rx="7"/><text class="ink" x="320" y="303">factorial(5) returns 120</text>
</svg>
