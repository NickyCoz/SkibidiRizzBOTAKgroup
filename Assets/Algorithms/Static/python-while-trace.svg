<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">While loop trace including the stop condition</title><desc id="desc">A trace table checks count values zero through five. Values zero through four print; five makes the condition false.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">while count &lt; 5</text><rect x="35" y="79" width="690" height="245" rx="5" class="paper" /><text x="47.0" y="103" class="strong" text-anchor="start" xml:space="preserve">count</text><text x="277.0" y="103" class="strong" text-anchor="start" xml:space="preserve">count &lt; 5</text><text x="507.0" y="103" class="strong" text-anchor="start" xml:space="preserve">Print?</text><path class="rule" d="M35 114 L725 114" /><text x="47.0" y="138" class="mono" text-anchor="start" xml:space="preserve">0</text><text x="277.0" y="138" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="138" class="mono" text-anchor="start" xml:space="preserve">0</text><path class="rule" d="M35 149 L725 149" /><text x="47.0" y="173" class="mono" text-anchor="start" xml:space="preserve">1</text><text x="277.0" y="173" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="173" class="mono" text-anchor="start" xml:space="preserve">1</text><path class="rule" d="M35 184 L725 184" /><text x="47.0" y="208" class="mono" text-anchor="start" xml:space="preserve">2</text><text x="277.0" y="208" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="208" class="mono" text-anchor="start" xml:space="preserve">2</text><path class="rule" d="M35 219 L725 219" /><text x="47.0" y="243" class="mono" text-anchor="start" xml:space="preserve">3</text><text x="277.0" y="243" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="243" class="mono" text-anchor="start" xml:space="preserve">3</text><path class="rule" d="M35 254 L725 254" /><text x="47.0" y="278" class="mono" text-anchor="start" xml:space="preserve">4</text><text x="277.0" y="278" class="mono" text-anchor="start" xml:space="preserve">True</text><text x="507.0" y="278" class="mono" text-anchor="start" xml:space="preserve">4</text><rect x="36" y="289" width="688" height="35" rx="0" class="green" /><path class="rule" d="M35 289 L725 289" /><text x="47.0" y="313" class="mono" text-anchor="start" xml:space="preserve">5</text><text x="277.0" y="313" class="mono" text-anchor="start" xml:space="preserve">False</text><text x="507.0" y="313" class="mono" text-anchor="start" xml:space="preserve">Stop</text><text x="35" y="365" class="strong" text-anchor="start" xml:space="preserve">After each print: count += 1.</text></svg>