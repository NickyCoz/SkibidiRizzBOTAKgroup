ight="43" rx="2" class="blue" /><path class="rule" d="M594 132 L594 175" /><path class="rule" d="M598 170 L613 170" /><rect x="642" y="132" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M647 132 L647 175" /><path class="rule" d="M651 170 L666 170" /><rect x="430" y="191" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M435 191 L435 234" /><path class="rule" d="M439 229 L454 229" /><rect x="483" y="191" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M488 191 L488 234" /><path class="rule" d="M492 229 L507 229" /><rect x="536" y="191" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M541 191 L541 234" /><path class="rule" d="M545 229 L560 229" /><rect x="589" y="191" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M594 191 L594 234" /><path class="rule" d="M598 229 L613 229" /><rect x="642" y="191" width="27" height="43" rx="2" class="blue" /><path class="rule" d="M647 191 L647 234" /><path class="rule" d="M651 229 L666 229" /><path class="rule" d="M415 247 L720 247" /><text x="415" y="291" class="strong" text-anchor="start" xml:space="preserve">Possible demand: low or high</text><text x="415" y="327" class="small muted" text-anchor="start" xml:space="preserve">Stock and costs vary with demand.</text></svg>