<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Notebooks move from shelf to customers</title><desc id="desc">Four notebooks leave stock one at a time and reach the first four of six customers. Two customers remain unserved; the missed-sales cost is ten.</desc><style>
