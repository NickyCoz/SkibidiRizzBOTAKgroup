idth="24" height="34" rx="2" class="green" /><path class="rule" d="M332 249 L332 283" /><path class="rule" d="M336 278 L348 278" /><rect x="437" y="249" width="24" height="34" rx="2" class="green" /><path class="rule" d="M442 249 L442 283" /><path class="rule" d="M446 278 L458 278" /></svg>