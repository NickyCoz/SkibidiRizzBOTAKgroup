<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Updating an element and appending to a Python list</title><desc id="desc">The original list is eight, three, five, one. Ten replaces index one; seven moves into the new final slot at index four.</desc><style>
