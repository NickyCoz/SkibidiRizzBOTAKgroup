" y="291" width="64" height="48" rx="5" class="blue" /><text x="332.0" y="321.0" class="strong" text-anchor="middle" xml:space="preserve">5</text><text x="332" y="277" class="small muted" text-anchor="middle" xml:space="preserve">2</text><rect x="400" y="291" width="64" height="48" rx="5" class="blue" /><text x="432.0" y="321.0" class="strong" text-anchor="middle" xml:space="preserve">1</text><text x="432" y="277" class="small muted" text-anchor="middle" xml:space="preserve">3</text><rect x="500" y="291" width="64" height="48" rx="5" class="blue" /><text x="532.0" y="321.0" class="strong" text-anchor="middle" xml:space="preserve">7</text><text x="532" y="277" class="small muted" text-anchor="middle" xml:space="preserve">4</text><text x="35" y="404" class="small muted" text-anchor="start" xml:space="preserve">New index: 4. Length: 5.</text></svg>