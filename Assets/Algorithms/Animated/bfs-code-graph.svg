<svg xmlns="http://www.w3.org/2000/svg" width="640" height="358" viewBox="0 0 640 358" role="img" aria-labelledby="title desc">
<title id="title">The BFS code discovers each node once</title><desc id="desc">Gold signals follow edges from each node to its newly discovered neighbors.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}

.signal-0 { visibility:hidden; animation:signal-0 12s linear infinite; } @keyframes signal-0 { 0%,8% { visibility:hidden;transform:translate(100px,80px); } 8.01% { visibility:visible;transform:translate(100px,80px); } 15% { visibility:visible;transform:translate(285px,80px); } 15.01%,100% { visibility:hidden;transform:translate(285px,80px); } }.arrived-0 { stroke-dasharray:176;stroke-dashoffset:0;animation:ring-0 12s infinite; } @keyframes ring-0 { 0%,15% { stroke-dashoffset:176; } 19%,100% { stroke-dashoffset:0; } }.signal-1 { visibility:hidden; animation:signal-1 12s linear infinite; } @keyframes signal-1 { 0%,18% { visibility:hidden;transform:translate(100px,80px); } 18.01% { visibility:visible;transform:translate(100px,80px); } 25% { visibility:visible;transform:translate(475px,80px); } 25.01%,100% { visibility:hidden;transform:translate(475px,80px); } }.arrived-1 { stroke-dasharray:176;stroke-dashoffset:0;animation:ring-1 12s infinite; } @keyframes ring-1 { 0%,25% { stroke-dashoffset:176; } 29%,100% { stroke-dashoffset:0; } }.signal-2 { visibility:hidden; animation:signal-2 12s linear infinite; } @keyframes signal-2 { 0%,28% { visibility:hidden;transform:translate(285px,80px); } 28.01% { visibility:visible;transform:translate(285px,80px); } 35% { visibility:visible;transform:translate(150px,235px); } 35.01%,100% { visibility:hidden;transform:translate(150px,235px); } }.arrived-2 { stroke-dasharray:176;stroke-dashoffset:0;animation:ring-2 12s infinite; } @keyframes ring-2 { 0%,35% { stroke-dashoffset:176; } 39%,100% { stroke-dashoffset:0; } }.signal-3 { visibility:hidden; animation:signal-3 12s linear infinite; } @keyframes signal-3 { 0%,38% { visibility:hidden;transform:translate(285px,80px); } 38.01% { visibility:visible;transform:translate(285px,80px); } 45% { visibility:visible;transform:translate(335px,235px); } 45.01%,100% { visibility:hidden;transform:translate(335px,235px); } }.arrived-3 { stroke-dasharray:176;stroke-dashoffset:0;animation:ring-3 12s infinite; } @keyframes ring-3 { 0%,45% { stroke-dashoffset:176; } 49%,100% { stroke-dashoffset:0; } }.signal-4 { visibility:hidden; animation:signal-4 12s linear infinite; } @keyframes signal-4 { 0%,48% { visibility:hidden;transform:translate(475px,80px); } 48.01% { visibility:visible;transform:translate(475px,80px); } 55% { visibility:visible;transform:translate(510px,235px); } 55.01%,100% { visibility:hidden;transform:translate(510px,235px); } }.arrived-4 { stroke-dasharray:176;stroke-dashoffset:0;animation:ring-4 12s infinite; } @keyframes ring-4 { 0%,55% { stroke-dashoffset:176; } 59%,100% { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">The BFS code discovers each node once</text>
