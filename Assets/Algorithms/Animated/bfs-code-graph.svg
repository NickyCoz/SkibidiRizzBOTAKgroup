57" y="218">5</text><circle class="tile" cx="510" cy="235" r="24"/><text class="ink" x="510" y="241">F</text><circle class="badge" cx="532" cy="214" r="11"/><text class="badge-text" x="532" y="218">6</text><g class="signal-0"><circle class="cursor" r="8"/></g><circle class="ring arrived-0" cx="285" cy="80" r="28"/><g class="signal-1"><circle class="cursor" r="8"/></g><circle class="ring arrived-1" cx="475" cy="80" r="28"/><g class="signal-2"><circle class="cursor" r="8"/></g><circle class="ring arrived-2" cx="150" cy="235" r="28"/><g class="signal-3"><circle class="cursor" r="8"/></g><circle class="ring arrived-3" cx="335" cy="235" r="28"/><g class="signal-4"><circle class="cursor" r="8"/></g><circle class="ring arrived-4" cx="510" cy="235" r="28"/><circle class="ring" cx="100" cy="80" r="28"/><text class="label small" x="320" y="305">Gold signals follow edges from each node to its newly discovered neighbors.</text><text class="label small" x="320" y="333">The graph stays fixed. Badges show discovery order.</text>
