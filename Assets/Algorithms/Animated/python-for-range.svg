<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title desc"><title id="title">A for loop over range five</title><desc id="desc">A reader advances across 0 through 4 and prints each value. The static diagram lists the full visit order.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.rangeReader{transform:translate(480px,0px);animation:rangeReader 12s linear infinite}@keyframes rangeReader{0%{transform:translate(0px,0px)}12%{transform:translate(0px,0px)}20%{transform:translate(120px,0px)}32%{transform:translate(120px,0px)}40%{transform:translate(240px,0px)}52%{transform:translate(240px,0px)}60%{transform:translate(360px,0px)}72%{transform:translate(360px,0px)}80%{transform:translate(480px,0px)}100%{transform:translate(480px,0px)}}.rangeOut0{opacity:1;animation:rangeOut0 12s steps(1,end) infinite}@keyframes rangeOut0{0%{opacity:1}100%{opacity:1}}.rangeOut1{opacity:1;animation:rangeOut1 12s steps(1,end) infinite}@keyframes rangeOut1{0%{opacity:0}20%{opacity:1}100%{opacity:1}}.rangeOut2{opacity:1;animation:rangeOut2 12s steps(1,end) infinite}@keyframes rangeOut2{0%{opacity:0}40%{opacity:1}100%{opacity:1}}.rangeOut3{opacity:1;animation:rangeOut3 12s steps(1,end) infinite}@keyframes rangeOut3{0%{opacity:0}60%{opacity:1}100%{opacity:1}}.rangeOut4{opacity:1;animation:rangeOut4 12s steps(1,end) infinite}@keyframes rangeOut4{0%{opacity:0}80%{opacity:1}100%{opacity:1}}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">for i in range(5)</text><text x="24" y="57" class="small muted" text-anchor="start" xml:space="preserve">5 is excluded.</text><rect x="80" y="142" width="64" height="48" rx="5" class="blue" /><text x="112.0" y="172.0" class="strong" text-anchor="middle" xml:space="preserve">0</text><rect x="200" y="142" width="64" height="48" rx="5" class="blue" /><text x="232.0" y="172.0" class="strong" text-anchor="middle" xml:space="preserve">1</text><rect x="320" y="142" width="64" height="48" rx="5" class="blue" /><text x="352.0" y="172.0" class="strong" text-anchor="middle" xml:space="preserve">2</text><rect x="440" y="142" width="64" height="48" rx="5" class="blue" /><text x="472.0" y="172.0" class="strong" text-anchor="middle" xml:space="preserve">3</text><rect x="560" y="142" width="64" height="48" rx="5" class="blue" /><text x="592.0" y="172.0" class="strong" text-anchor="middle" xml:space="preserve">4</text><text x="35" y="277" class="strong" text-anchor="start" xml:space="preserve">Output in order:</text><g class="rangeReader"><path d="M103 118 L112 133 L121 118 Z" class="cursor" /></g><g class="rangeOut0"><text x="35" y="319" class="mono" text-anchor="start" xml:space="preserve">0</text></g><g class="rangeOut1"><text x="100" y="319" class="mono" text-anchor="start" xml:space="preserve">1</text></g><g class="rangeOut2"><text x="165" y="319" class="mono" text-anchor="start" xml:space="preserve">2</text></g><g class="rangeOut3"><text x="230" y="319" class="mono" text-anchor="start" xml:space="preserve">3</text></g><g class="rangeOut4"><text x="295" y="319" class="mono" text-anchor="start" xml:space="preserve">4</text></g></svg>