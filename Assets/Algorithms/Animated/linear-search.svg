<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">Linear search for 68</title><desc id="desc">A pointer checks indexes 0, 1, 2, and 3, then stops at the match.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}

.probe { transform:translate(470px,110px); animation:probe 8s ease-in-out infinite; } @keyframes probe { 0% { transform:translate(170px,110px); }12% { transform:translate(170px,110px); }24% { transform:translate(270px,110px); }36% { transform:translate(270px,110px); }48% { transform:translate(370px,110px); }60% { transform:translate(370px,110px); }72% { transform:translate(470px,110px); }100% { transform:translate(470px,110px); } }
.status-0 { visibility:hidden; animation:status-0 8s steps(1,end) infinite; } @keyframes status-0 { 0% { visibility:visible; }24% { visibility:hidden; }100% { visibility:hidden; } }
.status-1 { visibility:hidden; animation:status-1 8s steps(1,end) infinite; } @keyframes status-1 { 0% { visibility:hidden; }24% { visibility:visible; }48% { visibility:hidden; }100% { visibility:hidden; } }
.status-2 { visibility:hidden; animation:status-2 8s steps(1,end) infinite; } @keyframes status-2 { 0% { visibility:hidden; }48% { visibility:visible; }72% { visibility:hidden; }100% { visibility:hidden; } }
.status-3 { visibility:visible; animation:status-3 8s steps(1,end) infinite; } @keyframes status-3 { 0% { visibility:hidden; }72% { visibility:visible; }100% { visibility:visible; } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">Linear search for 68</text>
