<svg xmlns="http://www.w3.org/2000/svg" width="640" height="415" viewBox="0 0 640 415" role="img" aria-labelledby="title desc">
<title id="title">Returned answers complete the waiting calls</title><desc id="desc">The return token follows results 1, 2, 6, 24, and 120.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}

.call-token { transform:translate(225px,344px); animation:call-token 10s ease-in-out infinite; } @keyframes call-token { 0% { transform:translate(225px,80px); }7% { transform:translate(225px,80px); }18% { transform:translate(225px,146px); }25% { transform:translate(225px,146px); }36% { transform:translate(225px,212px); }43% { transform:translate(225px,212px); }54% { transform:translate(225px,278px); }61% { transform:translate(225px,278px); }72% { transform:translate(225px,344px); }79% { transform:translate(225px,344px); }100% { transform:translate(225px,344px); } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">Returned answers complete the waiting calls</text>
<path class="edge" d="M225 103 V123"/><rect class="tile" x="143.0" y="59" width="164" height="42" rx="7"/><text class="ink" x="225" y="86">factorial(1)</text><text class="label" x="460" y="85">Return 1</text><path class="edge" d="M225 169 V189"/><rect class="tile" x="143.0" y="125" width="164" height="42" rx="7"/><text class="ink" x="225" y="152">factorial(2)</text><text class="label" x="460" y="151">Return 2</text><path class="edge" d="M225 235 V255"/><rect class="tile" x="143.0" y="191" width="164" height="42" rx="7"/><text class="ink" x="225" y="218">factorial(3)</text><text class="label" x="460" y="217">Return 6</text><path class="edge" d="M225 301 V321"/><rect class="tile" x="143.0" y="257" width="164" height="42" rx="7"/><text class="ink" x="225" y="284">factorial(4)</text><text class="label" x="460" y="283">Return 24</text><rect class="tile" x="143.0" y="323" width="164" height="42" rx="7"/><text class="ink" x="225" y="350">factorial(5)</text><text class="label" x="460" y="349">Return 120</text><g class="call-token"><rect class="ring" x="-87" y="-25" width="174" height="50" rx="10"/></g><text class="label small" x="320" y="390">Each returned answer completes the next waiting multiplication.</text>
</svg>
