<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title desc"><title id="title">Updating an element and appending to a Python list</title><desc id="desc">The original list is eight, three, five, one. Ten replaces index one; seven moves into the new final slot at index four.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.listOld{opacity:0;animation:listOld 12s steps(1,end) infinite}@keyframes listOld{0%{opacity:1}30%{opacity:0}100%{opacity:0}}.listTen{transform:translate(0px,0px);animation:listTen 12s linear infinite}@keyframes listTen{0%{transform:translate(0px,85px)}12%{transform:translate(0px,85px)}30%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.appendTravel{transform:translate(0px,0px);animation:appendTravel 12s linear infinite}@keyframes appendTravel{0%{transform:translate(130px,0px)}52%{transform:translate(130px,0px)}72%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.listSeven{opacity:1;animation:listSeven 12s steps(1,end) infinite}@keyframes listSeven{0%{opacity:0}52%{opacity:1}100%{opacity:1}}.listCap1{opacity:0;animation:listCap1 12s steps(1,end) infinite}@keyframes listCap1{0%{opacity:1}52%{opacity:0}100%{opacity:0}}.listCap2{opacity:1;animation:listCap2 12s steps(1,end) infinite}@keyframes listCap2{0%{opacity:0}52%{opacity:1}100%{opacity:1}}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">List update and append</text><text x="24" y="57" class="small muted" text-anchor="start" xml:space="preserve">numbers = [8, 3, 5, 1]</text><rect x="100" y="145" width="64" height="48" rx="5" class="blue" /><text x="132.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve">8</text><text x="132" y="131" class="small muted" text-anchor="middle" xml:space="preserve">0</text><rect x="200" y="145" width="64" height="48" rx="5" class="blue" /><text x="232.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve" /><text x="232" y="131" class="small muted" text-anchor="middle" xml:space="preserve">1</text><rect x="300" y="145" width="64" height="48" rx="5" class="blue" /><text x="332.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve">5</text><text x="332" y="131" class="small muted" text-anchor="middle" xml:space="preserve">2</text><rect x="400" y="145" width="64" height="48" rx="5" class="blue" /><text x="432.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve">1</text><text x="432" y="131" class="small muted" text-anchor="middle" xml:space="preserve">3</text><text x="532" y="131" class="small muted" text-anchor="middle" xml:space="preserve">4</text><rect x="500" y="145" width="64" height="48" rx="5" class="dash" /><g class="listOld"><text x="232" y="175" class="strong" text-anchor="middle" xml:space="preserve">3</text></g><g class="listTen"><rect x="200" y="145" width="64" height="48" rx="5" class="green" /><text x="232.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve">10</text></g><g class="appendTravel"><g class="listSeven"><rect x="500" y="145" width="64" height="48" rx="5" class="green" /><text x="532.0" y="175.0" class="strong" text-anchor="middle" xml:space="preserve">7</text></g></g><g class="listCap1"><text x="35" y="285" class="mono" text-anchor="start" xml:space="preserve">numbers[1] = 10</text></g><g class="listCap2"><text x="35" y="285" class="mono" text-anchor="start" xml:space="preserve">numbers.append(7); len(numbers) is now 5</text></g></svg>