.job-B { visibility:hidden; animation-name:job-B,hide-B; animation-duration:14s,14s; animation-timing-function:ease-in-out,steps(1,end); animation-iteration-count:infinite,infinite; } @keyframes hide-B { 0% { visibility:visible; } 36% { visibility:hidden; } 100% { visibility:hidden; } }.job-C { transform:translate(298px,199px); animation:job-C 14s ease-in-out infinite; } @keyframes job-C { 0% { transform:translate(720px,92px); }5% { transform:translate(720px,92px); }13% { transform:translate(269px,92px); }18% { transform:translate(269px,92px); }26% { transform:translate(164px,92px); }31% { transform:translate(164px,92px); }39% { transform:translate(298px,199px); }44% { transform:translate(298px,199px); }100% { transform:translate(298px,199px); } }
.job-C { visibility:hidden; animation-name:job-C,hide-C; animation-duration:14s,14s; animation-timing-function:ease-in-out,steps(1,end); animation-iteration-count:infinite,infinite; } @keyframes hide-C { 0% { visibility:visible; } 49% { visibility:hidden; } 100% { visibility:hidden; } }.job-D { transform:translate(298px,199px); animation:job-D 14s ease-in-out infinite; } @keyframes job-D { 0% { transform:translate(720px,92px); }5% { transform:translate(720px,92px); }13% { transform:translate(720px,92px); }18% { transform:translate(720px,92px); }26% { transform:translate(269px,92px); }31% { transform:translate(269px,92px); }39% { transform:translate(164px,92px); }44% { transform:translate(164px,92px); }52% { transform:translate(298px,199px); }57% { transform:translate(298px,199px); }100% { transform:translate(298px,199px); } }
.job-D { visibility:hidden; animation-name:job-D,hide-D; animation-duration:14s,14s; animation-timing-function:ease-in-out,steps(1,end); animation-iteration-count:infinite,infinite; } @keyframes hide-D { 0% { visibility:visible; } 62% { visibility:hidden; } 100% { visibility:hidden; } }.job-E { transform:translate(298px,199px); animation:job-E 14s ease-in-out infinite; } @keyframes job-E { 0% { transform:translate(720px,92px); }5% { transform:translate(720px,92px); }13% { transform:translate(720px,92px); }18% { transform:translate(720px,92px); }26% { transform:translate(374px,92px); }31% { transform:translate(374px,92px); }39% { transform:translate(269px,92px); }44% { transform:translate(269px,92px); }52% { transform:translate(164px,92px); }57% { transform:translate(164px,92px); }65% { transform:translate(298px,199px); }70% { transform:translate(298px,199px); }100% { transform:translate(298px,199px); } }
.job-E { visibility:hidden; animation-name:job-E,hide-E; animation-duration:14s,14s; animation-timing-function:ease-in-out,steps(1,end); animation-iteration-count:infinite,infinite; } @keyframes hide-E { 0% { visibility:visible; } 75% { visibility:hidden; } 100% { visibility:hidden; } }.job-F { transform:translate(298px,199px); animation:job-F 14s ease-in-out infinite; } @keyframes job-F { 0% { transform:translate(720px,92px); }5% { transform:translate(720px,92px); }13% { transform:translate(720px,92px); }18% { transform:translate(720px,92px); }26% { transform:translate(720px,92px); }31% { transform:translate(720px,92px); }39% { transform:translate(374px,92px); }44% { transform:translate(374px,92px); }52% { transform:translate(269px,92px); }57% { transform:translate(269px,92px); }65% { transform:translate(164px,92px); }70% { transform:translate(164px,92px); }78% { transform:translate(298px,199px); }83% { transform:translate(298px,199px); }100% { transform:translate(298px,199px); } }
.job-F { visibility:hidden; animation-name:job-F,hide-F; animation-duration:14s,14s; animation-timing-function:ease-in-out,steps(1,end); animation-iteration-count:infinite,infinite; } @keyframes hide-F { 0% { visibility:visible; } 88% { visibility:hidden; } 100% { visibility:hidden; } }.status-0 { visibility:hidden; animation:status-0 14s steps(1,end) infinite; } @keyframes status-0 { 0% { visibility:visible; }5% { visibility:hidden; }100% { visibility:hidden; } }
.status-1 { visibility:hidden; animation:status-1 14s steps(1,end) infinite; } @keyframes status-1 { 0% { visibility:hidden; }5% { visibility:visible; }18% { visibility:hidden; }100% { visibility:hidden; } }
.status-2 { visibility:hidden; animation:status-2 14s steps(1,end) infinite; } @keyframes status-2 { 0% { visibility:hidden; }18% { visibility:visible; }31% { visibility:hidden; }100% { visibility:hidden; } }
.status-3 { visibility:hidden; animation:status-3 14s steps(1,end) infinite; } @keyframes status-3 { 0% { visibility:hidden; }31% { visibility:visible; }44% { visibility:hidden; }100% { visibility:hidden; } }
.status-4 { visibility:hidden; animation:status-4 14s steps(1,end) infinite; } @keyframes status-4 { 0% { visibility:hidden; }44% { visibility:visible; }57% { visibility:hidden; }100% { visibility:hidden; } }
.status-5 { visibility:hidden; animation:status-5 14s steps(1,end) infinite; } @keyframes status-5 { 0% { visibility:hidden; }57% { visibility:visible; }70% { visibility:hidden; }100% { visibility:hidden; } }
.status-6 { visibility:hidden; animation:status-6 14s steps(1,end) infinite; } @keyframes status-6 { 0% { visibility:hidden; }70% { visibility:visible; }83% { visibility:hidden; }100% { visibility:hidden; } }
.status-7 { visibility:visible; animation:status-7 14s steps(1,end) infinite; } @keyframes status-7 { 0% { visibility:hidden; }83% { visibility:visible; }100% { visibility:visible; } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">BFS queue entries arrive and leave in order</text>
<path class="edge" d="M133 92H567"/><text class="label" x="144" y="63">Front</text><text class="label" x="548" y="63">Rear</text><rect class="tile" x="203" y="175" width="190" height="48" rx="8"/><text class="label small" x="298" y="241">Processing</text><g class="job-A"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">A</text></g><g class="job-B"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">B</text></g><g class="job-C"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">C</text></g><g class="job-D"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">D</text></g><g class="job-E"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">E</text></g><g class="job-F"><rect class="tile" x="-36.0" y="-21" width="72" height="42" rx="7"/><text class="ink" x="0" y="6">F</text></g><g class="status-0"><text class="label" x="320" y="272">Start with A in the queue.</text></g><g class="status-1"><text class="label" x="320" y="272">Take A. Add its neighbors B and C.</text></g><g class="status-2"><text class="label" x="320" y="272">Take B. Add D and E after C.</text></g><g class="status-3"><text class="label" x="320" y="272">Take C. Add F after D and E.</text></g><g class="status-4"><text class="label" x="320" y="272">Take D. E and F advance toward the front.</text></g><g class="status-5"><text class="label" x="320" y="272">Take E. F is the only waiting node.</text></g><g class="status-6"><text class="label" x="320" y="272">Take F. No new neighbors need to join.</text></g><g class="status-7"><text class="label" x="320" y="272">The queue is now empty.</text></g>
</svg>
