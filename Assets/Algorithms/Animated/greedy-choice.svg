<svg xmlns="http://www.w3.org/2000/svg" width="640" height="307" viewBox="0 0 640 307" role="img" aria-labelledby="title desc">
<title id="title">A cheap next edge can lead to an expensive route</title><desc id="desc">A marker takes edge cost 2, then edge cost 9. The total is 11 rather than the alternative cost 4.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}

.greedy-probe { transform:translate(520px,145px); animation:greedy-probe 9s ease-in-out infinite; } @keyframes greedy-probe { 0% { transform:translate(110px,145px); }15% { transform:translate(110px,145px); }38% { transform:translate(300px,75px); }54% { transform:translate(300px,75px); }78% { transform:translate(520px,145px); }100% { transform:translate(520px,145px); } }
.status-0 { visibility:hidden; animation:status-0 9s steps(1,end) infinite; } @keyframes status-0 { 0% { visibility:visible; }38% { visibility:hidden; }100% { visibility:hidden; } }
.status-1 { visibility:hidden; animation:status-1 9s steps(1,end) infinite; } @keyframes status-1 { 0% { visibility:hidden; }38% { visibility:visible; }78% { visibility:hidden; }100% { visibility:hidden; } }
.status-2 { visibility:visible; animation:status-2 9s steps(1,end) infinite; } @keyframes status-2 { 0% { visibility:hidden; }78% { visibility:visible; }100% { visibility:visible; } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">A cheap next edge can lead to an expensive route</text>
<path class="edge" d="M110 145 L300 75"/><path class="edge" d="M110 145 L300 215"/><path class="edge" d="M300 75 L520 145"/><path class="edge" d="M300 215 L520 145"/><circle class="tile" cx="110" cy="145" r="24"/><text class="ink" x="110" y="151">A</text><circle class="tile" cx="300" cy="75" r="24"/><text class="ink" x="300" y="81">B</text><circle class="tile" cx="300" cy="215" r="24"/><text class="ink" x="300" y="221">C</text><circle class="tile" cx="520" cy="145" r="24"/><text class="ink" x="520" y="151">D</text><text class="label" x="217.0" y="98.0">2</text><text class="label" x="217.0" y="168.0">3</text><text class="label" x="422.0" y="98.0">9</text><text class="label" x="422.0" y="168.0">1</text><g class="greedy-probe"><circle r="29" style="fill:none;stroke:#c28713;stroke-width:3px"/></g><g class="status-0"><text class="label" x="320" y="279">At A: edge cost 2 looks cheaper than edge cost 3.</text></g><g class="status-1"><text class="label" x="320" y="279">At B: the remaining edge costs 9.</text></g><g class="status-2"><text class="label" x="320" y="279">Total cost 11. The route through C costs only 4.</text></g>
</svg>
