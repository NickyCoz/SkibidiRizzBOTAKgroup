<svg xmlns="http://www.w3.org/2000/svg" width="640" height="326" viewBox="0 0 640 326" role="img" aria-labelledby="title desc">
<title id="title">The call stack grows, then unwinds</title><desc id="desc">Calls 5 to 1 are pushed. Calls 1 to 5 return and leave the stack.</desc>
<style>
text { font: 16px system-ui, sans-serif; text-anchor: middle; fill: #14243a; }
.label { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linejoin: round; }
.heading { font-size: 20px; font-weight: 700; }
.small { font-size: 13px; }
.tile { fill: #dbeafe; stroke: #4169a9; stroke-width: 2; }
.focus { fill: #a7f3d0; stroke: #16835e; }
.muted { fill: #e2e8f0; stroke: #64748b; }
.edge { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route { stroke: #16835e; stroke-width: 4; fill: none; stroke-linecap: round; }
.badge { fill: #334155; stroke: #f8fafc; stroke-width: 1.5; }
.badge-text { fill: #fff; font-size: 12px; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .label { fill: #f8fafc; stroke: #111827; }
  .edge { stroke: #b8c7db; }
  .route { stroke: #4ade80; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.frame-5 { opacity:0; animation:frame-5 12s infinite; } @keyframes frame-5 { 0%,0% { opacity:0; transform:translateX(145px); } 5%,86% { opacity:1; transform:translateX(0); } 91%,100% { opacity:0; transform:translateX(-145px); } }
.frame-4 { opacity:0; animation:frame-4 12s infinite; } @keyframes frame-4 { 0%,9% { opacity:0; transform:translateX(145px); } 14%,79% { opacity:1; transform:translateX(0); } 84%,100% { opacity:0; transform:translateX(-145px); } }
.frame-3 { opacity:0; animation:frame-3 12s infinite; } @keyframes frame-3 { 0%,18% { opacity:0; transform:translateX(145px); } 23%,72% { opacity:1; transform:translateX(0); } 77%,100% { opacity:0; transform:translateX(-145px); } }
.frame-2 { opacity:0; animation:frame-2 12s infinite; } @keyframes frame-2 { 0%,27% { opacity:0; transform:translateX(145px); } 32%,65% { opacity:1; transform:translateX(0); } 70%,100% { opacity:0; transform:translateX(-145px); } }
.frame-1 { opacity:0; animation:frame-1 12s infinite; } @keyframes frame-1 { 0%,36% { opacity:0; transform:translateX(145px); } 41%,58% { opacity:1; transform:translateX(0); } 63%,100% { opacity:0; transform:translateX(-145px); } }
@media (prefers-reduced-motion: reduce) { [class^="frame-"] { opacity:1;transform:none; } }</style>
<text class="label heading" x="320" y="29">The call stack grows, then unwinds</text>
<g class="frame-5"><rect class="tile" x="207.5" y="231" width="225" height="40" rx="7"/><text class="ink" x="320" y="257">factorial(5)</text></g><g class="frame-4"><rect class="tile" x="207.5" y="187" width="225" height="40" rx="7"/><text class="ink" x="320" y="213">factorial(4)</text></g><g class="frame-3"><rect class="tile" x="207.5" y="143" width="225" height="40" rx="7"/><text class="ink" x="320" y="169">factorial(3)</text></g><g class="frame-2"><rect class="tile" x="207.5" y="99" width="225" height="40" rx="7"/><text class="ink" x="320" y="125">factorial(2)</text></g><g class="frame-1"><rect class="tile focus" x="207.5" y="55" width="225" height="40" rx="7"/><text class="ink" x="320" y="81">factorial(1)</text></g><text class="label small" x="320" y="304">Calls enter on the right and return on the left.</text>
</svg>
