<svg xmlns="http://www.w3.org/2000/svg" width="640" height="358" viewBox="0 0 640 358" role="img" aria-labelledby="title desc">
<title id="title">DFS moves down branches and backtracks</title><desc id="desc">The marker follows A B D B E B A C F C G. Badges count only first visits.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}

.dfs-probe { transform:translate(535px,242px); animation:dfs-probe 15s ease-in-out infinite; } @keyframes dfs-probe { 0% { transform:translate(320px,78px); }2% { transform:translate(320px,78px); }8% { transform:translate(180px,157px); }10% { transform:translate(180px,157px); }16% { transform:translate(105px,242px); }18% { transform:translate(105px,242px); }24% { transform:translate(180px,157px); }26% { transform:translate(180px,157px); }32% { transform:translate(245px,242px); }34% { transform:translate(245px,242px); }40% { transform:translate(180px,157px); }42% { transform:translate(180px,157px); }48% { transform:translate(320px,78px); }50% { transform:translate(320px,78px); }56% { transform:translate(460px,157px); }58% { transform:translate(460px,157px); }64% { transform:translate(395px,242px); }66% { transform:translate(395px,242px); }72% { transform:translate(460px,157px); }74% { transform:translate(460px,157px); }80% { transform:translate(535px,242px); }82% { transform:translate(535px,242px); }100% { transform:translate(535px,242px); } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">DFS moves down branches and backtracks</text>
<path class="edge" d="M320 78 L180 157"/><path class="edge" d="M320 78 L460 157"/><path class="edge" d="M180 157 L105 242"/><path class="edge" d="M180 157 L245 242"/><path class="edge" d="M460 157 L395 242"/><path class="edge" d="M460 157 L535 242"/><circle class="tile" cx="320" cy="78" r="24"/><text class="ink" x="320" y="84">A</text><circle class="badge" cx="342" cy="57" r="11"/><text class="badge-text" x="342" y="61">1</text><circle class="tile" cx="180" cy="157" r="24"/><text class="ink" x="180" y="163">B</text><circle class="badge" cx="202" cy="136" r="11"/><text class="badge-text" x="202" y="140">2</text><circle class="tile" cx="460" cy="157" r="24"/><text class="ink" x="460" y="163">C</text><circle class="badge" cx="482" cy="136" r="11"/><text class="badge-text" x="482" y="140">5</text><circle class="tile" cx="105" cy="242" r="24"/><text class="ink" x="105" y="248">D</text><circle class="badge" cx="127" cy="221" r="11"/><text class="badge-text" x="127" y="225">3</text><circle class="tile" cx="245" cy="242" r="24"/><text class="ink" x="245" y="248">E</text><circle class="badge" cx="267" cy="221" r="11"/><text class="badge-text" x="267" y="225">4</text><circle class="tile" cx="395" cy="242" r="24"/><text class="ink" x="395" y="248">F</text><circle class="badge" cx="417" cy="221" r="11"/><text class="badge-text" x="417" y="225">6</text><circle class="tile" cx="535" cy="242" r="24"/><text class="ink" x="535" y="248">G</text><circle class="badge" cx="557" cy="221" r="11"/><text class="badge-text" x="557" y="225">7</text><g class="dfs-probe"><circle r="29" style="fill:none;stroke:#c28713;stroke-width:3px"/></g><text class="label small" x="320" y="305">The gold marker follows a branch, then returns along edges to try another.</text><text class="label small" x="320" y="334">Returning to a node does not count as a new visit.</text>
</svg>
