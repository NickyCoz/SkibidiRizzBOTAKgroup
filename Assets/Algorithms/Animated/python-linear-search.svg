<svg xmlns="http://www.w3.org/2000/svg" width="760" height="325" viewBox="0 0 760 325" role="img" aria-labelledby="title desc"><title id="title">Linear search for five in the Python example</title><desc id="desc">The comparison pointer checks eight, then three, then five, returning index two. One is not checked. A note explains that target ten returns minus one.</desc><style>
text{font:16px Arial,sans-serif;fill:#142b42}.title{font-size:22px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:700}.mono{font:15px Consolas,monospace}.large{font-size:30px;font-weight:700}.muted{fill:#465d73}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.amberText{fill:#92400e}
.paper{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#4169a9;stroke-width:1.5}.green{fill:#d1fae5;stroke:#16835e;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.blank{fill:none}.rule{fill:none;stroke:#94a3b8;stroke-width:1.4}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tip{fill:#52677b}.inkLine{fill:none;stroke:#142b42;stroke-width:2;stroke-linecap:round}.cursor{fill:#16835e;stroke:#075c42;stroke-width:1}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.muted{fill:#c3d2e3}.paper{fill:#1e293b;stroke:#a1b2c6}.blue{fill:#193957;stroke:#93b4e8}.green{fill:#164e43;stroke:#6ee7b7}.amber{fill:#493d20;stroke:#fcd34d}.rule,.dash{stroke:#72869e}.edge{stroke:#b8c7db}.tip{fill:#b8c7db}.greenText{fill:#6ee7b7}.blueText{fill:#93c5fd}.amberText{fill:#fcd34d}.inkLine{stroke:#e2e8f0}.cursor{fill:#6ee7b7;stroke:#b7f7df}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.searchReader{transform:translate(290px,0px);animation:searchReader 12s linear infinite}@keyframes searchReader{0%{transform:translate(0px,0px)}18%{transform:translate(0px,0px)}30%{transform:translate(145px,0px)}48%{transform:translate(145px,0px)}60%{transform:translate(290px,0px)}100%{transform:translate(290px,0px)}}.searchCap0{opacity:0;animation:searchCap0 12s steps(1,end) infinite}@keyframes searchCap0{0%{opacity:1}30%{opacity:0}100%{opacity:0}}.searchCap1{opacity:0;animation:searchCap1 12s steps(1,end) infinite}@keyframes searchCap1{0%{opacity:0}30%{opacity:1}60%{opacity:0}100%{opacity:0}}.searchCap2{opacity:1;animation:searchCap2 12s steps(1,end) infinite}@keyframes searchCap2{0%{opacity:0}60%{opacity:1}100%{opacity:1}}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="tip" /></marker></defs><text x="24" y="30" class="title" text-anchor="start" xml:space="preserve">Linear search: target 5</text><rect x="100" y="138" width="64" height="48" rx="5" class="blue" /><text x="132.0" y="168.0" class="strong" text-anchor="middle" xml:space="preserve">8</text><text x="132" y="124" class="small muted" text-anchor="middle" xml:space="preserve">0</text><rect x="245" y="138" width="64" height="48" rx="5" class="blue" /><text x="277.0" y="168.0" class="strong" text-anchor="middle" xml:space="preserve">3</text><text x="277" y="124" class="small muted" text-anchor="middle" xml:space="preserve">1</text><rect x="390" y="138" width="64" height="48" rx="5" class="blue" /><text x="422.0" y="168.0" class="strong" text-anchor="middle" xml:space="preserve">5</text><text x="422" y="124" class="small muted" text-anchor="middle" xml:space="preserve">2</text><rect x="535" y="138" width="64" height="48" rx="5" class="blue" /><text x="567.0" y="168.0" class="strong" text-anchor="middle" xml:space="preserve">1</text><text x="567" y="124" class="small muted" text-anchor="middle" xml:space="preserve">3</text><g class="searchReader"><path d="M123 80 L132 95 L141 80 Z" class="cursor" /></g><g class="searchCap0"><text x="35" y="280" class="strong" text-anchor="start" xml:space="preserve">8 != 5; next index.</text></g><g class="searchCap1"><text x="35" y="280" class="strong" text-anchor="start" xml:space="preserve">3 != 5; next index.</text></g><g class="searchCap2"><text x="35" y="280" class="strong" text-anchor="start" xml:space="preserve">5 == 5; return index 2.</text></g></svg>