<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
<title id="title">Binary search for 11</title><desc id="desc">The range shrinks from indexes 0–6 to 4–6, and the midpoint moves from index 3 to 5.</desc>
<style>
text { font:16px system-ui,sans-serif; text-anchor:middle; fill:#14243a; }
.label { paint-order:stroke; stroke:#f8fafc; stroke-width:3px; stroke-linejoin:round; }
.heading { font-size:20px; font-weight:700; }
.small { font-size:13px; }
.tile { fill:#dbeafe; stroke:#4169a9; stroke-width:2px; }
.chosen { fill:#a7f3d0; stroke:#16835e; }
.edge { fill:none; stroke:#64748b; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
.route { fill:none; stroke:#16835e; stroke-width:4px; stroke-linecap:round; }
.cursor { fill:#fde68a; stroke:#92630e; stroke-width:2px; }
.ring { fill:none; stroke:#16835e; stroke-width:3px; }
.badge { fill:#334155; stroke:#f8fafc; stroke-width:1.5px; }
.badge-text { fill:#fff; font-size:12px; font-weight:700; }
@media (prefers-color-scheme:dark) {
 .label { fill:#f8fafc; stroke:#111827; }
 .edge { stroke:#b8c7db; }
 .route,.ring { stroke:#4ade80; }
}


.active-range { x:360px; width:232px; animation:shrink 8s infinite; }
@keyframes shrink { 0%,31% { x:48px;width:544px; } 49%,100% { x:360px;width:232px; } }
.discarded { stroke-dasharray:294; stroke-dashoffset:0; animation:discard 8s infinite; }
@keyframes discard { 0%,31% { stroke-dashoffset:294; } 49%,100% { stroke-dashoffset:0; } }
.midpoint { transform:translate(476px,0px); animation:midpoint 8s ease-in-out infinite; } @keyframes midpoint { 0% { transform:translate(320px,0px); }31% { transform:translate(320px,0px); }55% { transform:translate(476px,0px); }100% { transform:translate(476px,0px); } }
.status-0 { visibility:hidden; animation:status-0 8s steps(1,end) infinite; } @keyframes status-0 { 0% { visibility:visible; }31% { visibility:hidden; }100% { visibility:hidden; } }
.status-1 { visibility:hidden; animation:status-1 8s steps(1,end) infinite; } @keyframes status-1 { 0% { visibility:hidden; }31% { visibility:visible; }55% { visibility:hidden; }100% { visibility:hidden; } }
.status-2 { visibility:visible; animation:status-2 8s steps(1,end) infinite; } @keyframes status-2 { 0% { visibility:hidden; }55% { visibility:visible; }100% { visibility:visible; } }

@media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<text class="label heading" x="320" y="29">Binary search for 11</text>
<rect class="tile" x="53.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="86" y="119">1</text><text class="label small" x="86" y="74">0</text><rect class="tile" x="131.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="164" y="119">3</text><text class="label small" x="164" y="74">1</text><rect class="tile" x="209.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="242" y="119">5</text><text class="label small" x="242" y="74">2</text><rect class="tile" x="287.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="320" y="119">7</text><text class="label small" x="320" y="74">3</text><rect class="tile" x="365.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="398" y="119">9</text><text class="label small" x="398" y="74">4</text><rect class="tile" x="443.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="476" y="119">11</text><text class="label small" x="476" y="74">5</text><rect class="tile" x="521.0" y="92" width="66" height="42" rx="7"/><text class="ink" x="554" y="119">13</text><text class="label small" x="554" y="74">6</text><rect class="active-range ring" x="48" y="88" width="544" height="50" rx="9"/><g class="midpoint"><text class="label" x="0" y="169">▲ Midpoint</text></g><path class="discarded" d="M55 112H349" stroke="#64748b" stroke-width="3" stroke-dasharray="6 5"/><g class="status-0"><text class="label" x="320" y="211">Middle value 7 is smaller than 11.</text></g><g class="status-1"><text class="label" x="320" y="211">Discard indexes 0–3. Keep only indexes 4–6.</text></g><g class="status-2"><text class="label" x="320" y="211">The new middle value is 11. Found at index 5.</text></g><text class="label small" x="320" y="245">The green outline is the remaining search range.</text>
</svg>
